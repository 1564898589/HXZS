/* ============================================================
   十六、引擎 · 会议
   ============================================================ */
function meetingAvailable(){
  var rank=G.rank,out=[],tier=ROLES[rank].tier;
  if(tier==="nation")return ["ministry","special","demo"];
  if(tier==="state")return ["cabinet","special","demo"];
  /* 按职级解锁：科员只能参加专题会/民主生活会；副科级以上列席常委会；正科级以上主持常务会、参加干部大会 */
  out.push("special");
  out.push("demo");
  if(rank>=1)out.push("standing");
  if(rank>=2)out.push("exec");
  if(rank>=2)out.push("cadre");
  return out;
}
function meetingTitle(key){
  var m=MEETINGS[key],tier=ROLES[G.rank].tier;
  if(key==="standing"&&tier==="town")return "镇党委会";
  if(key==="standing"&&tier==="county")return "县委常委会";
  if(key==="standing"&&tier==="city")return "市委常委会";
  if(key==="standing"&&tier==="prov")return "省委常委会";
  if(key==="exec"&&tier==="town")return "镇长办公会";
  if(key==="exec"&&tier==="county")return "县政府常务会";
  if(key==="exec"&&tier==="city")return "市政府常务会";
  if(key==="exec"&&tier==="prov")return "省政府常务会";
  if(key==="ministry"&&G.ministry)return G.ministry.n+"部务会议";
  return m.name;
}
function pickAgendas(n,r,demo){
  var tier=ROLES[G.rank].tier;
  var pool=AGENDAS.filter(function(a){
    if(a.tier&&a.tier.indexOf(tier)<0)return false;
    if(demo)return !!a.demo;
    return !a.demo;
  });
  if(!pool.length)pool=AGENDAS.slice();
  var used={},out=[],guard=0;
  while(out.length<n&&guard++<60){
    var pick=null,best=-1;
    for(var i=0;i<pool.length;i++){
      var a=pool[i];if(used[a.id])continue;
      var w=(a.w||5)*r.next();
      if(w>best){best=w;pick=a;}
    }
    if(!pick)break;
    used[pick.id]=1;out.push(deep(pick));
  }
  return out;
}
function openMeeting(typeKey){
  if(!G||G.ended||G.queue.length)return;
  if(G.screen)return;
  if(!typeKey){
    /* 没指定类型：自动挑最合适的 */
    var list=meetingAvailable();
    typeKey=list[0];
  }
  var def=MEETINGS[typeKey];
  if(!def)return;
  if(G.energy<def.energy){toast("精力不足，开会至少要 "+def.energy+" 点精力");return;}
  var r=new RNG(G.seed+G.year*211+G.month*37+G.sched.cur*13+strHash(typeKey));
  var n=def.agendaN[0]+r.range(0,def.agendaN[1]-def.agendaN[0]);
  var attendees=[];
  var pool=[];
  if(G.npc.boss&&G.npc.boss.wid)pool.push(G.npc.boss.wid);
  if(G.npc.disc&&G.npc.disc.wid)pool.push(G.npc.disc.wid);
  if(G.npc.rival&&G.npc.rival.wid)pool.push(G.npc.rival.wid);
  (G.npc.peers||[]).forEach(function(p){if(p.wid)pool.push(p.wid);});
  /* 再从同层级世界人物里补足 */
  var tier=ROLES[G.rank].tier;
  var extra=G.world.npcs.filter(function(x){
    return x.tier===tier&&x.alive&&x.status==="active"&&pool.indexOf(x.id)<0&&!x.jur;
  });
  extra=shuffle(extra,r);
  var want=def.size[0]+r.range(0,def.size[1]-def.size[0]);
  pool=pool.concat(extra.slice(0,want).map(function(x){return x.id;}));
  pool=pool.slice(0,Math.max(3,want));
  pool.forEach(function(id){var p=findNpc(id);if(p){p.follow=false;p.lobbied=false;attendees.push(id);}});
  G.energy=clamp(G.energy-def.energy,0,100);
  G.meetState={
    key:typeKey,name:meetingTitle(typeKey),def:def,
    attendees:attendees,agendas:pickAgendas(n,r,typeKey==="demo"),
    idx:0,phase:"agenda",lastVote:null,history:[],lobbyCount:0,
    lobbyQuota:0,leakCount:0,briefed:false,
    hostId:(def.hostTag==="boss"&&G.npc.boss)?G.npc.boss.wid:null,
    seed:r.range(1,1e9)
  };
  G.meetState.lobbyQuota=lobbyQuotaFor();
  G.screen="meeting";
  G.sched.cells[G.sched.cur]={key:"meeting",name:"参加"+G.meetState.name};
  pushLog(slotLabel(G.sched.cur)+"·"+G.meetState.name);
  save();render();
}
function attendeeStance(attId,optIdx){
  var n=findNpc(attId);if(!n)return "swing";
  var ms=G.meetState,ag=ms.agendas[ms.idx];
  var opt=ag.options[optIdx];
  if(n.follow)return "support";
  var diff=Math.abs((n.toneBias||0)-opt.tone);
  if(diff<=0.5)return "support";
  if(diff>=1.2)return "oppose";
  return "swing";
}
function playerInfluence(){
  var s=G.stats;
  return clamp(s.trust*0.30+s.peers*0.35+G.rank*3.2+s.popularity*0.10,5,95);
}
function stanceReason(attId,optIdx){
  var n=findNpc(attId);if(!n)return "";
  var ms=G.meetState,ag=ms.agendas[ms.idx],opt=ag.options[optIdx];
  var st=attendeeStance(attId,optIdx);
  var diff=(n.toneBias||0)-opt.tone;
  var p=n.persona||{};
  if(n.follow)return "会前已经跟你通了气，表态会跟你走";
  if(st==="support"){
    if(diff<-0.5)return n.trait+"，一贯求稳，这个方案合他的路子";
    if(diff>0.5)return n.trait+"，倾向闯一闯，愿意支持";
    return n.trait+"，与你的方案基本合拍";
  }
  if(st==="oppose"){
    if(diff>0.8)return n.trait+"，怕出事、怕担责，这个方案太冒进";
    return n.trait+"，主张稳一点，不太认可这么干";
  }
  return n.trait+"，态度还没明朗，看风向";
}
/* ---------- 会前沟通 ----------
   为什么不能"把所有人拉一遍"：
   ① 每个议题只有有限额度（随层级小幅提升，永远小于与会人数）；
   ② 越往后沟通，边际精力成本越高（4 → 11 点）；
   ③ 每多谈一个人，被主要领导察觉的概率就往上抬一档。
   另有"集体吹风"：不点名、不站队，小幅抬高全场好感，但不锁票。 */
function lobbyQuotaFor(){
  var n=G.meetState?G.meetState.attendees.length:6;
  var q=Math.round(BAL.lobbyQuotaBase+G.rank*BAL.lobbyQuotaRank);
  return clamp(q,1,Math.max(1,n-1));
}
function lobbyCostNow(){
  var used=(G.meetState&&G.meetState.lobbyCount)||0;
  return Math.round(Math.min(BAL.lobbyCostBase+used*BAL.lobbyCostStep,BAL.lobbyCostCap));
}
function lobbyQuotaLeft(){
  var ms=G.meetState;if(!ms)return 0;
  return Math.max(0,(ms.lobbyQuota||0)-(ms.lobbyCount||0));
}
function lobbyAttendee(attId){
  var ms=G.meetState;if(!ms||ms.phase!=="agenda")return;
  var n=findNpc(attId);if(!n)return;
  if(n.follow){toast("他已经站在你这边了");return;}
  if(ms.lobbied&&ms.lobbied[attId]){toast("这一项已经沟通过了");return;}
  if(lobbyQuotaLeft()<=0){toast("这场会的私下沟通额度已用完（最多 "+ms.lobbyQuota+" 人）");return;}
  var cost=lobbyCostNow();
  if(G.energy<cost){toast("精力不足，这一次沟通要 "+cost+" 点精力");return;}
  var rel=getRel(attId);
  var r=new RNG(ms.seed+G.year*17+G.month*7+ms.idx*31+strHash(attId));
  /* 越往后越难谈：额度用掉一半后，对方的顾虑会明显增加 */
  var fatigue=ms.lobbyCount*3.2;
  var rate=clamp(18+rel.like*0.35+rel.trust*0.30+rel.favor*6+G.stats.competence*0.18-rel.fear*0.08-fatigue,3,88);
  var ok=r.chance(rate/100);
  G.energy=clamp(G.energy-cost,0,100);
  if(!ms.lobbied)ms.lobbied={};
  ms.lobbied[attId]=1;ms.lobbyCount++;
  if(ok){n.follow=true;remember(n,"会前被你沟通，会上站在你这边。","scheme");}
  else{rel.like=clamp(rel.like-3,-100,100);remember(n,"会前你找他通气，他没有答应。","scheme");}
  /* 走漏：被主要领导察觉 */
  var leakP=clamp(BAL.lobbyLeakBase+ms.lobbyCount*BAL.lobbyLeakStep,0,0.9);
  var leaked=false;
  if(r.chance(leakP)){
    leaked=true;
    G.stats.trust=clamp(G.stats.trust-r.range(1,3),0,100);
    ms.leakCount=(ms.leakCount||0)+1;
    if(G.npc.boss){var b=findNpc(G.npc.boss.wid);if(b)remember(b,"你为了一个议题四处找人，被他看在眼里。","warn");}
  }
  ms.lastLobby={id:attId,ok:ok,rate:Math.round(rate),cost:cost,leaked:leaked,left:lobbyQuotaLeft()};
  save();render();
}
/* 集体吹风：一次会议限一次，全场好感小幅上升，但不锁定立场 */
function lobbyBrief(){
  var ms=G.meetState;if(!ms||ms.phase!=="agenda")return;
  if(ms.briefed){toast("这场会已经吹过风了");return;}
  if(G.energy<BAL.lobbyBriefCost){toast("精力不足，集体吹风要 "+BAL.lobbyBriefCost+" 点精力");return;}
  G.energy=clamp(G.energy-BAL.lobbyBriefCost,0,100);
  ms.briefed=true;
  ms.attendees.forEach(function(id){
    var rel=getRel(id);
    rel.like=clamp(rel.like+BAL.lobbyBriefGain,0,100);
  });
  enqueueTip("会前集体吹风",
    "你在会前把口径统一了一遍，话说得四平八稳，没有点名、没有站队。\n"
    +"与会者的好感都往上抬了一点（+"+BAL.lobbyBriefGain+"），但没人因此承诺投赞成票——"
    +"真正的票，还得靠议题本身和你的影响力。",true);
  save();render();
}
function meetingVote(optIdx){
  var ms=G.meetState;if(!ms||ms.phase!=="agenda")return;
  var ag=ms.agendas[ms.idx];
  var r=new RNG(ms.seed+G.year*13+ms.idx*7+optIdx*3);
  var inf=playerInfluence();
  var sup=1,opp=0,abs=0,detail=[];
  ms.attendees.forEach(function(id){
    var n=findNpc(id);if(!n)return;
    var st=attendeeStance(id,optIdx);
    var rel=getRel(id);
    var personal=rel.like*0.3+rel.trust*0.2+rel.favor*5;
    if(st==="swing"){
      var c=clamp((inf+personal)/150,0.05,0.85);
      if(r.chance(c)){st="support";}else if(r.chance(0.35)){st="oppose";}else{st="abstain";}
    }else if(st==="oppose"){
      var c2=clamp((inf+personal)/260,0.02,0.5);
      if(r.chance(c2))st="abstain";
    }
    if(st==="support")sup++;
    else if(st==="oppose")opp++;
    else abs++;
    detail.push({id:id,st:st});
  });
  var total=sup+opp+abs;
  var pass=sup>opp&&sup>=Math.ceil(total/2);
  var margin=sup-opp;
  /* 方案效果：通过则按优势放大，否决则只留一小部分 */
  var fx=deep(ag.options[optIdx].fx||{});
  if(!pass){
    Object.keys(fx).forEach(function(k){
      var v=fx[k];
      var mid=Array.isArray(v)?(v[0]+v[1])/2:v;
      var sign=isNegKey(k)?-1:1;
      /* 否决：正向收益归零，代价保留一半 */
      if(mid*sign>0)fx[k]=0;
      else fx[k]=Array.isArray(v)?[Math.round(v[0]*0.4),Math.round(v[1]*0.4)]:Math.round(v*0.4);
    });
    G.stats.trust=clamp(G.stats.trust-r.range(1,3),0,100);
  }else{
    var scale=margin>=3?1.15:margin>=1?1:0.85;
    Object.keys(fx).forEach(function(k){
      var v=fx[k];
      fx[k]=Array.isArray(v)?[Math.round(v[0]*scale),Math.round(v[1]*scale)]:Math.round(v*scale);
    });
  }
  applyFx(fx,r);
  /* 与主要领导是否合拍 */
  var bossLean=null;
  if(ms.hostId){var b=findNpc(ms.hostId);if(b)bossLean=b.toneBias;}
  if(bossLean!==null){
    var bd=Math.abs(bossLean-ag.options[optIdx].tone);
    if(bd<=0.5)G.stats.trust=clamp(G.stats.trust+r.range(1,3),0,100);
    else if(bd>=1.3)G.stats.trust=clamp(G.stats.trust-r.range(1,3),0,100);
  }
  ms.lastVote={optIdx:optIdx,sup:sup,opp:opp,abs:abs,pass:pass,margin:margin,detail:detail,fx:fx,
    fxShow:deep(ag.options[optIdx].fx||{})};
  ms.agendas[ms.idx].result=ms.lastVote;
  ms.phase="result";
  pushLog(ms.name+"·"+ag.t+"："+(pass?"通过":"未通过")+"（"+sup+" 赞成 / "+opp+" 反对）",pass?"up":"warn");
  save();render();
}
function meetingNext(){
  var ms=G.meetState;if(!ms)return;
  if(ms.phase==="result"){
    ms.history.push({t:ms.agendas[ms.idx].t,vote:ms.lastVote});
    ms.idx++;
    ms.lobbied={};ms.lastLobby=null;ms.lastVote=null;
    if(ms.idx>=ms.agendas.length){ms.phase="done";}
    else ms.phase="agenda";
    save();render();return;
  }
  if(ms.phase==="done"){closeMeeting();}
}
function closeMeeting(){
  var ms=G.meetState;
  G.meetState=null;G.screen=null;
  var pass=ms?ms.history.filter(function(h){return h.vote.pass;}).length:0;
  var all=ms?ms.history.length:0;
  toast("会议结束：共议 "+(all||0)+" 项，通过 "+pass+" 项");
  advanceSlot();
}
function openMeetingPicker(){
  if(G.screen)return;
  G.screen="meetpick";save();render();
}

/* ============================================================
   十七、引擎 · 财政预算
   ============================================================ */
function budgetTotal(){
  /* 财政盘子随层级分档：乡镇量入为出、盘子小；越往上盘子越大，贴近现实 */
  var t=ROLES[G.rank].tier;
  var base={town:7,county:11,city:15,prov:20,nation:24,state:26}[t]||9;
  return Math.round(base+G.local.finance*0.08+G.local.economy*0.04+G.rank*0.7);
}
function initBudget(){
  var N=budgetTotal(),items={};
  BUDGET_ITEMS.forEach(function(it){items[it.k]=2;});
  /* 默认按标准配置：每项 2 档，超出的按债务→民生顺序补 */
  var sum=Object.keys(items).reduce(function(a,k){return a+items[k];},0);
  while(sum>N){
    /* 从最不刚性的项减 */
    var order=["admin","industry","eco","infra","healthcare","education","safety","livelihood","debt"];
    for(var i=0;i<order.length&&sum>N;i++){
      if(items[order[i]]>0){items[order[i]]--;sum--;}
    }
  }
  return {items:items,total:N,applied:false};
}
function budgetUsed(){var b=G.budget;if(!b)return 0;return Object.keys(b.items).reduce(function(a,k){return a+b.items[k];},0);}
function budAdj(k,d){
  var b=G.budget;if(!b||b.applied)return;
  var v=b.items[k]+d;
  if(v<0||v>4)return;
  var used=budgetUsed();
  if(d>0&&used+1>b.total){toast("可分配档数已用完（共 "+b.total+" 档）");return;}
  b.items[k]=v;save();render();
}
function openBudget(){
  if(!G||G.ended)return;
  if(!G.budget)G.budget=initBudget();
  G.screen="budget";save();render();
}
function confirmBudget(){
  var b=G.budget;if(!b)return;
  var used=budgetUsed();
  if(used<b.total&&!confirm2("还有 "+(b.total-used)+" 档没有分配，未分配的档位会作为预备费保留。确定提交吗？"))return;
  var r=new RNG(G.seed+G.year*307+17);
  var lines=[];
  BUDGET_ITEMS.forEach(function(it){
    var lv=b.items[it.k];
    if(!lv)return;
    var fx={},k=it.k;
    Object.keys(it.fx).forEach(function(sk){
      fx[sk]=Math.round(it.fx[sk]*lv/4*10)/10;
    });
    applyFx(fx,r);
    lines.push(it.n+"："+(lv===4?"很高":lv===3?"偏高":lv===2?"标准":lv===1?"偏低":"很低"));
  });
  /* 债务刚性：分得太少，债务压力上升 */
  if(b.items.debt<2){
    G.local.debt=clamp(G.local.debt+(2-b.items.debt)*7,0,100);
    lines.push("债务还本付息投入不足，到期压力转为新增债务。");
  }
  /* 行政运行过高：铺张 */
  if(b.items.admin>=4){G.stats.peers=clamp(G.stats.peers+3,0,100);G.stats.popularity=clamp(G.stats.popularity-3,0,100);}
  /* 产业扶持过高：政策风险 */
  if(b.items.industry>=4){G.hidden.audit=clamp(G.hidden.audit+3,0,100);}
  b.applied=true;b.lines=lines;
  G.pendingBudget=false;
  pushLog("编制并提交本年度财政预算","");
  G.budgetResult=lines;
  G.screen="budget";save();render();
}
function closeBudget(){
  G.screen=null;
  if(G.queue.length){render();return;}
  save();render();
}

/* ============================================================
   十八、引擎 · 城市排名
   ============================================================ */
function dimTotal(dims){
  var sum=0;
  RANK_DIM.forEach(function(d){
    var v=dims[d.k];if(v===undefined)v=50;
    if(d.neg)v=100-v;
    sum+=v*d.w;
  });
  return Math.round(clamp(sum,0,100)*10)/10;
}
function snapLocalDims(){
  var d={};
  RANK_DIM.forEach(function(x){d[x.k]=G.local[x.k];});
  return d;
}
function buildJurisdictions(r){
  function mkChief(name,tier,title){
    var id="jc"+(++G.world.seq);
    var p=makePerson(r,{id:id,tier:tier,title:title,place:name,level:TIER_LEVEL[tier],close:false});
    p.jur=name;G.world.npcs.push(p);return id;
  }
  function chiefFor(name,isSelf,tier,title){
    if(isSelf&&G.npc.boss&&G.npc.boss.wid){
      var b=findNpc(G.npc.boss.wid);
      if(b&&b.tier===tier)return G.npc.boss.wid;
    }
    return mkChief(name,tier,title);
  }
  function mkEntry(name,tier,title,gdp,pop,isSelf){
    var chiefId=chiefFor(name,isSelf,tier,title);
    var dims={};
    RANK_DIM.forEach(function(d){dims[d.k]=r.range(40,62);});
    return {name:name,tier:tier,self:!!isSelf,chiefId:chiefId,dims:dims,total:dimTotal(dims),
      gdp:gdp||0,pop:pop||0,prevGdp:0,prev:0,rank:0,prevRank:0};
  }
  var homeKey=WORLD.home||"jianglan";
  var econ=genLocalEcon(homeKey);
  var homeCity=econ.cities.filter(function(c){return c.n===WORLD.city;})[0]||econ.cities[0];
  var countyEcon=(homeKey==="jianglan")?econ.counties
    :spreadCounties(homeCity.n,homeCity.gdp,homeCity.pop,homeKey);
  var countyList=countyEcon.map(function(e){
    return mkEntry(e.n,"county","县委书记",e.gdp,e.pop,e.n===WORLD.county);
  });
  var cityList=econ.cities.map(function(c){
    return mkEntry(c.n,"city","市委书记",c.gdp,c.pop,c.n===WORLD.city);
  });
  /* 省级榜：10 个省级区域（含首都特区）+ 一行「全国」。
     「全国」是各省的加权平均：在省级时它是参考基准，到了中央部委/国务院它就是你的成绩单。 */
  var provList=MAP_REGIONS.map(function(p){
    return mkEntry(p.n,"prov",p.kind==="capital"?"中京市市长":"省委书记",p.gdp,p.pop,false);
  });
  provList.push({name:"全国",tier:"prov",self:false,chiefId:null,dims:{},total:0,
    gdp:nationalGdp(),pop:nationalPop(),prevGdp:0,prev:0,rank:0,prevRank:0,isNation:true});
  G.juris={
    county:{name:WORLD.city+" · 县区综合排名",list:countyList},
    city:{name:WORLD.province+" · 地市综合排名",list:cityList},
    prov:{name:GEO_COUNTRY+" · 省级综合排名",list:provList}
  };
  rankUpdate([]);
}
function isNational(){
  var t=ROLES[G.rank].tier;
  return t==="nation"||t==="state";
}
/* 经济增速：与本地经济活力挂钩，多年累积成 GDP 差距 */
function econGrowth(e,r){
  var eco=e.dims.economy===undefined?50:e.dims.economy;
  /* 欠发达地区增速更快（追赶效应），富庶地区增量趋缓 —— 让"穷地方变富"更有成就感 */
  var catchUp=1+(1-clamp(homeEconIdx(),0.6,1.6))*0.42;
  return (0.026+(eco-50)*0.00052+r.range(-55,95)/10000)*catchUp;
}
function rankUpdate(reports){
  if(!G.juris)return;
  var r=new RNG(G.seed+G.year*419+7);
  /* 省级榜的「属地」随层级切换：省级时是家乡省份，到了中央就是全国 */
  var pb=G.juris.prov;
  if(pb){
    var nat=pb.list.filter(function(e){return e.isNation;})[0];
    pb.list.forEach(function(e){if(!e.isNation)e.self=(!isNational()&&e.name===WORLD.province);});
    if(nat)nat.self=isNational();
    /* 全国 = 10 个省级区域的加权平均（按人口加权） */
    if(nat){
      var dims={},gdp=0,pop=0,tp=0;
      RANK_DIM.forEach(function(d){dims[d.k]=0;});
      pb.list.forEach(function(e){
        if(e.isNation)return;
        var w=Math.max(e.pop,1);tp+=w;gdp+=e.gdp;pop+=e.pop;
        RANK_DIM.forEach(function(d){dims[d.k]+=e.dims[d.k]*w;});
      });
      RANK_DIM.forEach(function(d){dims[d.k]=tp?Math.round(dims[d.k]/tp*10)/10:50;});
      nat.dims=dims;nat.total=dimTotal(dims);
      nat.gdp=Math.round(gdp*10)/10;nat.pop=Math.round(pop*10)/10;
    }
  }
  ["county","city","prov"].forEach(function(tier){
    var board=G.juris[tier];
    board.list.forEach(function(e){
      e.prev=e.total;e.prevRank=e.rank||0;e.prevGdp=e.gdp;
      if(e.self){e.dims=snapLocalDims();e.total=dimTotal(e.dims);}
      else if(e.isNation){/* 上一段已算好，跳过 */ }
      else{
        var chief=findNpc(e.chiefId);
        var prof=chief?(chief.persona||{amb:.5,guile:.5,warm:.5,risk:.5}):{amb:.5,guile:.5,warm:.5,risk:.5};
        var amb=prof.amb, prob=chief?(chief.probity===undefined?0.6:chief.probity):0.6;
        var cRisk=chief?chief.risk:50;
        var ability=amb*0.42+prof.warm*0.22+(1-cRisk/100)*0.26+(prob-0.5)*0.20;
        e.probity=prob;e.amb=amb;
        Object.keys(e.dims).forEach(function(k){
          var d=(ability-0.46)*5+r.range(-2.6,2.6)+(50-e.dims[k])*0.14;
          /* 世界是活的：不同性格、不同操守的主政者，会把同一个地方带向完全不同的方向。
             激进型：经济跑得快，环境与安全掉得也快；
             贪腐型：财政账面一时好看，债务、信访与民生却在后面塌。 */
          if(k==="economy")     d+=(amb-0.5)*2.6;
          if(k==="environment") d-=(amb-0.5)*1.7;
          if(k==="safety")      d-=(amb-0.5)*1.3;
          if(k==="finance")     d+=(0.62-prob)*2.2;
          if(k==="debt")        d+=(0.62-prob)*2.6;
          if(k==="petition")    d+=(0.62-prob)*1.9;
          if(k==="livelihood")  d-=(0.62-prob)*1.5;
          e.dims[k]=clamp(e.dims[k]+d,22,86);
        });
        e.total=dimTotal(e.dims);
      }
      /* GDP 与人口逐年演进 */
      e.gdp=Math.round(clamp(e.gdp*(1+econGrowth(e,r)),0,1e9)*10)/10;
      e.pop=Math.round(clamp(e.pop*(1+r.range(-4,9)/1000),0,1e9)*10)/10;
    });
    board.list.sort(function(a,b){return b.total-a.total;});
    board.list.forEach(function(e,i){e.rank=i+1;});
  });
  /* 玩家所在辖区反馈 */
  var me=myJurisdiction();
  if(me&&me.prevRank>0){
    var delta=me.prevRank-me.rank;
    var gd=me.prevGdp>0?((me.gdp/me.prevGdp-1)*100):0;
    var gdTxt=Math.abs(gd)>=0.05?("，GDP "+fmtGdp(me.gdp)+"（"+(gd>=0?"+":"")+gd.toFixed(1)+"%）"):("，GDP "+fmtGdp(me.gdp));
    if(delta>0){
      G.stats.trust=clamp(G.stats.trust+Math.min(delta,3)*1.5,0,100);
      reports.push(boardName()+"：你的辖区从第 "+me.prevRank+" 位升至第 "+me.rank+" 位（"+me.total+" 分"+gdTxt+"）。");
    }else if(delta<0){
      G.stats.trust=clamp(G.stats.trust-Math.min(-delta,3)*1.2,0,100);
      reports.push(boardName()+"：你的辖区从第 "+me.prevRank+" 位降至第 "+me.rank+" 位（"+me.total+" 分"+gdTxt+"）。");
    }else{
      reports.push(boardName()+"：你的辖区位列第 "+me.rank+" 位（"+me.total+" 分"+gdTxt+"）。");
    }
    if(me.rank<=3){G.stats.popularity=clamp(G.stats.popularity+1.5,0,100);}
    else if(me.rank>=10){G.stats.popularity=clamp(G.stats.popularity-1,0,100);}
  }
}
function boardKey(){
  var tier=ROLES[G.rank].tier;
  if(tier==="prov"||tier==="nation"||tier==="state")return "prov";
  if(tier==="city")return "city";
  return "county";
}
function boardName(){return G.juris?G.juris[boardKey()].name:"";}
function myJurisdiction(){
  if(!G.juris)return null;
  var b=G.juris[boardKey()];
  return b.list.filter(function(e){return e.self;})[0]||null;
}
function otherBoard(){
  if(!G.juris)return null;
  var bk=boardKey();
  if(bk==="county")return G.juris.city;
  if(bk==="city")return G.juris.prov;
  return null;
}
/* 榜上名次：按指定字段排序 */
function boardRankBy(tier,field,asc){
  var b=G.juris[tier];if(!b)return [];
  var arr=b.list.slice().sort(function(a,c){return asc?(a[field]-c[field]):(c[field]-a[field]);});
  return arr.map(function(e,i){return {name:e.name,self:e.self,rank:i+1,v:e[field]};});
}

/* ============================================================
   十九、引擎 · 项目全周期
   ============================================================ */
function projPoolKey(){return G.rank<2?"town":(G.rank<5?"county":"city");}
function ensureProjects(){
  if(!G.projects)G.projects=[];
  G.projects=G.projects.filter(function(p){return !p.done||(G.year-p.doneYear<1);});
  var active=G.projects.filter(function(p){return !p.done;});
  var r=new RNG(G.seed+G.year*97+11),guard=0;
  var want=1;
  while(active.length<want&&guard++<24){
    var tier=ROLES[G.rank].tier;
    var pool=PROJ_TEMPLATES.filter(function(t){
      if(t.tier.indexOf(tier)<0)return false;
      return !G.projects.some(function(p){return p.tpl===t.key&&!p.done;});
    });
    if(!pool.length)break;
    var tpl=r.pick(pool);
    var scale=1+ (tier==="city"?0.6:tier==="county"?0.25:0);
    var p={
      id:"pj"+(++G.world.seq),tpl:tpl.key,name:tpl.n,type:tpl.type,
      progress:r.range(6,24),risk:r.range(2,14),done:false,
      cost:Math.round(tpl.cost*scale),spent:0,funded:0,
      stageIdx:0,gain:deep(tpl.gain),riskName:tpl.riskName,desc:tpl.desc,
      source:r.pick(["上级下达","本地申报","群众反映"])
    };
    G.projects.push(p);active.push(p);
  }
  G.projects.forEach(function(p){p.stageIdx=Math.min(PROJ_STAGES.length-1,Math.floor(p.progress/100*PROJ_STAGES.length));});
}
/* 身份开局项目：乡镇公务员事多、自带项目；技术干部专业对口、承接产业项目 */
function seedOriginProject(){
  var o=ORIGINS.filter(function(x){return x.key===G.origin;})[0]||{};
  function add(tpl,source){
    if(!tpl)return;
    if(G.projects.some(function(p){return p.tpl===tpl.key&&!p.done;}))return;
    var tier=ROLES[G.rank].tier;
    var scale=1+(tier==="city"?0.6:tier==="county"?0.25:0);
    var r=new RNG(G.seed+G.year*13+G.projects.length*7+3);
    G.projects.push({id:"pj"+(++G.world.seq),tpl:tpl.key,name:tpl.n,type:tpl.type,
      progress:r.range(10,28),risk:r.range(2,12),done:false,
      cost:Math.round(tpl.cost*scale),spent:0,funded:0,
      stageIdx:0,gain:deep(tpl.gain),riskName:tpl.riskName,desc:tpl.desc,source:source});
  }
  var tier=ROLES[G.rank].tier;
  var pool=function(){return PROJ_TEMPLATES.filter(function(t){return t.tier.indexOf(tier)>=0;});};
  var r=new RNG(G.seed+1000);
  if(o.proj){   /* 乡镇公务员：自带若干项目，一上任就有得忙 */
    var want=o.proj;
    for(var i=0;i<want;i++)add(r.pick(pool()),"本地申报");
  }
  if(o.skill==="pro"){   /* 技术干部：专业对口，承接一个产业/数字项目 */
    var tech=PROJ_TEMPLATES.filter(function(t){return t.type==="industry"&&t.tier.indexOf(tier)>=0;});
    add(tech.length?r.pick(tech):r.pick(pool()),"专业承接");
  }
}
function projAct(id,mode){
  if(G.screen)return;
  if(curTimeType()!=="day"){toast("推进项目要在白天");return;}
  var p=G.projects.filter(function(x){return x.id===id;})[0];
  if(!p||p.done)return;
  var m=PROJ_MODE.filter(function(x){return x.key===mode;})[0];if(!m)return;
  if(G.energy<m.cost){toast("精力不足");return;}
  var r=new RNG(G.seed+strHash(id)+G.year*17+G.month*3+G.sched.cur+mode.length);
  G.energy-=m.cost;
  var dp=r.range(m.dp[0],m.dp[1]),dr=r.range(m.dr[0],m.dr[1]),ach=r.range(m.ach[0],m.ach[1]);
  if(G.skill==="pro")dp=Math.round(dp*1.15);   /* 专业技术干部：推进项目更高效 */
  p.progress=clamp(p.progress+dp,0,100);p.risk=clamp(p.risk+dr,0,100);
  G.stats.achievement=clamp(G.stats.achievement+ach,0,100);
  if(mode==="push"){G.monthHeavy++;G.stats.integrity=clamp(G.stats.integrity-r.range(1,3),0,100);}
  if(mode==="fund"){
    var got=r.range(Math.round(p.cost*0.06),Math.round(p.cost*0.14));
    p.funded+=got;G.local.finance=clamp(G.local.finance+got/120,0,100);
    G.stats.trust=clamp(G.stats.trust+1,0,100);
    pushLog("跑资金·"+p.name+"：争取到 "+comma(got)+" 万元","up");
  }else{
    pushLog("推进·"+p.name+"（"+m.n+"）",mode==="push"?"warn":"good");
  }
  p.stageIdx=Math.min(PROJ_STAGES.length-1,Math.floor(p.progress/100*PROJ_STAGES.length));
  if(p.progress>=100)finishProject(p,r);
  if(G.queue.length){save();render();}else advanceSlot();
}
function finishProject(p,r){
  p.done=true;p.doneYear=G.year;
  var g=p.gain,risky=p.risk;
  Object.keys(g).forEach(function(k){
    var v=g[k];
    if(risky>=50&&(k==="popularity"||k==="livelihood"))v=Math.round(v*0.7);
    if(k in G.stats)G.stats[k]=clamp(G.stats[k]+v,0,100);
    else if(k in G.local)G.local[k]=clamp(G.local[k]+v,0,100);
  });
  G.stats.trust=clamp(G.stats.trust+r.range(1,4),0,100);
  if(risky>=50){
    G.facts.push({id:"proj_risk_"+p.id,title:"带病竣工的"+p.name,
      detail:"压工期、走捷径，项目带着隐患竣工，手续与质量都有缺口",
      kind:"severe",fromProject:p.id,year:G.year,month:G.month,fireYear:G.year+r.range(1,4)});
    pushLog(p.name+"竣工，但隐患不小","warn");
    enqueueTip("项目竣工 · 隐患犹存",p.name+"快速完工，政绩到手，可它带着 "+Math.round(risky)+" 的隐患竣工，审计那关迟早要来。",false,advanceSlot);
  }else{
    pushLog(p.name+"顺利竣工","good");
    enqueueTip("项目竣工",p.name+"干净利落地完工，政绩扎实，没留尾巴。",true,advanceSlot);
  }
}
function placeScore(){
  var s=G.stats,lo=G.local;
  var maxRisk=0;
  G.projects.forEach(function(p){if(!p.done&&p.risk>maxRisk)maxRisk=p.risk;});
  return {"项目推进":clamp(40+s.achievement*0.4),"财政运行":lo.finance,"群众口碑":s.popularity,
    "信访压力":lo.petition,"安全隐患":maxRisk,"生态环保":lo.environment};
}
function placeScorecardHtml(){
  var s=placeScore(),keys=Object.keys(s),sum=0;
  var rows=keys.map(function(k){
    var v=Math.round(s[k]),neg=(k==="信访压力"||k==="安全隐患"),eff=neg?100-v:v;sum+=eff;
    var good=neg?v<35:v>=60,cls=good?"g":(eff>=40?"m":"b");
    return '<div class="ps-row"><span class="ps-k">'+k+'</span><div class="ps-bar"><i class="'+cls+'" style="width:'+v+'%"></i></div><span class="ps-v">'+v+'</span></div>';
  }).join("");
  var avg=sum/keys.length,grade=avg>=68?"先进":avg>=48?"中游":"垫底";
  return '<div class="ps-card"><div class="ps-head"><span>主政地方 · 年度评分</span><span class="ps-grade '+grade+'">'+grade+'</span></div>'+rows+'</div>';
}
function annualFinance(reports){
  var lo=G.local;
  /* 财政收入随经济与债务变化 */
  var income=Math.round((lo.economy-40)*0.5+lo.finance*0.05);
  lo.finance=clamp(lo.finance+income*0.2,0,100);
  if(lo.finance<28){reports.push("财政运行十分紧张，保工资、保运转压力很大。");G.stats.peers=clamp(G.stats.peers-3,0,100);}
  else if(lo.finance>66){reports.push("财政运行总体平稳，有余力办一些事。");}
  if(lo.debt>=BAL.debtDanger){
    reports.push("债务压力已到危险区间，上级进行了约谈提醒。");
    G.stats.trust=clamp(G.stats.trust-4,0,100);
    G.hidden.audit=clamp(G.hidden.audit+4,0,100);
  }
  /* 信访/舆情越线 */
  if(lo.petition>=BAL.petitionDanger){
    reports.push("信访压力居高不下，出现了群体性上访苗头。");
    G.stats.popularity=clamp(G.stats.popularity-4,0,100);
    G.hidden.audit=clamp(G.hidden.audit+3,0,100);
  }
  if(lo.sentiment>=BAL.sentimentDanger){
    reports.push("舆论场对本地负面关注度很高，宣传部门压力很大。");
    G.stats.trust=clamp(G.stats.trust-3,0,100);
  }
}

function buildWorld(r){
  var closeTitles={};
  G.world.npcs.filter(function(x){return x.close;}).forEach(function(x){closeTitles[x.title]=1;});
  TIER_ORDER.forEach(function(tier){
    var quota=W_TIER_QUOTA[tier],T=W_TITLES[tier],list=[];
    function take(title){
      if(list.length>=quota)return;
      if(tier===ROLES[G.rank].tier&&closeTitles[title])return;
      if(list.some(function(x){return x.title===title;}))return;
      list.push(makePerson(r,{id:"w"+(++G.world.seq),tier:tier,title:title,place:W_PLACE[tier],level:TIER_LEVEL[tier]}));
    }
    take(T.chiefs[0]);
    T.vice.forEach(take);
    shuffle(T.depts,r).forEach(take);
    G.world.npcs=G.world.npcs.concat(list);
  });

  placeFixedNames(r);
  buildLeadership();
  seedOpeningRumors();

/* ---------- 固定人物落位 ----------
   五个人名每一局必定出现，但落在哪个层级、哪个职务完全随机；
   周均谕固定为副国级反派（长期不倒的巨贪）。
   结果写进存档，同一存档刷新不变，新开档才换人。 */
function placeFixedNames(r){
  if(!G.world)return;
  var pool=shuffle(G.world.npcs.filter(function(x){return !x.close&&x.alive;}),r);
  /* 反派：与主角同岁、基层起步，隐忍多年，随主角一起一步步往上爬。
     游戏内绝不点破他是"反派"——他看起来只是一个不声不响、办事妥帖的同期干部。 */
  var vill=pool.filter(function(x){return x.tier==="town";})[0]||pool[0];
  if(vill){
    vill.tier="town";vill.level=TIER_LEVEL.town;vill.title="副镇长";vill.place=W_PLACE.town;
    vill.name=VILLAIN_NAME;
    vill.villain=true;
    vill.trait="绵里藏针";
    vill.persona=traitProfile("绵里藏针");
    vill.probity=0.55;   /* 初期不显山露水，并非明显贪官 */
    vill.risk=35;
    vill.goal="再进一步";
    vill.age=G.age;      /* 与主角同岁 */
    vill.bg="基层出身";
    vill.note="乡镇上的同期干部，话不多，但事情总能办得妥帖，口碑不坏。";
    vill.terms=[{y:1,title:vill.title}];
    G.villainId=vill.id;
    pool=pool.filter(function(x){return x!==vill;});
  }
  FIXED_NAMES.forEach(function(nm){
    var t=pool.shift();
    if(!t)return;
    t.name=nm;t.fixed=true;
    t.terms=[{y:1,title:t.title}];
  });
}
/* 反派成长线：与主角同步成长，隐忍多年后一步步到副国级；随晋升逐渐腐化 */
function villainRise(p,r,out){
  if(!p||!p.villain)return;
  var y=G.year,tier=p.tier,title=p.title;
  var target;
  if(y>=42)target={tier:"state",title:"国务院副总理"};
  else if(y>=36)target={tier:"nation",title:"部长"};
  else if(y>=30)target={tier:"prov",title:"省长"};
  else if(y>=25)target={tier:"prov",title:"副省长"};
  else if(y>=20)target={tier:"city",title:"市长"};
  else if(y>=15)target={tier:"city",title:"副市长"};
  else if(y>=10)target={tier:"county",title:"县长"};
  else if(y>=6)target={tier:"county",title:"副县长"};
  else if(y>=3)target={tier:"town",title:"镇长"};
  else target={tier:"town",title:"副镇长"};
  if(tier===target.tier&&title===target.title)return;
  /* 升到副国级时，顶替掉现任的国务院副总理（原任离任） */
  if(target.tier==="state"){
    var existing=G.world.npcs.filter(function(x){return x.tier==="state"&&x.title==="国务院副总理"&&x.alive&&x!==p;})[0];
    if(existing){existing.status="retire";existing.note=absYear()+"年离任";existing.close=false;}
  }
  p.tier=target.tier;p.title=target.title;
  p.level=TIER_LEVEL[target.tier];p.place=W_PLACE[target.tier];
  p.note=absYear()+"年升任"+target.title;
  p.terms.push({y:G.year,title:target.title});
  /* 隐忍多年，爬到高位后逐渐变质：廉洁下滑、风险上升 */
  if(target.tier==="prov"||target.tier==="nation"||target.tier==="state"){
    p.probity=clamp(p.probity-0.10,0.08,0.98);
    p.risk=clamp(p.risk+18,0,98);
  }
  out.push({kind:"gazette",depth:0,related:[p.id],
    text:"邸报："+p.name+"任"+(target.tier==="state"?W_PLACE.state:p.place)+target.title+"。"});
}

function buildLeadership(){

       ||G.world.npcs.filter(function(x){return x.tier==="state"&&x.title===L.post;})[0];

function leadershipNpc(post){return G.leadership?((G.leadership.filter(function(l){return l.post===post;})[0]||{}).npc||null):null;}
/* 中央领导班子换届：每 5 年（绝对年份逢 5）换约三分之一的人，名单进邸报 */
function stateTermChange(out){
  if(!G.leadership||!G.leadership.length)return;
  var r=new RNG(G.seed+G.year*37+13);
  var changed=[],kept=[];
  G.leadership.forEach(function(L){
    var p=L.npc;
    if(!p||!p.alive){return;}
    if(p.villain){kept.push(L.post+" "+p.name);return;}  /* 反派盘根错节，换届也动不了他 */
    if(p.sinceYear===undefined)p.sinceYear=G.year;
    /* 任期限制：默认最多连任 2 届（10 年）；修宪取消任期限制后不再强制换届，可无限连任 */
    var limited=!(G.charter&&G.charter.termLimitRemoved);
    if(!limited){kept.push(L.post+" "+p.name);return;}
    var terms=Math.floor((G.year-p.sinceYear)/BAL.termEvery);
    var mustChange=terms>=2;
    if(mustChange||r.chance(0.34)){
      var np=makePerson(r,{id:"w"+(++G.world.seq),tier:"state",title:L.post,place:W_PLACE.state,
        level:TIER_LEVEL.state,age:r.range(55,66)});
      np.terms=[{y:G.year,title:L.post}];
      np.sinceYear=G.year;
      G.world.npcs.push(np);
      p.status="retire";p.note=absYear()+"年离任";p.close=false;
      L.npc=np;changed.push(L.post+" "+np.name+(mustChange?"（届满）":""));
    }else{kept.push(L.post+" "+p.name);}
  });
  out.push({kind:"gazette",depth:0,related:[],
    text:"邸报：新一届中央领导班子产生。"+(changed.length?("换任——"+changed.join("、")+"。"):"")
      +"连任——"+kept.slice(0,6).join("、")+"等。"});
}
/* 反派是否已经浮出水面（玩家层级够高、或传闻足够多） */
function villainNpc(){return G&&G.villainId?findNpc(G.villainId):null;}
function addBond(a,b,type,w){
  if(!a||!b||a===b)return;
  for(var i=0;i<G.world.bonds.length;i++){var x=G.world.bonds[i];
    if(((x.a===a&&x.b===b)||(x.a===b&&x.b===a))&&x.type===type)return;}
  G.world.bonds.push({a:a,b:b,type:type,w:w,since:G.year});
}
function otherOf(bond,id){return bond.a===id?bond.b:bond.a;}
function bondsOf(id){return G.world.bonds.filter(function(x){return x.a===id||x.b===id;});}
function buildBonds(r){
  var all=G.world.npcs;
  function alive(t){return all.filter(function(x){return x.tier===t&&x.alive;});}
  for(var k=0;k<12;k++){
    var a=r.pick(all);if(!a)continue;
    var same=all.filter(function(x){return x!==a&&x.name.charAt(0)===a.name.charAt(0)&&x.alive;});
    if(same.length)addBond(a.id,r.pick(same).id,"kin",r.range(60,95)/100);
  }
  for(var m=0;m<6;m++){
    var a2=r.pick(all),b2=r.pick(all);
    if(a2&&b2&&a2!==b2)addBond(a2.id,b2.id,"inlaw",r.range(50,85)/100);
  }
  for(var li=0;li<TIER_ORDER.length-1;li++){
    var t=TIER_ORDER[li],tn=TIER_ORDER[li+1];
    var highs=alive(tn).concat(alive(t).filter(function(x){return /书记|县长|市长|省长/.test(x.title);}));
    alive(t).forEach(function(low){
      if(r.chance(.42)&&highs.length){var h=r.pick(highs);addBond(h.id,low.id,"patron",r.range(55,90)/100);}
    });
  }
  for(var f=0;f<16;f++){var a3=r.pick(all),b3=r.pick(all);
    if(a3&&b3&&a3!==b3&&a3.home===b3.home)addBond(a3.id,b3.id,"fellow",r.range(40,70)/100);}
  for(var g=0;g<24;g++){
    var a4=r.pick(all),b4=r.pick(all);if(!a4||!b4||a4===b4)continue;
    var ex=G.world.bonds.some(function(x){return (x.a===a4.id&&x.b===b4.id)||(x.a===b4.id&&x.b===a4.id);});
    if(ex)continue;
    var pa=traitProfile(a4.trait),pb=traitProfile(b4.trait);
    var compat=(pa.warm+pb.warm)/2-Math.abs(a4.risk-b4.risk)/200;
    if(compat>0.55)addBond(a4.id,b4.id,r.chance(.18)?"sworn":"ally",r.range(45,85)/100);
    else if(compat<0.35)addBond(a4.id,b4.id,"rival",r.range(45,80)/100);
  }
}
function seedOpeningRumors(){
  TIER_ORDER.forEach(function(tier){
    var c=G.world.npcs.filter(function(x){return x.tier===tier&&/书记/.test(x.title)&&x.alive&&!x.close;})[0];
    if(c)pushRumor("gazette",c.place+"的"+c.title+"是"+c.name+"。",0,[c.id]);
  });
  var v=villainNpc();
  if(v)pushRumor("gazette",v.place+"的"+v.title+"是"+v.name+"。",0,[v.id]);   /* 中性，绝不点破反派身份 */
}

/* ---------- 世界自主推演 ---------- */
function livingTickMonth(){
  if(!G.world)return;
  var r=new RNG(G.seed+G.year*131+G.month*17+5);
  var act=G.world.npcs.filter(function(x){return x.alive&&x.status==="active";});
  act.forEach(function(p){
    if(p.close)return;
    var rr=new RNG(strHash(p.id)+G.year*12+G.month);
    if(p.age>=50&&rr.chance(.25))p.health=clamp(p.health-rr.range(0,1),0,100);
  });
  if(r.chance(.5)&&act.length>2){
    var a=r.pick(act),b=r.pick(act);
    if(a!==b){
      var has=bondsOf(a.id).some(function(x){return otherOf(x,a.id)===b.id;});
      if(!has){
        var pa=traitProfile(a.trait),pb=traitProfile(b.trait);
        var compat=(pa.warm+pb.warm)/2-Math.abs(a.risk-b.risk)/200;
        if(compat>0.55)addBond(a.id,b.id,"ally",.5);
        else if(compat<0.35)addBond(a.id,b.id,"rival",.5);
      }
    }
  }
  schemesTick();
  exposeTick([]);
  if(typeof charterBacklashTick==="function")charterBacklashTick();
  investigateTick();
}
/* 被谈话的 NPC（含被构陷者）按月推进结案，不再"立案即消失、永不落地" */
function investigateTick(){
  if(!G.world)return;
  var now=G.year*12+G.month;
  G.world.npcs.forEach(function(p){
    if(!p.alive||p.status!=="investigate")return;
    if(!p.caseUntil)p.caseUntil=now+2;
    if(now<p.caseUntil)return;
    var r=new RNG(strHash(p.id)+G.year*13+G.month*7+11);
    var out=[];resolveInvestigation(p,r,out);
    if(p.caseBy==="fabricate"||p.caseBy==="power"){
      var isFake=p.caseBy==="fabricate";
      if(p.status==="removed"){
        G.stats.peers=clamp(G.stats.peers-6,0,100);
        G.hidden.audit=clamp(G.hidden.audit+8,0,100);
        if(r.chance(0.25)){G.expose.heat=clamp(G.expose.heat+8,0,100);
          out.push({kind:"insider",depth:1,related:[p.id],
            text:"内部消息："+p.name+"被查时反复说「是有人递的材料」，有人开始往你身上联想。"});}
      }else{
        var rel=getRel(p.id);
        rel.like=clamp(rel.like-20,-100,100);rel.fear=clamp(rel.fear+10,0,100);
        remember(p,isFake?"构陷败露，被你反咬，结下死仇。":"你安排的罪名没立住，他记恨上了你。","bad");
        G.expose.heat=clamp(G.expose.heat+6,0,100);
      }
      p.caseBy=null;
    }
    out.forEach(function(x){pushRumor(x.kind,x.text,x.depth,x.related);});
  });
}
function livingTickYear(){
  if(!G.world)return;
  var out=[];
  G.world.npcs.forEach(function(p){
    if(!p.alive)return;
    p.age++;
    if(p.close)return;
    var r=new RNG(strHash(p.id)+G.year*101+7);
    if(p.status==="investigate"){resolveInvestigation(p,r,out);return;}
    if(p.status!=="active")return;
    /* 反派盘根错节、势力庞大，常规推演撼动不了他；只会随年龄稳步高升 */
    if(p.villain){
      if(p.age>=70){npcRetire(p,r,out);return;}
      villainRise(p,r,out);
      return;
    }
    if(p.age>=50)p.health=clamp(p.health-r.range(0,2),0,100);
    /* 退休年龄按层级分级：位置越高退得越晚，贴近现实 */
    var _retireAge={town:60,county:60,city:60,prov:63,nation:65,state:68}[p.tier]||60;
    if(p.age>=_retireAge){npcRetire(p,r,out);return;}
    if(p.health<=10){npcDie(p,r,out);return;}
    if(p.health<=28&&r.chance(.16)){npcDie(p,r,out);return;}
    if(p.age>=58&&p.health<=42&&r.chance(.07)){npcDie(p,r,out);return;}
    var rivalHas=bondsOf(p.id).some(function(x){return x.type==="rival";});
    var fallP=clamp((p.risk-45)/90+(rivalHas?0.08:0)-0.1,0,0.5);
    if(p.risk>=55&&r.chance(fallP)){startInvestigation(p,r,out);return;}
    var patrons=bondsOf(p.id).filter(function(x){return x.type==="patron"&&x.b===p.id;})
      .map(function(x){return findNpc(x.a);})
      .filter(function(q){return q&&q.alive&&q.status==="active";});
    var upP=clamp(traitProfile(p.trait).amb*0.28+(patrons.length?0.14:0)+(p.health>70?0.05:0)
      -(p.age>=54?0.12:0)-(1-p.probity)*0.05,0,0.5);
    if(r.chance(upP))npcMoveUp(p,r,out);
  });
  npcGovernTick(out);
  fillWorldVacancies(out);
  if(out.length){
    out.forEach(function(x){pushRumor(x.kind,x.text,x.depth,x.related);});
    var hot=out.filter(function(x){return x.kind==="fall"||x.kind==="death";})[0]||out[0];
    setTimeout(function(){toast("风闻："+hot.text);},450);
  }
}
function npcMoveUp(p,r,out){
  var T=W_TITLES[p.tier],ti=TIER_ORDER.indexOf(p.tier);
  var inDept=T.depts.indexOf(p.title)>=0,inVice=T.vice.indexOf(p.title)>=0;
  var moved=false,newTitle=null;
  if(ti<TIER_ORDER.length-1&&r.chance(inVice?.72:.42)){
    var nt=TIER_ORDER[ti+1],N=W_TITLES[nt];
    newTitle=inVice?r.pick(N.vice):r.pick(N.depts.concat(N.vice.slice(-2)));
    p.tier=nt;p.level=TIER_LEVEL[nt];p.place=W_PLACE[nt];moved=true;
  }else if(inDept){newTitle=T.vice[T.vice.length-1];moved=true;}
  if(!moved)return;
  p.title=newTitle;p.terms.push({y:G.year,title:newTitle});p.note=absYear()+"年升任"+newTitle;
  var gazette=p.level>=2;
  out.push({kind:gazette?"gazette":"promote",depth:0,related:[p.id],
    text:gazette?("邸报："+p.name+"任"+p.place+newTitle+"。"):("听说"+p.name+"最近提了，任"+newTitle+"。")});
}
function startInvestigation(p,r,out){
  p.status="investigate";p.note=absYear()+"年接受谈话";
  out.push({kind:"investigate",depth:0,related:[p.id],
    text:"风闻"+p.name+"被请去了解情况，这些天没怎么在单位露面。"});
}
function resolveInvestigation(p,r,out){
  var severe=(1-p.probity)+p.risk/200;
  if(r.chance(clamp(severe*.7,.2,.85))){
    p.status="removed";p.note=absYear()+"年被撤职";
    out.push({kind:"fall",depth:0,related:[p.id],
      text:"风闻"+p.name+"的问题查实了，已被撤职，办公室早几天就搬空了。"});
    bondsOf(p.id).forEach(function(b){
      if(b.type==="patron"&&b.a===p.id){
        var stu=findNpc(b.b);
        if(stu&&stu.alive&&stu.status==="active"&&r.chance(.4)){
          stu.risk=clamp(stu.risk+18,0,100);
          out.push({kind:"investigate",depth:1,related:[stu.id],
            text:"内部消息："+stu.name+"是"+p.name+"一手提的，最近也被找去问了话。"});
        }
      }
    });
  }else{
    p.status="active";p.note="";
    out.push({kind:"transfer",depth:1,related:[p.id],
      text:"内部消息："+p.name+"的事算是过去了，听说换了个清闲位子。"});
  }
}
function npcRetire(p,r,out){
  p.status="retire";p.note=absYear()+"年退休";
  out.push({kind:"retire",depth:0,related:[p.id],text:p.name+"到龄办了退休，听说打算回原籍养老。"});
}
function npcDie(p,r,out){
  p.alive=false;p.status="dead";p.note=absYear()+"年去世";
  out.push({kind:"death",depth:0,related:[p.id],text:p.name+"走了，单位发了讣告，不少人去送了最后一程。"});
}
function fillWorldVacancies(out){
  TIER_ORDER.forEach(function(tier){
    var here=G.world.npcs.filter(function(x){return x.tier===tier&&x.alive&&x.status==="active";});
    var target=W_TIER_QUOTA[tier],guard=0;
    while(here.length<target&&guard<target){
      guard++;
      var T=W_TITLES[tier],used={};here.forEach(function(x){used[x.title]=1;});
      var pool=T.depts.filter(function(z){return !used[z];});
      if(!pool.length)break;
      var r=new RNG(G.seed+G.year*71+tier.length*13+guard*7);
      var p=makePerson(r,{id:"w"+(++G.world.seq),tier:tier,title:pool[0],place:W_PLACE[tier],level:TIER_LEVEL[tier],age:r.range(28,46)});
      G.world.npcs.push(p);here.push(p);
      out.push({kind:"newcomer",depth:0,related:[p.id],
        text:"新来了位"+pool[0]+"，叫"+p.name+"，是上面交流下来的。"});
    }
  });
}

/* ---------- 换届 ---------- */
function doTermChange(reports){
  var r=new RNG(G.seed+G.year*71+9);
  var fIdx=-1;
  for(var i=0;i<G.facts.length;i++){if(G.facts[i].id==="faction_a"||G.facts[i].id==="faction_b"){fIdx=i;break;}}
  var oldBoss=G.npc.boss?G.npc.boss.name:"主要领导";
  var oldWid=G.npc.boss?G.npc.boss.wid:null;
  if(fIdx>=0){
    var f=G.facts.splice(fIdx,1)[0];G.fired.push(f);
    if(f.id==="faction_a"){
      if(r.chance(0.55)){G.stats.trust=clamp(G.stats.trust+6,0,100);reports.push("你紧跟的老领导留任并获重用。");}
      else{G.stats.trust=clamp(G.stats.trust-18,0,100);reports.push("你紧跟的领导调离，新班子对你不冷不热。");}
    }else{
      if(r.chance(0.5)){G.stats.trust=clamp(G.stats.trust+8,0,100);reports.push("你曾看好的领导上位了。");}
      else{G.stats.trust=clamp(G.stats.trust-10,0,100);reports.push("人事轮替，过去的押注落了空。");}
    }
  }else{
    G.stats.trust=clamp(G.stats.trust-r.range(3,9)+4,0,100);
  }
  /* 老领导退场 */
  var old=oldWid?findNpc(oldWid):null;
  if(old){old.close=false;old.closeTag=null;
    var rr=new RNG(strHash(old.id)+G.year*31+5);
    if(rr.chance(.45)){old.status="retire";pushRumor("retire",old.name+"在换届后退了二线。",0,[old.id]);}
    else{old.note="换届平调（"+absYear()+"年）";}
  }
  /* 新班子：换书记，留纪委书记与竞争者，换掉一位班子成员 */
  var tier=ROLES[G.rank].tier,place=rolePlace(G.rank);
  var nb=makePerson(r,{id:"n"+(++G.world.seq),tier:tier,title:bossTitle(tier),place:place,
    level:TIER_LEVEL[tier],age:r.range(45,58),close:true});
  nb.closeTag="boss";G.world.npcs.push(nb);
  G.npc.boss={name:nb.name,wid:nb.id,role:nb.title,trait:nb.trait};
  var np=makePerson(r,{id:"n"+(++G.world.seq),tier:tier,title:"班子成员",place:place,
    level:TIER_LEVEL[tier],age:r.range(36,56),close:true});
  np.closeTag="peer";G.world.npcs.push(np);
  var oldPeer=G.npc.peers[G.npc.peers.length-1];
  if(oldPeer){var op=findNpc(oldPeer.wid);if(op){op.close=false;op.closeTag=null;}}
  G.npc.peers[G.npc.peers.length-1]={name:np.name,wid:np.id,role:np.title,trait:np.trait};
  reports.push("换届：新的"+bossTitle(tier)+"是"+nb.name+"，一位班子成员也换了人。");
  pushRumor("gazette","邸报："+place+bossTitle(tier)+"由"+nb.name+"担任。",0,[nb.id]);
  G.flags.newTerm=1;
}

/* ---------- 风闻 ---------- */
function pushRumor(kind,text,depth,related){
  if(!G.world)return;
  G.world.rumors.unshift({year:G.year,month:G.month,kind:kind,text:text,depth:depth||0,related:related||[]});
  if(G.world.rumors.length>110)G.world.rumors.pop();
}
function maybeInsiderRumor(context){
  if(!G.world)return;
  var r=new RNG(G.seed+G.year*131+G.month*17+context.length*3+G.energy);
  if(!r.chance(context==="banquet"?.5:.35))return;
  var pool=G.world.npcs.filter(function(x){return x.alive&&x.status==="active";});
  var p=r.pick(pool);if(!p)return;
  var texts=context==="banquet"?[
    "酒过半酣，有人压低声音说"+p.name+"最近在活动位子，来头不小。",
    "席上听来的："+p.name+"和某位领导是同乡，走得很近。",
    "饭局上有人提起"+p.name+"，话里有话，似乎在等一个机会。"]:[
    "协调事情时听说"+p.name+"手头压着桩棘手的事，正发愁。",
    "有人私下讲，"+p.name+"近来颇为低调，像是在避什么风头。",
    "机关里传"+p.name+"可能要动，具体去哪，说法不一。"];
  pushRumor("insider",r.pick(texts),1,[p.id]);
}

function schemeResolve(s){

/* ---------- 谋划 · 拉帮手 ----------
   旧实现的问题：自动挑关系最好的人、且必然成功，点几下就能把身边人全拉进来。
   现在：① 帮手上限随层级与能力提升（1~4 人）；② 每次都要过成功率；
   ③ 帮手带来的收益递减（6 → 4 → 2）；④ 失败会消耗精力并抬高走漏风险。 */
function agentSlots(){
  return clamp(1+Math.floor(G.rank/4)+Math.floor(G.stats.competence/36),1,4);
}
function agentRate(n,evil){
  if(!n)return 0;
  var rel=getRel(n.id);
  var base=16+rel.like*0.34+rel.trust*0.18+rel.favor*6
    +G.stats.peers*0.12+G.stats.trust*0.06-rel.fear*0.06;
  if(evil)base-=16; /* 罗织构陷这种脏活，愿意下水的人少得多 */
  if(n.probity>0.6)base-=8; /* 清官更不愿掺和邪道 */
  return Math.round(clamp(base,3,75));
}
function agentCandidates(sid){
  var s=G.schemes.filter(function(x){return x.id===sid;})[0];if(!s)return [];
  return G.world.npcs.filter(function(n){
    return n.close&&n.alive&&n.status==="active"&&n.id!==s.target&&s.agents.indexOf(n.id)<0;
  }).sort(function(a,b){return agentRate(b,s.evil)-agentRate(a,s.evil);});
}
function agentGain(k){return [5,3,2,1][Math.min(k,3)];}
function addAgent(sid,aid){
  var s=G.schemes.filter(function(x){return x.id===sid;})[0];
  if(!s||s.status!=="active")return;
  var cap=agentSlots();
  if(s.agents.length>=cap){enqueueTip("帮手已满","你现在能放心托付的人就这么多（上限 "+cap+" 人）。再拉人进来，走漏的风险压不住。",false);return;}
  var cand=aid?findNpc(aid):null;
  if(!cand){
    var list=agentCandidates(sid);
    if(!list.length){enqueueTip("没有帮手","身边找不到合适的人掺和这事。",false);return;}
    cand=list[0];
  }
  if(s.agents.indexOf(cand.id)>=0)return;
  if(G.energy<3){toast("精力不足，私下找人要 3 点精力");return;}
  G.energy=clamp(G.energy-3,0,100);
  var r=new RNG(strHash(s.id+cand.id)+G.year*131+G.month*17);
  var rate=agentRate(cand,s.evil);
  var ok=r.chance(rate/100);
  var rel=getRel(cand.id);
  if(ok){
    var gain=agentGain(s.agents.length);
    s.agents.push(cand.id);
    s.power=clamp(s.power+gain,5,80);
    rel.like=clamp(rel.like+2,-100,100);
    remember(cand,"参与了针对"+s.tname+"的谋划。","scheme");
    enqueueTip("拉来帮手 · "+cand.name,
      cand.name+"答应暗中相助，成功率 +"+gain+"%（现 "+s.power+"%）。\n"
      +"只是多一个知情人，就多一分走漏的风险——尤其当你和这个人日后翻脸的时候。",true);
  }else{
    rel.like=clamp(rel.like-4,-100,100);
    s.leak=clamp((s.leak||0)+0.10,0,0.7);
    remember(cand,"你找他合伙做一件事，他没有答应。","scheme");
    enqueueTip("他没有答应 · "+cand.name,
      cand.name+"听完只是笑了笑，说「这种事我不掺和」。\n"
      +"你没法确定他会不会转头就说出去。这件事的走漏风险上升了。",false);
  }
  save();render();
}
function pickSecretType(n,r){

  else if(n.probity<0.6)pool=["欺上瞒下","失职酿隐患","不正当往来"];

/* ============================================================
   二十四、蝴蝶效应：知情人 → 检举揭发 → 反制手段
   核心逻辑：
   ① 你干过的事会在知情人心里留下"记忆"（谋划、要挟、打点、翻旧账…）；
   ② 记忆越多、关系越差、对方越干净，越可能在某个月把材料递上去；
   ③ 材料递上去后给你一次反制窗口：托关系压、当面敲打、给好处、主动说明、按兵不动；
   ④ 每条路都有代价，也都有失败的概率。恐吓可能反噬，钱能封口也能再添一条把柄。
   ============================================================ */
var MEM_RISK=/谋划|要挟|把柄|打点|收下|举报|检举|走漏|分赃|好处|一起做的/;
function incriminatingMem(n){
  if(!n||!n.mem)return 0;
  return n.mem.filter(function(m){return MEM_RISK.test(m.text||"");}).length;
}
/* 谁手里有你的事
   只有"身边人"和"明确知道你做过什么的人"才算知情人——
   一百个泛泛之交都来举报你，那就不叫蝴蝶效应，叫随机天罚。 */
function witnessList(){
  var out=[];
  var sev=G.facts.filter(function(f){return f.kind==="severe";}).length;
  var now=G.year*12+G.month;
  G.world.npcs.forEach(function(n){
    if(!n.alive||n.status!=="active")return;
    var mem=incriminatingMem(n);
    if(!n.close&&mem<=0)return;                 /* 路人不知情 */
    if(n.reportCd&&now<n.reportCd)return;       /* 刚举报过，冷却中 */
    var knows=mem;
    if(n.close){
      /* 身边人：你干的事越多，他们知道的越多；主要领导护着你，除非信任已经破裂 */
      knows=Math.max(knows,sev*0.55);
      if(n.closeTag==="boss"){
        var rb=getRel(n.id);
        if(rb.trust>=22)return;
        knows*=0.5;
      }
    }
    if(knows<=0)return;
    out.push({id:n.id,score:knows});
  });
  return out;
}
function exposeRateOf(n,score){
  var rel=getRel(n.id);
  var p=0.0035
    + Math.max(0,-rel.like)*0.0007
    - rel.fear*0.0005
    - rel.favor*0.0060
    + (n.probity||0.5)*0.012
    + score*0.006
    + (G.expose?G.expose.heat*0.0004:0);
  if(n.closeTag==="rival")p+=0.010;
  if(n.closeTag==="disc")p+=0.006;
  return clamp(p,0,0.15);
}
/* 每月结算一次：把所有知情人的概率加总，掷一次骰子 */
function exposeTick(reports){
  if(!G.expose)G.expose={heat:0,reports:0,lastMonth:0,quiet:0};
  if(G.expose.quiet>0){G.expose.quiet--;return;}
  if(G.queue&&G.queue.length)return;
  if(G.year<3)return;                       /* 头两年根基未稳，没人会动你 */
  /* 无人追究时压力自然回落 */
  G.expose.heat=clamp(G.expose.heat-3.0,0,100);
  var list=witnessList();
  if(!list.length)return;
  var total=0,pairs=[];
  list.forEach(function(w){
    var n=findNpc(w.id);if(!n)return;
    var p=exposeRateOf(n,w.score);
    total+=p;pairs.push({id:w.id,p:p});
  });
  total=clamp(total,0,0.22);
  if(total<=0)return;
  var r=new RNG(G.seed+G.year*811+G.month*97+3);
  if(!r.chance(total))return;
  /* 中签后，按概率权重决定是谁写的 */
  var pick=r.next()*total,acc=0,chosen=pairs[0];
  for(var i=0;i<pairs.length;i++){acc+=pairs[i].p;if(pick<=acc){chosen=pairs[i];break;}}
  fireReport(findNpc(chosen.id));
}
function fireReport(n){
  if(!n)return;
  var r=new RNG(strHash(n.id)+G.year*53+G.month);
  n.reportCd=G.year*12+G.month+10;          /* 同一个人不会连着举报你 */
  G.expose.heat=clamp(G.expose.heat+r.range(9,16),0,100);
  G.expose.reports=(G.expose.reports||0)+1;
  pushRumor("investigate","听说有人往上面递了材料，说的是"+n.name+"那边的事。",1,[n.id]);
  pushLog("有人写了举报材料（"+n.name+"）","warn");
  G.queue.push({event:buildReportEvent(n)});
  save();render();
}
function buildReportEvent(n){
  var rel=getRel(n.id);
  var threatRate=Math.round(clamp(36+rel.fear*0.55+G.stats.competence*0.14-Math.max(0,-rel.like)*0.15,10,93));
  var bribeRate =Math.round(clamp(42+G.stats.trust*0.18+G.stats.peers*0.18+G.stats.competence*0.10,15,90));
  var coverRate =Math.round(clamp(28+rel.favor*9+rel.trust*0.30+G.stats.peers*0.10,8,88));
  var nid=n.id;
  function rr(){return new RNG(G.seed+G.year*97+G.month*31+strHash(nid));}

    id:"report_"+nid,
    title:"有人写了举报材料",
    text:"材料是从"+n.place+"那边递上来的。写的人，你几乎可以确定是"+n.name+"。\n"
      +"他（她）"+n.trait+"。"+(rel.like<0?"你们之间早就不像从前了。":"你们曾经关系不错，正因为如此，这份材料才更让人心里发凉。")+"\n\n"
      +"眼下材料还压在一个人的抽屉里——在它往上走之前，你还有动作的余地。",
    choices:[
      {t:"托关系压下来",d:"找一位说得上话的人把材料截住。成功率 "+coverRate+"%。",
       run:function(){
         var r=rr();
         if(r.chance(coverRate/100)){
           G.expose.heat=clamp(G.expose.heat-12,0,100);
           G.stats.trust=clamp(G.stats.trust-r.range(1,3),0,100);
           G.stats.peers=clamp(G.stats.peers-r.range(1,3),0,100);
           remember(n,"托人把材料压了下来。","bad");
           enqueueTip("材料被压住了","中间人收了话，材料暂时留在抽屉里。\n你欠下一个人情，也欠下一句「下不为例」。",true);
         }else{
           G.expose.heat=clamp(G.expose.heat+10,0,100);
           rel.like=clamp(rel.like-8,-100,100);
           remember(n,"你托人压材料，风声反而传了出去。","bad");
           enqueueTip("没有压住","话递出去了，材料却照常往上走。\n更糟的是，经手的人都知道你在紧张什么。",false);
         }
       }},
      {t:"当面敲打他",d:"把话挑明，让他知道后果。成功率 "+threatRate+"%，失败会当场激化。",cls:"danger",
       run:function(){
         var r=rr();
         if(r.chance(threatRate/100)){
           rel.fear=clamp(rel.fear+30,0,100);
           rel.like=clamp(rel.like-22,-100,100);
           G.expose.heat=clamp(G.expose.heat-8,0,100);
           remember(n,"被你当面敲打过。","bad");
           enqueueTip("他退了","你把话讲得很硬，也讲得很明白。\n对方脸色变了几次，最后说「我再想想」。材料大概率会停在抽屉里——但你从此多了一个怕你的人，也多了一个恨你的人。",true);

       run:function(){

/* ============================================================
   二十五、动态世界：NPC 自主施政与腐化
   世界不是背景板。别人也在做事、也在伸手：
   ① 清官会做事，也会在权力与围猎面前被慢慢腐蚀（廉洁下降）；
   ② 贪官会捞钱，也会因此被查、被牵连、被自己提拔的人反咬；
   ③ 激进与保守的取向会决定他们主政的地方往哪个方向跑（见 rankUpdate）。
   ============================================================ */
function npcGovernTick(out){
  if(!G.world)return;
  var sev=[];
  G.world.npcs.forEach(function(p){
    if(!p.alive||p.status!=="active")return;
    if(p.tier==="town"||p.tier==="county")return;   /* 只推演地市级以上，控制规模 */
    if(p.villain)return;   /* 反派不参与常规腐化推演（已是既定反派） */
    var rr=new RNG(strHash(p.id+"gov")+G.year*37+11);
    var prof=p.persona||{amb:.5,guile:.5,warm:.5,risk:.5};
    /* 腐化：位置越高、越有实权，越容易被围猎 */
    if(p.probity>0.5){
      var tempt=BAL.npcCorruptRate*11*(0.55+prof.risk*0.9)*(p.tier==="state"?1.5:p.tier==="nation"?1.35:p.tier==="prov"?1.15:1);
      if(rr.chance(tempt)){
        p.probity=clamp(p.probity-0.07,0.05,0.98);
        p.risk=clamp(p.risk+rr.range(3,9),0,98);
        if(p.probity<0.46){
          if(!p.corruptFlag){
            p.corruptFlag=true;
            sev.push({kind:"insider",depth:1,related:[p.id],
              text:"有人私下说："+p.place+"的"+p.title+p.name+"最近手面阔了不少。"});
          }
        }else if(rr.chance(0.35)){
          sev.push({kind:"insider",depth:1,related:[p.id],
            text:"内部消息："+p.name+"这两年收了不少「人情」，胆子比以前大了。"});
        }
      }
    }
    /* 贪腐者的反噬：越贪越容易被盯上 */
    if(p.risk>68&&rr.chance(clamp((p.risk-60)/260,0,0.16))){
      startInvestigation(p,rr,out);
      return;
    }
    /* 清白者的自省：极少数人能从泥里抽身 */
    if(p.probity<0.34&&rr.chance(0.05)){
      p.probity=clamp(p.probity+0.04,0.05,0.98);
      sev.push({kind:"insider",depth:1,related:[p.id],
        text:"内部消息："+p.name+"最近退了几笔不该拿的东西，像是想收手了。"});
    }
  });
  sev.forEach(function(x){out.push(x);});
}

/* ============================================================
   二十二、引擎 · 三步式剧本（上级视察 / 招商谈判 / 巡视整改）
   ============================================================ */
function openFlow(kind,afterSlot){
  if(!G)return;
  var f={kind:kind,step:0,log:[],done:false,meter:0,acc:{},after:!!afterSlot};
  if(kind==="inspect"){f.title="上级视察";f.script=deep(INSPECT_SCRIPT);}
  else if(kind==="nego"){f.title="招商谈判";f.script=deep(NEGO_SCRIPT);f.meter=42;
    var _r=new RNG(G.seed+G.year*137+G.month*11+3);
    f.company=_r.pick(NEGO_COMPANIES);}
  else if(kind==="xunshi"){f.title="巡视反馈问题整改";f.script=deep(XUNSHI_ITEMS);}
  G.queue.push({flow:f});
  save();render();
}
function flowPick(i){
  var head=G.queue[0];if(!head||!head.flow)return;
  var f=head.flow,r=new RNG(G.seed+G.year*211+f.step*37+i*13+strHash(f.kind));
  if(f.done)return;
  if(f.kind==="xunshi"){
    var it=f.script[f.step];
    var ch=(i===0)?it.hard:it.soft;
    applyFx(ch.fx,r);
    f.log.push({t:it.t,choice:ch.n,note:i===0?"动真碰硬":"稳妥处理",good:i===0});
    if(i===0)f.acc.hard=(f.acc.hard||0)+1;else f.acc.soft=(f.acc.soft||0)+1;
  }else{
    var st=f.script[f.step];
    var op=st.opts[i];
    if(!op)return;
    applyFx(op.fx,r);
    if(f.kind==="nego"){f.meter=clamp(f.meter+(op.deal||0),0,100);}
    f.log.push({t:st.t,choice:op.t,note:op.note,good:(f.kind==="nego"?op.deal>0:true)});
    f.acc.margin=(f.acc.margin||0)+(op.tone||0);
  }
  f.step++;
  if(f.step>=f.script.length){flowFinish(f,r);}
  save();render();
}
function flowFinish(f,r){
  f.done=true;
  var res={};
  if(f.kind==="inspect"){
    var good=f.acc.margin;
    if(good>=2){res={t:"视察圆满",ok:true,msg:"上级对这次视察评价很好，回去后在多个场合表扬了本地工作。"};G.stats.trust=clamp(G.stats.trust+4,0,100);}
    else if(good>=0){res={t:"视察顺利",ok:true,msg:"视察平稳结束，上级提了几条要求，总体认可。"};G.stats.trust=clamp(G.stats.trust+1,0,100);}
    else{res={t:"视察出了岔子",ok:false,msg:"现场出了状况，上级临走时脸色不太好，秘书连夜打电话追问细节。"};G.stats.trust=clamp(G.stats.trust-5,0,100);}
  }else if(f.kind==="nego"){
    var m=f.meter,cname=f.company||"企业";
    if(m>=66){res={t:"项目落地",ok:true,msg:cname+"当场签了投资协议，一期投资额和用地都定了下来。"};
      G.local.economy=clamp(G.local.economy+6,0,100);G.stats.achievement=clamp(G.stats.achievement+6,0,100);G.local.finance=clamp(G.local.finance+3,0,100);}
    else if(m>=48){res={t:"达成初步意向",ok:true,msg:cname+"签下框架协议。项目算是有了个说法，至于最终落地签约，还要等后续正式推进。"};
      G.local.economy=clamp(G.local.economy+3,0,100);G.stats.achievement=clamp(G.stats.achievement+3,0,100);}
    else{res={t:"谈判未成",ok:false,msg:cname+"觉得条件不如周边地区，礼貌地表示“再研究研究”，随后没了下文。"};
      G.stats.achievement=clamp(G.stats.achievement-2,0,100);}
    res.meter=m;
  }else{
    var hard=f.acc.hard||0,soft=f.acc.soft||0;
    if(hard>=4){res={t:"整改到位",ok:true,msg:"五条问题逐条销号，巡视组回访时评价“动真碰硬、整改彻底”。"};
      G.hidden.audit=clamp(G.hidden.audit-8,0,100);G.stats.integrity=clamp(G.stats.integrity+4,0,100);G.stats.trust=clamp(G.stats.trust+4,0,100);}
    else if(hard>=2){res={t:"整改基本到位",ok:true,msg:"主要问题已整改，个别事项还在推进，巡视组基本认可。"};
      G.hidden.audit=clamp(G.hidden.audit-4,0,100);}
    else{res={t:"整改流于形式",ok:false,msg:"整改报告交上去了，但回访时被指出“就事论事、举一反三不够”。"};
      G.hidden.audit=clamp(G.hidden.audit+6,0,100);G.stats.trust=clamp(G.stats.trust-3,0,100);}
  }
  f.result=res;
  pushLog(f.title+"："+res.t,res.ok?"up":"warn");
}
function flowNext(){
  var head=G.queue[0];if(!head||!head.flow)return;
  var f=head.flow;
  if(!f.done){return;}
  var after=f.after;
  G.queue.shift();
  if(G.queue.length){save();render();return;}
  if(after)advanceSlot();
  else{save();render();}
}

/* 年度触发：视察 / 巡视整改 */
function yearFlowTrigger(){
  var r=new RNG(G.seed+G.year*613+29);
  var risk=(G.hidden.audit+G.hidden.discipline)/2;
  if(risk>34&&r.chance(0.42)){openFlow("xunshi");}
  else if(r.chance(0.30)){openFlow("inspect");}
}

   二十四、引擎 · 世界事件（与玩家相关的世界扰动）
   ============================================================ */
function worldPerturb(){
  /* 每年随机抽取一次与玩家相关的世界扰动 */
  if(!G.world)return;
  var r=new RNG(G.seed+G.year*811+13);
  if(!r.chance(0.35))return;
  var pool=G.world.npcs.filter(function(x){return x.alive&&x.status==="active"&&!x.close;});
  var p=r.pick(pool);if(!p)return;
  var kinds=["praise","pressure","help"];
  var k=r.pick(kinds);
  if(k==="praise"){
    G.stats.peers=clamp(G.stats.peers+2,0,100);
    enqueueTip("同僚的善意",p.name+"（"+p.title+"）在一次会上替你说了句话，你记下了这份情。",true);
  }else if(k==="pressure"){
    G.local.petition=clamp(G.local.petition+4,0,100);
    enqueueTip("兄弟县区的事",p.place+"那边出了点事，风声传过来，本地也跟着紧了紧。",false);
  }else{
    G.local.economy=clamp(G.local.economy+2,0,100);
    enqueueTip("区域协作",p.place+"与你所在辖区签了一项合作协议，双方都有好处。",true);
  }
}

var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");if(!t)return;
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");},2100);
}
function go(h){location.hash=h;setTimeout(render,0);}
function render(){
  var h=location.hash||"#/start";
  var app=document.getElementById("app");
  if(!app)return;
  if(h==="#/game"&&G){
    if(G.ended){app.innerHTML=endingHtml();return;}
    if(G.screen==="meeting"&&G.meetState){app.innerHTML=meetingHtml();return;}
    if(G.screen==="meetpick"){app.innerHTML=meetPickHtml();return;}
    if(G.screen==="budget"){app.innerHTML=budgetHtml();return;}
    if(G.screen==="rank"){app.innerHTML=rankHtml();return;}
    if(G.screen==="map"){app.innerHTML=mapScreenHtml();return;}
    if(G.screen==="dossier"){app.innerHTML=dossierScreenHtml();return;}
    if(G.screen==="gazette"){app.innerHTML=gazetteHtml();return;}
    if(G.screen==="leadership"){app.innerHTML=leadershipScreenHtml();return;}
    if(G.screen==="election"){app.innerHTML=electionHtml();return;}
    if(G.screen==="charter"){app.innerHTML=charterScreenHtml();return;}
    app.innerHTML=gameHtml();
  }
  else if(h==="#/ending"&&G&&G.ended){app.innerHTML=endingHtml();}
  else{app.innerHTML=startHtml();}
}

function schedCardHtml(){
  var h='<div class="card"><div class="card-h"><h2>本月日程</h2>'
    +'<span class="tagline">'+esc(TIER_NAME[ROLES[G.rank].tier])+' · '+absYear()+'年'+G.month+'月</span></div>'
    +'<div class="card-b"><div class="sched-grid">';
  for(var w=0;w<4;w++){
    h+='<div class="sched-week">';
    for(var p=0;p<3;p++){
      var idx=w*3+p,cell=G.sched.cells[idx];
      var cls="sched-cell p"+p;
      if(idx<G.sched.cur)cls+=" done";
      else if(idx===G.sched.cur)cls+=" now";
      var inner='<div class="sc-part">'+SLOT_PART[p]+'</div>';
      if(cell)inner+='<div class="sc-act">'+esc(cell.name)+'</div>';
      else if(idx===G.sched.cur)inner+='<div class="sc-act hint">进行中</div>';
      else inner+='<div class="sc-act empty">—</div>';
      h+='<div class="'+cls+'">'+inner+'</div>';
    }
    h+='</div>';
  }
  h+='</div><div class="sched-tip">一个月 4 周，每周过上午、下午、晚上。白天办事，晚上可休息回血，也能应酬、加班、陪家人。把时段用满或提前结束，才进入下月。</div></div></div>';
  return h;
}

  if(prev===undefined||prev===null)return "";
  var d=Math.round(v)-Math.round(prev);
  if(d===0)return "";

  return '<span class="dlt '+(good?"good":"bad")+'">'+(d>0?"▲":"▼")+Math.abs(d)+'</span>';
}

function npcBondsHtml(n){
  if(!n)return "";
  var bonds=bondsOf(n.id).filter(function(b){
    var o=findNpc(otherOf(b,n.id));
    return o&&o.alive;
  });
  if(!bonds.length)return "";
  var order={kin:"亲属",inlaw:"姻亲",patron:"",fellow:"同乡",ally:"盟友",sworn:"生死之交",rival:"对手"};
  var rows=bonds.slice(0,9).map(function(b){
    var o=findNpc(otherOf(b,n.id));
    var label=order[b.type];
    if(b.type==="patron")label=(b.a===n.id)?"门生":"靠山";
    var cls=b.type==="rival"?"bad":(b.type==="patron"||b.type==="sworn"?"good":"");
    return '<div class="bond-row"><span class="bond-type '+cls+'">'+label+'</span>'
      +'<span class="bond-name">'+esc(o.name)+'</span>'
      +'<span class="bond-role">'+esc(o.title)+'</span>'
      +'<button class="mini-btn" onclick="closePerson();openPerson(\''+o.id+'\')">接触</button></div>';
  }).join("");
  return '<div class="pgrp"><div class="pgrp-t">关系网 <span class="tagline">靠山 · 门生 · 盟友 · 对手</span></div>'
    +'<div class="bond-list">'+rows+'</div></div>';
}

function budgetHtml(){
  if(!G.budget)G.budget=initBudget();
  var b=G.budget,used=budgetUsed(),left=b.total-used;
  var totalFx={};
  BUDGET_ITEMS.forEach(function(it){
    if(b.applied)return;
    var lv=b.items[it.k];
    Object.keys(it.fx).forEach(function(k){totalFx[k]=(totalFx[k]||0)+it.fx[k]*lv/4;});
  });
  var rows=BUDGET_ITEMS.map(function(it){
    var lv=b.items[it.k];
    var lvlName=lv===4?"很高":lv===3?"偏高":lv===2?"标准":lv===1?"偏低":"很低";
    var col=lv>=3?"var(--pine)":lv===2?"var(--navy)":lv===1?"var(--gold)":"var(--seal)";
    var fxLine=Object.keys(it.fx).map(function(k){
      var v=it.fx[k]*lv/4;
      var d=Math.round(v*10)/10;
      if(!d)return "";
      var good=isNegKey(k)?d<0:d>0;
      return '<span class="cp '+(good?"up":"dn")+'">'+esc(statName(k))+' '+(d>0?"+":"")+d+'</span>';
    }).join("");
    return '<div class="bud-row"><div class="bud-top">'
      +'<span class="bud-n">'+esc(it.n)+'</span>'
      +'<span class="bud-d">'+esc(it.d)+'</span>'
      +(b.applied?'<span class="bud-amt">'+lvlName+'</span>'
        :'<span class="bud-ctrl"><button '+(lv<=0?"disabled":"")+' onclick="budAdj(\''+it.k+'\',-1)">−</button>'
        +'<span class="bud-amt">'+lv+' 档</span>'
        +'<button '+(lv>=4?"disabled":"")+' onclick="budAdj(\''+it.k+'\',1)">＋</button></span>')
      +'</div>'
      +'<div class="bud-bar"><i style="width:'+(lv/4*100)+'%;background:'+col+'"></i></div>'
      +'<div class="bud-fx">'+lvlName+' · '+(fxLine||"无直接效果")+'</div>'
      +'</div>';
  }).join("");
  var head='<div class="bud-head">'
    +'<div class="bh"><div class="k">可分配档数</div><div class="v">'+b.total+'</div></div>'
    +'<div class="bh"><div class="k">已分配</div><div class="v">'+used+'</div></div>'
    +'<div class="bh"><div class="k">剩余（预备费）</div><div class="v '+(left<0?"warn":"ok")+'">'+left+'</div></div>'
    +'<div class="bh"><div class="k">财政健康 / 债务</div><div class="v">'+Math.round(G.local.finance)+' / '+Math.round(G.local.debt)+'</div></div>'
    +'</div>';
  var body;
  if(b.applied){
    body='<div class="result"><div class="rt ok">预算已提交执行</div>'
      +'<div class="scene-text" style="font-size:13px">本年度财政预算安排：</div>'
      +(b.lines||[]).map(function(l){return '<div class="quote-line">'+esc(l)+'</div>';}).join("")
      +'<div class="stat-help" style="margin-top:8px">预算在下一年度可以重新编制。财政健康低于 30 时，保工资、保运转都会出问题。</div>'
      +'<div class="btn-row" style="margin-top:14px"><button class="btn seal" onclick="closeBudget()">回到工作</button></div></div>';
  }else{
    body='<div class="stat-help" style="margin-bottom:12px">每档代表一笔实实在在的钱。'
      +'一共 <b>'+b.total+'</b> 档要分给 '+BUDGET_ITEMS.length+' 个科目，每项最多 4 档。'
      +'<b>民生保障、教育事业、医疗卫生</b>直接决定民望与民生福祉；<b>基础设施、产业扶持</b>决定政绩与经济；'
      +'<b>生态环保、公共安全</b>决定排名榜上的环境与平安；<b>债务还本付息</b>低于 2 档会导致债务压力上升。</div>'
      +head+'<div class="bud-list">'+rows+'</div>'
      +'<div class="btn-row" style="margin-top:16px">'
      +'<button class="btn seal" onclick="confirmBudget()">提交本年度预算</button>'
      +'<button class="btn ghost" onclick="closeBudget()">稍后再编</button></div>';
  }
  return '<div class="screen"><div class="screen-in">'
    +screenTop("财政预算编制",absYear()+'年 · '+esc(TIER_NAME[ROLES[G.rank].tier])+' · '+esc(rolePlace(G.rank)),
      '<button class="icon-btn" onclick="closeBudget()">返回</button>')
    +'<div class="screen-body">'+body+'</div></div></div>';
}

function rankTableHtml(tier,mode){
  mode=mode||"total";
  var board=G.juris[tier];
  if(!board)return "";
  var list=board.list.slice();
  /* GDP / 人口 榜不把「全国」合计行放进来比较（它是汇总，不是同类） */
  if(mode==="gdp")list=list.filter(function(e){return !e.isNation;}).sort(function(a,b){return b.gdp-a.gdp;});
  else if(mode==="pop")list=list.filter(function(e){return !e.isNation;}).sort(function(a,b){return b.pop-a.pop;});
  else list.sort(function(a,b){return b.total-a.total;});
  var rows=list.map(function(e,i){
    var rk=(mode==="total")?(e.rank||i+1):(i+1);
    var chief=e.self?{name:G.pcName||"本人",trait:"—"}
      :(e.isNation?{name:"—",trait:"各省加权平均"}:(findNpc(e.chiefId)||{name:"—",trait:"—"}));
    var chg=(mode==="total"&&e.prevRank)?(e.prevRank-e.rank):0;
    var chgCls=chg>0?"up":chg<0?"down":"flat";
    var chgTxt=chg>0?("▲"+chg):chg<0?("▼"+(-chg)):"—";
    var pill=e.isNation?('<span class="pill">'+(e.self?"你分管":"全国平均")+'</span>')
      :(e.self?('<span class="pill b">'+(isNational()?"你分管":"你主政")+'</span>'):"");
    var mini=RANK_DIM.map(function(d){
      var v=e.dims[d.k];if(v===undefined)v=50;if(d.neg)v=100-v;
      return '<i style="height:'+Math.max(3,Math.round(v/100*20))+'px"></i>';
    }).join("");
    return '<tr class="'+(e.self?"me":"")+'">'
      +'<td class="rk-no'+(rk<=3?" top":"")+'">'+rk+'</td>'
      +'<td><div class="rk-name">'+esc(e.name)+' '+pill+'</div>'
      +'<div class="rk-chief">'+esc(chief.name)+' · '+esc(chief.trait)+'</div></td>'
      +'<td class="rk-score">'+e.total+'</td>'
      +'<td class="rk-gdp">'+esc(fmtGdp(e.gdp))+'</td>'
      +'<td class="rk-pop">'+esc(fmtPop(e.pop))+'</td>'
      +'<td class="rk-chg '+chgCls+'">'+chgTxt+'</td>'
      +'<td><div class="rk-mini">'+mini+'</div></td>'
      +'</tr>';
  }).join("");
  return '<div class="rank-wrap"><table class="rank"><thead><tr>'
    +'<th>名次</th><th>辖区 / 主官</th><th>综合分</th><th>GDP</th><th>人口</th><th>变化</th><th>七维</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

    +'<div class="screen-body">'+body+'</div></div></div>';

/* ============================================================
   二十八·B、渲染 · 全国地图
   ============================================================ */
function mpStar(x,y,s){
  var p=[];
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5,rr=(i%2===0)?s:s*0.44;
    p.push((x+Math.cos(a)*rr).toFixed(1)+","+(y+Math.sin(a)*rr).toFixed(1));
  }
  return "M"+p.join("L")+"Z";
}
function mpDiamond(x,y,s){
  return "M"+x+","+(y-s)+"L"+(x+s)+","+y+"L"+x+","+(y+s)+"L"+(x-s)+","+y+"Z";
}
/* 底色深浅 = 全国 GDP 名次（越深越靠前） */
function mpFill(k){
  var rk=provGdpRank(k),n=MAP_REGIONS.length;
  var t=(n-rk)/Math.max(1,n-1);
  return "rgba(62,107,94,"+(0.16+t*0.56).toFixed(2)+")";
}
function mapSvgHtml(hereKey,pickKey,clickFn,hereLabel){
  var here=hereKey||playerRegionKey();
  var pick=pickKey||(G&&G.mapPick)||here;
  var fn=clickFn||"mapPick";
  var lbl=hereLabel||"你在这里";
  var g=[];
  MAP_REGIONS.forEach(function(p){
    var sh=GEO_SHAPES[p.k];
    var isPick=(p.k===pick),isHere=(p.k===here);
    var stroke=isPick?"#B03A2E":(isHere?"#A9792B":"rgba(62,107,94,.55)");
    g.push('<path class="mp-reg" d="'+sh.d+'" fill="'+mpFill(p.k)+'" stroke="'+stroke+'" stroke-width="'+(isPick?2.8:1.2)+'"'
      +' stroke-linejoin="round" onclick="'+fn+'(\''+p.k+'\')"><title>'+esc(p.n)+'</title></path>');
  });
  MAP_REGIONS.forEach(function(p){
    var sh=GEO_SHAPES[p.k],c=sh.c;
    if(p.kind==="capital")g.push('<path class="mp-star" d="'+mpStar(c[0],p.y0+27,8)+'" pointer-events="none"/>');
    else g.push('<path class="mp-diamond" d="'+mpDiamond(c[0],p.y0+27,5)+'" pointer-events="none"/>');
    g.push('<text class="mp-name'+(p.n.length>3?" sm":"")+'" x="'+c[0]+'" y="'+(c[1]+4)+'" text-anchor="middle">'+esc(p.n)+'</text>');
    g.push('<text class="mp-cap" x="'+c[0]+'" y="'+(c[1]+19)+'" text-anchor="middle">'+esc(p.kind==="capital"?"首都":"省会 "+p.cap)+'</text>');
    if(p.k===here){
      g.push('<circle class="mp-pulse" cx="'+c[0]+'" cy="'+(p.y1-16)+'" r="5" pointer-events="none"/>');
      g.push('<circle class="mp-here-dot" cx="'+c[0]+'" cy="'+(p.y1-16)+'" r="5" pointer-events="none"/>');
      g.push('<text class="mp-here-lbl" x="'+c[0]+'" y="'+(p.y1-3)+'" text-anchor="middle">'+esc(lbl)+'</text>');
    }
  });
  return '<div class="map-wrap"><svg class="map-svg" viewBox="0 0 680 480" preserveAspectRatio="xMidYMid meet"'
    +' role="img" aria-label="虚构世界示意地图，非真实地图">'+g.join("")+'</svg></div>';
}

/* ============================================================
   三十、选举关卡（入常 / 总理 / 国家主席 / 总书记）
   到了副国级以上，提拔不再由年度考核直接决定，而要开会、投票。
   你可能在某一关止步很多年，也可能一步成龙。
   ============================================================ */
var _ELECT_UNIT_POOL={
  "中央":["华北地区负责人","华东地区负责人","华南地区负责人","西南地区负责人","西北地区负责人",
    "东北地区负责人","组织口","宣传口","政法口","统战口","外事口","财经口","农业口","工业口","科教口",
    "军队口","纪检口","办公厅口","老同志代表","地方党委代表","中央委员代表","候补委员代表",
    "民族地区代表","金融口","国资口","智库与学界"],
  "全国人大":["北原省代表团","中京市代表团","中州省代表团","江澜省代表团","西川省代表团","云岭省代表团",
    "南泽省代表团","东海省代表团","海云省代表团","岭南省代表团","军队代表团","工人代表界","农民代表界",
    "教育科技界","医疗卫生界","文艺界","体育界","工商界","金融界","妇女代表界","青年代表界","少数民族界",
    "归国华侨界","港澳代表界","法律界","新闻出版界","环境资源界","社保福利界","基层一线代表","老干部代表",
    "国企代表界","民企代表界","外经贸界","交通建设界","能源界","信息产业界","水利界","国防工业界",
    "民主党派代表","无党派代表"]
};
function electUnits(cfg){
  var pool=(_ELECT_UNIT_POOL[cfg.host]||_ELECT_UNIT_POOL["中央"]).slice();
  var out=[];
  for(var i=0;i<cfg.seats;i++)out.push(pool[i%pool.length]+(i>=pool.length?"（二）":""));
  return out;
}
function electScore(){
  var s=G.stats;
  var base=s.achievement*0.20+s.trust*0.22+s.peers*0.18+s.popularity*0.14
    +s.integrity*0.12+s.competence*0.10+G.rank*0.9;
  if(G.elect&&G.elect.wins)base+=G.elect.wins*4;
  if(G.elect&&G.elect.fails)base-=G.elect.fails*6;
  if(G.charter&&G.charter.powerConcentrated)base+=7;
  if(G.expose&&G.expose.heat>40)base-=(G.expose.heat-40)*0.16;
  if(G.hidden.discipline>60)base-=(G.hidden.discipline-60)*0.20;
  return Math.round(clamp(base,0,100));
}
function electNeed(cfg){
  return clamp(cfg.need+(G.elect&&G.elect.fails?G.elect.fails*BAL.electFailBar:0),0,0.95);
}
/* 竞争者：和你争同一个位子的人。没有对手的选举不叫选举。
   优先从世界里的高官里挑（这样"关系网"会真的影响选举），不够再用世界人名生成。 */
function electRivals(cfg,r,count){
  var pool=G.world.npcs.filter(function(n){
    return n.alive&&n.status==="active"&&!n.close
      &&(n.tier==="prov"||n.tier==="nation"||n.tier==="state")
      &&/书记|长|主任|主席/.test(n.title);
  });
  /* 那位与你同岁的"老朋友"若已爬到高位，也可能成为你的对手——只是你未必想到是他 */
  pool=shuffle(pool,r);
  var out=[];
  for(var i=0;i<count&&i<pool.length;i++){
    var n=pool[i];
    var prof=n.persona||{amb:.5};
    var base=electScore()+r.range(-BAL.electRivalSpread,BAL.electRivalSpread)+prof.amb*8;
    if(n.villain)base+=10;   /* 隐忍多年、经营深厚，实力不容小觑 */
    out.push({id:n.id,name:n.name,title:n.title,place:n.place,
      strength:Math.round(clamp(base,25,99))});
  }
  while(out.length<count){
    out.push({id:null,name:worldName(r),title:(cfg.host==="全国人大"?"某省省委书记":"某部部长"),
      place:"",strength:Math.round(clamp(electScore()+r.range(-BAL.electRivalSpread,BAL.electRivalSpread),25,99))});
  }
  return out;
}
function startElection(targetRank){
  var cfg=ELECTIONS[targetRank];
  if(!cfg)return;
  if(!G.elect)G.elect={wins:0,fails:0,st:null};
  var r=new RNG(G.seed+G.year*577+targetRank*31);
  var names=electUnits(cfg);
  var units=names.map(function(nm,i){
    return {i:i,n:nm,bias:r.range(-BAL.electBiasSpan,BAL.electBiasSpan),
      rbias:r.range(-BAL.electBiasSpan,BAL.electBiasSpan),gain:0,visited:false};
  });
  var rivals=electRivals(cfg,r,targetRank>=13?2:3);
  var quota=clamp(3+Math.floor(G.rank/4),3,8);
  G.elect.st={
    target:targetRank,cfg:cfg,units:units,rivals:rivals,score:electScore(),
    quota:quota,visits:0,used:{},elder:false,media:false,promise:false,
    leaks:0,phase:"campaign",result:null,seed:r.range(1,1e9)
  };
  G.screen="election";
  pushLog(absYear()+"年 · "+cfg.name+"：你被提名为"+cfg.title+"人选","up");
  save();render();
}
/* 每个单位只会投给一个人：先看谁在它那里得分最高 */
function electUnitSupport(u){
  var st=G.elect.st;
  if(!st)return false;
  var mine=st.score+u.bias+u.gain;
  var top=mine;
  (st.rivals||[]).forEach(function(rv){if(rv.strength+u.rbias>top)top=rv.strength+u.rbias;});
  return mine>=top;
}
/* 各单位此刻更偏向谁（用于界面展示） */
function electUnitLean(u){
  var st=G.elect.st;if(!st)return "";
  var mine=st.score+u.bias+u.gain,best=null,bestV=mine;
  (st.rivals||[]).forEach(function(rv){
    var v=rv.strength+u.rbias;
    if(v>bestV){bestV=v;best=rv;}
  });
  return best?best.name:"你";
}
function electCount(){
  var st=G.elect.st;if(!st)return {sup:0,total:0,rate:0};
  var sup=st.units.filter(electUnitSupport).length;
  return {sup:sup,total:st.units.length,rate:st.units.length?sup/st.units.length:0};
}
/* 对手整体实力对比（用于界面提示，不显示具体数值） */
function rivalPressure(){
  var st=G.elect.st;if(!st||!st.rivals||!st.rivals.length)return "无";
  var top=Math.max.apply(null,st.rivals.map(function(x){return x.strength;}));
  var d=top-st.score;
  if(d>=10)return "对手明显占优";
  if(d>=3)return "对手略占上风";
  if(d>=-3)return "势均力敌";
  if(d>=-10)return "你略占上风";
  return "你明显占优";
}
function electVisit(idx){
  var st=G.elect.st;if(!st||st.phase!=="campaign")return;
  var u=st.units[idx];if(!u)return;
  if(u.visited){toast("这个单位已经谈过了");return;}
  if(st.visits>=st.quota){toast("这一轮能单独谈的单位已经用完了（"+st.quota+" 个）");return;}
  if(G.energy<3){toast("精力不足，跑一趟要 3 点精力");return;}
  G.energy=clamp(G.energy-3,0,100);
  st.visits++;u.visited=true;
  var r=new RNG(st.seed+G.year*97+idx*13+3);
  var rate=clamp(BAL.electVisitBase+G.stats.peers*0.22+G.stats.trust*0.18
    +G.stats.competence*0.14+G.rank*1.2-st.visits*4,6,90);
  var ok=r.chance(rate/100);
  if(ok){
    u.gain+=BAL.electVisitGain;
    G.stats.peers=clamp(G.stats.peers+0.6,0,100);
  }else{
    st.leaks++;
    G.hidden.discipline=clamp(G.hidden.discipline+0.6,0,100);
  }
  st.lastVisit={n:u.n,ok:ok,rate:Math.round(rate)};
  save();render();
}
function electElder(){
  var st=G.elect.st;if(!st||st.phase!=="campaign"||st.elder)return;
  if(G.stats.trust<BAL.electElderTrustCost+8){toast("你的上级信任太低，请不动老同志");return;}
  st.elder=true;
  G.stats.trust=clamp(G.stats.trust-BAL.electElderTrustCost,0,100);
  st.units.forEach(function(u){u.gain+=BAL.electElderGain;});
  enqueueTip("老领导出面",
    "一位已经退下来的老同志答应替你说一句话。\n"
    +"话不长，但分量很重——很多还在位子上的人，当年都是他一手带出来的。\n"
    +"代价是：你又欠下一份人情，而「欠人情」这三个字，迟早要还。",true);
  save();render();
}
function electMedia(){
  var st=G.elect.st;if(!st||st.phase!=="campaign"||st.media)return;
  st.media=true;
  var r=new RNG(st.seed+G.year*211+7);
  G.local.sentiment=clamp(G.local.sentiment+6,0,100);
  if(r.chance(BAL.electMediaBackfire)){
    st.units.forEach(function(u){u.gain-=4;});
    G.stats.trust=clamp(G.stats.trust-4,0,100);
    enqueueTip("造势过头了",
      "几篇稿子发出去，声势确实起来了。\n"
      +"但有人开始说「这么急着上，是不是心虚」。风向一转，反而丢了几票。",false);
  }else{
    st.units.forEach(function(u){u.gain+=BAL.electMediaGain;});
    enqueueTip("声势起来了",
      "几篇报道接连出来，措辞都很克制，但该看见的人都看见了。\n"
      +"代表们开始主动打听你的名字——这在会上是件好事。",true);
  }
  save();render();
}
function electPromise(){
  var st=G.elect.st;if(!st||st.phase!=="campaign"||st.promise)return;
  st.promise=true;
  G.stats.integrity=clamp(G.stats.integrity-BAL.electPromiseIntegCost,0,100);
  G.hidden.audit=clamp(G.hidden.audit+5,0,100);
  st.units.forEach(function(u){u.gain+=BAL.electPromiseGain;});
  var v=villainNpc();
  if(v){var rel=getRel(v.id);rel.favor+=1;rel.trust=clamp(rel.trust+6,0,100);}
  enqueueTip("许出去的位置",
    "你在几次私下会面里，把几个位置许了出去。话说得很含蓄，但对方都听懂了。\n"
    +"票来得很快。只是从今往后，这些人会拿着你当初那句话，一次次找上门来。",true);
  save();render();
}
function electVote(){
  var st=G.elect.st;if(!st||st.phase!=="campaign")return;
  st.phase="result";
  var c=electCount();
  var need=electNeed(st.cfg);
  var pass=c.rate>=need;
  /* 逐单位计票：每个单位投给当时得分最高者，展示你与各竞争者的实际得票 */
  var you=0,rtally={};
  (st.rivals||[]).forEach(function(rv){rtally[rv.name]={name:rv.name,title:rv.title,votes:0,strength:rv.strength};});
  st.units.forEach(function(u){
    var mine=st.score+u.bias+u.gain,best={name:"你",v:mine};
    (st.rivals||[]).forEach(function(rv){var v=rv.strength+u.rbias;if(v>best.v)best={name:rv.name,v:v};});
    if(best.name==="你")you++;else if(rtally[best.name])rtally[best.name].votes++;
  });
  var rivalVotes=Object.keys(rtally).map(function(k){return rtally[k];})
    .filter(function(x){return x.votes>0;}).sort(function(a,b){return b.votes-a.votes;});
  st.result={sup:c.sup,total:c.total,rate:c.rate,need:need,pass:pass,you:you,rivalVotes:rivalVotes};
  if(!G.electLog)G.electLog=[];
  G.electLog.push({y:G.year,age:G.age,target:st.target,score:st.score,
    sup:c.sup,total:c.total,rate:Math.round(c.rate*100),need:Math.round(need*100),pass:pass});
  if(pass){
    G.stats.trust=clamp(G.stats.trust+BAL.electWinTrust,0,100);
    if(!G.elect)G.elect={wins:0,fails:0,st:null};
    G.elect.wins++;
    pushLog(st.cfg.name+"：当选"+st.cfg.title+"（"+c.sup+"/"+c.total+"）","up");
  }else{
    if(!G.elect)G.elect={wins:0,fails:0,st:null};
    G.elect.fails++;
    G.stats.trust=clamp(G.stats.trust-BAL.electFailTrust,0,100);
    G.stats.peers=clamp(G.stats.peers-BAL.electFailPeer,0,100);
    pushLog(st.cfg.name+"：未能当选"+st.cfg.title+"（"+c.sup+"/"+c.total+"）","warn");
  }
  save();render();
}
function electFinish(){
  var st=G.elect.st;if(!st)return;
  var res=st.result;
  G.screen=null;
  if(res&&res.pass){
    var target=st.target;
    G.elect.st=null;
    promote({action:"promote",toTitle:ROLES[target].title,toPlace:rolePlace(target),viaElect:true});
    var eg=checkEnding();
    save();render();
    if(eg){endGame(eg.id,eg.reason);return;}
    if(!G.queue.length)openBudget();
  }else{

/* 主动放弃：保住现有位置，也会被记一笔"识大体" */
function electWithdraw(){

  G.stats.trust=clamp(G.stats.trust+3,0,100);

    "你在会上表示自己还需要多锻炼，把机会留给更合适的同志。\n"
    +"话说完，会场上的气氛松了下来。有人拍你的肩膀，说「年轻人沉得住气」。\n"
