<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>红线之上 · 架空仕途模拟</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23243447'/><rect x='22' y='22' width='56' height='56' rx='6' fill='none' stroke='%23B03A2E' stroke-width='7'/></svg>">
<!-- 字体异步加载：联网时用 Noto 系列，断网时立即回落到系统字体，绝不阻塞首屏 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   红线之上 —— 视觉系统：干部档案 / 内参 质感
   ============================================================ */
:root{
  --paper:#F4F0E6;          /* 纸面底 */
  --paper-2:#FCFAF3;         /* 卡片纸 */
  --paper-3:#EFE9DA;         /* 深一档纸/表头 */
  --ink:#21262C;             /* 墨色正文 */
  --ink-2:#545B63;           /* 次要文字 */
  --ink-3:#8C8F93;           /* 弱文字 */
  --line:#DED6C2;            /* 暖发丝线 */
  --line-2:#CFC5AC;
  --seal:#B03A2E;            /* 朱红：廉洁/纪委/印章/唯一强调 */
  --seal-soft:#F3E2DF;
  --navy:#27384B;            /* 藏青：结构/标题 */
  --navy-soft:#E4E9EE;
  --pine:#3E6B5E;            /* 墨绿：政绩/正面 */
  --pine-soft:#E2ECE7;
  --gold:#A9792B;            /* 琥珀：提醒 */
  --gold-soft:#F1E8D2;
  --r:11px;
  --shadow:0 1px 2px rgba(33,30,22,.05), 0 6px 20px -12px rgba(33,30,22,.18);
  --shadow-lg:0 4px 10px rgba(33,30,22,.10), 0 24px 60px -24px rgba(33,30,22,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Noto Sans SC", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  color:var(--ink); background:var(--paper);
  background-image:
    radial-gradient(rgba(60,50,30,.035) 1px, transparent 1px),
    radial-gradient(rgba(60,50,30,.02) 1px, transparent 1px);
  background-size:22px 22px, 11px 11px;
  background-position:0 0, 5px 6px;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Noto Serif SC", "Songti SC", serif;}
#app{min-height:100vh; display:flex; flex-direction:column;}
button{font-family:inherit; cursor:pointer;}
::selection{background:rgba(176,58,46,.18);}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, var(--navy), #2C4056);
  color:#EDE7D8; border-bottom:3px solid var(--seal);
  box-shadow:0 2px 14px -8px rgba(20,28,38,.6);
}
.topbar-in{max-width:1240px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:14px;}
.brand{display:flex; align-items:center; gap:11px;}
.brand .seal-mark{
  width:38px; height:38px; border-radius:8px; flex:none;
  background:#F2ECDD; display:grid; place-items:center;
  border:1px solid rgba(0,0,0,.15);
}
.brand h1{font-family:"Noto Serif SC", serif; font-weight:900; font-size:19px; margin:0; letter-spacing:2px; color:#F6F1E4;}
.brand .sub{font-size:11px; color:#B9C2CC; letter-spacing:1px; margin-top:1px;}
.topbar .spacer{flex:1;}
.tb-meta{font-size:12px; color:#C7CFD8; text-align:right; line-height:1.4;}
.tb-meta b{color:#F0E9D8; font-weight:500;}
.icon-btn{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:#EDE7D8;
  border-radius:8px; padding:7px 12px; font-size:12.5px; transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.18);}
.icon-btn:active{transform:translateY(1px);}

/* ---------- 布局 ---------- */
.layout{flex:1; max-width:1240px; width:100%; margin:0 auto; padding:18px; display:grid; grid-template-columns:minmax(0,1fr) 342px; gap:18px; align-items:start;}
.main{min-width:0; display:flex; flex-direction:column; gap:16px;}
.side{position:sticky; top:78px; display:flex; flex-direction:column; gap:13px;}

/* ---------- 卡片 ---------- */
.card{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow);
}
.card-h{
  padding:11px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px;
  background:linear-gradient(180deg, #FDFBF5, #F6F1E5); border-radius:var(--r) var(--r) 0 0;
}
.card-h h2{margin:0; font-family:"Noto Serif SC", serif; font-size:15.5px; font-weight:700; color:var(--navy); letter-spacing:1px;}
.card-h .tagline{font-size:11.5px; color:var(--ink-3);}
.card-h .right{margin-left:auto; font-size:11.5px; color:var(--ink-2);}
.card-b{padding:15px 16px;}

/* ---------- 场景/叙事 ---------- */
.scene-kicker{font-size:11.5px; letter-spacing:3px; color:var(--seal); font-weight:500;}
.scene-title{font-family:"Noto Serif SC", serif; font-weight:900; font-size:23px; color:var(--navy); margin:5px 0 4px; letter-spacing:1px;}
.scene-text{color:var(--ink-2); font-size:14.5px;}
.scene-text p{margin:8px 0;}
.quote-line{border-left:3px solid var(--line-2); padding:2px 0 2px 12px; color:var(--ink-2); font-style:normal; margin:10px 0;}

/* ---------- 选项按钮 ---------- */
.choices{display:flex; flex-direction:column; gap:9px; margin-top:13px;}
.choice{
  text-align:left; background:var(--paper-2); border:1px solid var(--line); border-radius:10px;
  padding:11px 14px; font-size:14px; color:var(--ink); transition:.15s; line-height:1.45;
}
.choice .ct{font-weight:500; color:var(--navy); display:block; margin-bottom:2px;}
.choice .cd{font-size:12px; color:var(--ink-3);}
.choice:hover{border-color:var(--navy); background:#fff; transform:translateY(-1px); box-shadow:var(--shadow);}
.choice:active{transform:translateY(0);}
.choice:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:none;}
.choice.danger:hover{border-color:var(--seal);}
.choice.danger .ct{color:var(--seal);}

/* ---------- 行动卡（本月办理） ---------- */
.action-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px;}
.act{
  text-align:left; background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:11px 12px;
  transition:.15s; position:relative; overflow:hidden;
}
.act .at{font-size:13.5px; font-weight:600; color:var(--navy); display:flex; align-items:center; gap:7px;}
.act .ad{font-size:11.5px; color:var(--ink-3); margin:4px 0 7px; min-height:30px;}
.act .ae{font-size:11px; color:var(--gold); font-weight:500;}
.act:hover{border-color:var(--navy); transform:translateY(-2px); box-shadow:var(--shadow);}
.act:active{transform:translateY(0);}
.act:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none;}
.act .slot{position:absolute; top:0; left:0; width:3px; height:100%; background:var(--pine);}
.act.rest .slot{background:var(--gold);}
.act.risk .slot{background:var(--seal);}
.btn{
  border:1px solid var(--navy); background:var(--navy); color:#F2ECDD; border-radius:9px;
  padding:10px 18px; font-size:14px; font-weight:500; transition:.15s;
}
.btn:hover{background:#32485f;}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent; color:var(--navy);}
.btn.ghost:hover{background:var(--navy-soft);}
.btn.seal{background:var(--seal); border-color:var(--seal);}
.btn.seal:hover{background:#9c3228;}
.btn.block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

/* ---------- 身份卡 ---------- */
.idcard{background:linear-gradient(160deg,#2C4056,#243447); color:#EDE7D8; border:1px solid var(--navy);}
.idcard .card-h{background:transparent; border-bottom:1px solid rgba(255,255,255,.12);}
.idcard .card-h h2{color:#F4EEDD;}
.idpost{font-family:"Noto Serif SC", serif; font-size:19px; font-weight:700; letter-spacing:1px;}
.idplace{font-size:12.5px; color:#BFC8D2; margin-top:3px;}
.idgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:rgba(255,255,255,.1); border-radius:9px; overflow:hidden; margin-top:12px;}
.idgrid .cell{background:#2C4056; padding:9px 8px; text-align:center;}
.idgrid .cell .k{font-size:10.5px; color:#AAB4BF;}
.idgrid .cell .v{font-size:15px; font-weight:600; color:#F4EEDD; font-variant-numeric:tabular-nums;}

/* ---------- 属性条 ---------- */
.energy-wrap{margin-bottom:4px;}
.energy-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
.energy-top b{font-variant-numeric:tabular-nums;}
.bar{height:9px; background:var(--paper-3); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.bar > i{display:block; height:100%; border-radius:6px; transition:width .4s ease;}
.stat-list{display:grid; grid-template-columns:1fr 1fr; gap:11px 16px;}
.stat .st{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-2); margin-bottom:3px;}
.stat .st b{color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600;}
.bar.sm{height:7px;}
.mini-state{display:flex; flex-direction:column; gap:8px;}
.mini-state .msr{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--ink-2);}
.mini-state .msr .k{width:64px; flex:none;}
.mini-state .msr .v{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600;}

/* ---------- 隐患线索（隐藏风险） ---------- */
.clues{display:flex; flex-direction:column; gap:8px;}
.clue{display:flex; gap:9px; font-size:12px; color:var(--ink-2); background:var(--paper); border:1px dashed var(--line-2); border-radius:8px; padding:8px 10px;}
.clue .dot{flex:none; width:7px; height:7px; border-radius:50%; margin-top:6px;}
.clue .ct{color:var(--ink); font-weight:500;}
.clue .cd{color:var(--ink-3); font-size:11px;}
.clue.seal .dot{background:var(--seal);} .clue.gold .dot{background:var(--gold);} .clue.pine .dot{background:var(--pine);}
.clue-empty{font-size:12px; color:var(--ink-3); text-align:center; padding:6px;}

/* ---------- 日志 / 履历 ---------- */
.log{max-height:230px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px;}
.log-item{display:flex; gap:9px; font-size:12.5px;}
.log-item .when{flex:none; width:62px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.log-item .what{color:var(--ink-2);}
.log-item.up .what{color:var(--pine);} .log-item.warn .what{color:var(--gold);} .log-item.bad .what{color:var(--seal);}
details.fold summary{cursor:pointer; font-size:12px; color:var(--ink-2); list-style:none; user-select:none;}
details.fold summary::-webkit-details-marker{display:none;}
details.fold summary::after{content:"展开"; float:right; color:var(--ink-3);}
details.fold[open] summary::after{content:"收起";}

/* ---------- 模态事件 ---------- */
.overlay{position:fixed; inset:0; background:rgba(24,28,33,.5); backdrop-filter:blur(2px); z-index:60; display:grid; place-items:center; padding:18px; animation:fade .2s;}
.modal{width:100%; max-width:560px; max-height:90vh; overflow:auto; background:var(--paper-2); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); animation:pop .22s ease;}
.modal .card-h{border-radius:14px 14px 0 0;}
.modal .card-b{padding:17px 18px;}
.stamp{position:absolute; right:16px; top:13px; width:54px; height:54px; border:2px solid var(--seal); color:var(--seal); border-radius:7px; display:grid; place-items:center; font-family:"Noto Serif SC",serif; font-weight:700; font-size:12px; transform:rotate(-10deg); opacity:.85; line-height:1.1; text-align:center;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);}to{opacity:1; transform:none;}}

/* ---------- 开始页 ---------- */
.start{flex:1; display:grid; place-items:center; padding:34px 18px;}
.start-card{width:100%; max-width:760px; text-align:center;}
.start-hero{border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,#FCFAF3,#F3EEE0); box-shadow:var(--shadow-lg); padding:40px 30px 32px; position:relative; overflow:hidden;}
.start-hero .big-seal{width:74px; height:74px; margin:0 auto 16px; border:3px solid var(--seal); border-radius:12px; display:grid; place-items:center; color:var(--seal); transform:rotate(-6deg);}
.start-hero h1{font-family:"Noto Serif SC",serif; font-weight:900; font-size:40px; letter-spacing:8px; color:var(--navy); margin:0;}
.start-hero .slogan{color:var(--seal); font-size:14px; letter-spacing:4px; margin:12px 0 6px;}
.start-hero .desc{color:var(--ink-2); font-size:13.5px; max-width:560px; margin:14px auto 0;}
.start-hero .disc{color:var(--ink-3); font-size:11.5px; margin-top:16px;}
.start-origins{display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin:22px 0; text-align:left;}
.origin{background:var(--paper-2); border:1px solid var(--line); border-radius:11px; padding:13px; transition:.15s;}
.origin .ot{font-family:"Noto Serif SC",serif; font-weight:700; color:var(--navy); font-size:14.5px;}
.origin .od{font-size:11.5px; color:var(--ink-3); margin:5px 0 8px; min-height:46px;}
.origin .ostat{font-size:11px; color:var(--pine);}
.origin:hover{border-color:var(--seal); transform:translateY(-2px); box-shadow:var(--shadow);}
.start-foot{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
.seed-row{display:flex; gap:8px; justify-content:center; align-items:center; margin-top:16px; font-size:12px; color:var(--ink-3); flex-wrap:wrap;}
.seed-row input{border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12.5px; width:130px; background:var(--paper-2); color:var(--ink);}

/* ---------- 结局 ---------- */
.ending{max-width:680px; margin:0 auto;}
.ending .ebanner{text-align:center; padding:34px 26px; border-radius:14px; border:1px solid var(--line);}
.ending .ek{letter-spacing:4px; font-size:12px;}
.ending .et{font-family:"Noto Serif SC",serif; font-weight:900; font-size:34px; margin:10px 0; letter-spacing:3px;}
.ending .everdict{color:var(--ink-2); font-size:14px; max-width:520px; margin:0 auto;}
.timeline{position:relative; padding-left:22px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:13px;}
.timeline .tn{position:relative;}
.timeline .tn::before{content:""; position:absolute; left:-28px; top:5px; width:11px; height:11px; border-radius:50%; background:var(--paper-2); border:2px solid var(--pine);}
.timeline .tn.bad::before{border-color:var(--seal);}
.timeline .ty{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.timeline .tt{font-size:13.5px; font-weight:600; color:var(--navy);}
.timeline .td{font-size:12px; color:var(--ink-2);}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); z-index:80;
  background:var(--navy); color:#F2ECDD; padding:10px 18px; border-radius:10px; font-size:13px;
  opacity:0; pointer-events:none; transition:.25s; box-shadow:var(--shadow-lg); max-width:90vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- 响应式 ---------- */
.side-toggle{display:none;}
@media (max-width:960px){
  .layout{grid-template-columns:1fr; padding:13px; gap:13px;}
  .side{position:static; display:none;}
  .side.open{display:flex;}
  .side-toggle{display:inline-flex;}
  .tb-meta{display:none;}
  .start-hero h1{font-size:31px; letter-spacing:5px;}
  .scene-title{font-size:20px;}
}
@media (max-width:480px){
  .stat-list{grid-template-columns:1fr;}
  .action-grid{grid-template-columns:1fr 1fr;}
  .topbar-in{padding:9px 12px;}
  .brand h1{font-size:17px;}
  .start-origins{grid-template-columns:1fr;}
  .start-hero{padding:30px 18px 24px;}
  .start-hero .desc{font-size:14px;}
  .origin .od{font-size:12.5px; min-height:0;}
  .origin .ostat{font-size:12px;}
  .seed-row input{font-size:16px; width:150px;}
}

/* ---------- 本月日程 ---------- */
.sched-grid{display:flex;flex-direction:column;gap:8px;}
.sched-week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sched-cell{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper-2);}
.sched-cell .sc-part{font-size:10.5px;color:var(--ink-3);letter-spacing:1px;}
.sched-cell .sc-act{font-size:12px;font-weight:600;margin-top:2px;color:var(--navy);min-height:17px;}
.sched-cell .sc-act.empty{color:var(--ink-3);font-weight:400;}
.sched-cell .sc-act.hint{color:var(--gold);}
.sched-cell.done{background:var(--paper-3);}
.sched-cell.done .sc-act{color:var(--ink-2);}
.sched-cell.now{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal-soft);}
.sched-cell.p2{background:linear-gradient(180deg,var(--paper-2),#F0EDE4);}
.sched-tip{font-size:11.5px;color:var(--ink-2);margin-top:10px;line-height:1.6;}

/* ---------- 手头项目 ---------- */
.pj-list{display:flex;flex-direction:column;gap:12px;}
.pj{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--paper-2);}
.pj.done{background:var(--paper-3);opacity:.8;}
.pj-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pj-name{font-weight:700;color:var(--navy);font-size:13.5px;}
.pj-state{font-size:10.5px;color:var(--ink-2);}
.pj-state.risk{color:var(--seal);font-weight:600;}
.pj-prog{height:7px;border-radius:6px;background:var(--paper-3);overflow:hidden;margin:9px 0;}
.pj-prog i{display:block;height:100%;background:var(--navy);border-radius:6px;}
.pj-btns{display:flex;gap:6px;}
.pjb{flex:1;border:1px solid var(--line-2);background:var(--paper-2);border-radius:8px;padding:7px 4px;font-size:11.5px;color:var(--ink);cursor:pointer;}
.pjb span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums;}
.pjb.rush{border-color:var(--gold);color:var(--gold);}
.pjb.fix{border-color:var(--pine);color:var(--pine);}
.pjb:disabled{opacity:.45;cursor:not-allowed;}
.ps-card{margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--paper-2);}
.ps-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--navy);font-size:13px;margin-bottom:10px;}
.ps-grade{font-size:12px;padding:2px 10px;border-radius:20px;}
.ps-grade.先进{color:var(--pine);background:var(--pine-soft);}
.ps-grade.中游{color:var(--gold);background:var(--gold-soft);}
.ps-grade.垫底{color:var(--seal);background:var(--seal-soft);}
.ps-row{display:flex;align-items:center;gap:9px;margin:7px 0;}
.ps-k{width:64px;font-size:11px;color:var(--ink-2);flex-shrink:0;}
.ps-bar{flex:1;height:7px;border-radius:6px;background:var(--paper-3);overflow:hidden;}
.ps-bar i{display:block;height:100%;border-radius:6px;}
.ps-bar i.g{background:var(--pine);}.ps-bar i.m{background:var(--gold);}.ps-bar i.b{background:var(--seal);}
.ps-v{width:26px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);}

/* ---------- 谋划 ---------- */
.sch-list{display:flex;flex-direction:column;gap:10px;}
.sch-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper-2);}
.sch-item.evil{border-color:var(--seal);background:var(--seal-soft);}
.sch-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.sch-name{font-weight:700;color:var(--navy);font-size:13.5px;}
.sch-t{font-size:11px;color:var(--ink-2);}
.sch-pow{margin-left:auto;font-size:11px;color:var(--pine);font-variant-numeric:tabular-nums;}
.sch-item.evil .sch-pow{color:var(--seal);}
.sch-prog{height:7px;border-radius:6px;background:var(--paper-3);overflow:hidden;margin-top:8px;}
.sch-prog i{display:block;height:100%;border-radius:6px;background:var(--navy);}
.sch-item.evil .sch-prog i{background:var(--seal);}
.sch-meta{font-size:10.5px;color:var(--ink-3);margin-top:6px;}
.sch-btns{display:flex;gap:6px;margin-top:9px;}
.pact.launch.evil .pact-name{color:var(--seal);}
.sch-launch{margin-top:4px;}

/* ---------- 情报面板 ---------- */
.intel-list{display:flex;flex-direction:column;gap:10px;}
.intel-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper-2);}
.intel-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.intel-type{font-size:12px;font-weight:700;color:var(--seal);background:var(--seal-soft);padding:2px 9px;border-radius:6px;}
.intel-name{font-weight:700;color:var(--navy);font-size:13px;}
.intel-ev{margin-left:auto;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.intel-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center;}
.ibtn{font-size:11.5px;padding:6px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper-3);color:var(--ink);}
button.ibtn:active{transform:scale(.95);}
.ibtn.danger{border-color:var(--seal);color:var(--seal);}
.intel-done{font-size:11px;color:var(--pine);}

/* ---------- 人脉卡 ---------- */
.net-list{display:flex;flex-direction:column;gap:9px;}
.net-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.net-info{min-width:96px;flex:1;}
.net-name{font-weight:700;color:var(--navy);font-size:14px;}
.net-role{font-size:11px;color:var(--ink-2);margin-top:1px;}
.net-chips{display:flex;gap:5px;flex-wrap:wrap;}
.net-chip{font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--paper-3);color:var(--ink-2);font-variant-numeric:tabular-nums;}
.net-chip.good{background:var(--pine-soft);color:var(--pine);}
.net-chip.bad{background:var(--seal-soft);color:var(--seal);}
.net-chip.fear{background:var(--gold-soft);color:var(--gold);}
.mini-btn{font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;}
button.mini-btn:active{transform:scale(.96);}

/* ---------- 人物互动菜单 ---------- */
.person-overlay .person-modal{max-width:520px;}
.person-head{padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--paper-2),#F3EEE2);border-radius:var(--r) var(--r) 0 0;}
.ph-name{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700;color:var(--navy);}
.ph-title{font-size:12.5px;color:var(--ink-2);margin-top:3px;}
.ph-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.rel-bars{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
.relbar{display:flex;align-items:center;gap:9px;font-size:11.5px;}
.rb-l{width:30px;color:var(--ink-2);}
.rb-track{flex:1;height:7px;border-radius:6px;background:var(--paper-3);overflow:hidden;}
.rb-fill{height:100%;border-radius:6px;}
.rb-fill.navy{background:var(--navy);}
.rb-fill.pine{background:var(--pine);}
.rb-fill.seal{background:var(--seal);}
.rb-v{width:34px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.favor-line{margin-top:10px;font-size:12px;color:var(--gold);}
.person-acts{padding:12px 14px;display:flex;flex-direction:column;gap:14px;}
.pgrp-t{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:2px;margin-bottom:7px;}
.pact{text-align:left;width:100%;border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:10px 12px;margin-bottom:7px;}
.pact:active{transform:scale(.99);}
.pact.dis{opacity:.55;}
.pact-top{display:flex;justify-content:space-between;align-items:center;}
.pact-name{font-weight:700;color:var(--navy);font-size:13.5px;}
.pact-rate{font-size:11px;color:var(--pine);font-variant-numeric:tabular-nums;}
.pact.dis .pact-rate{color:var(--seal);}
.pact-desc{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5;}
.pact-cost{font-size:10.5px;color:var(--ink-3);margin-top:4px;}
.person-close{padding:0 14px 16px;}
.good-text{color:var(--pine);}
.bad-text{color:var(--seal);}

/* ---------- 风闻 · 邸报 ---------- */
.rumor-list{display:flex;flex-direction:column;gap:9px;}
.rumor-row{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.5;}
.rumor-tag{flex:none;font-size:10.5px;border:1px solid;border-radius:5px;padding:1px 6px;margin-top:1px;font-weight:600;letter-spacing:1px;background:var(--paper-2);}
.rumor-tag.insider{color:var(--gold)!important;border-color:var(--gold)!important;background:var(--gold-soft);}
.rumor-text{color:var(--ink-2);flex:1;min-width:0;}
.rumor-when{flex:none;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;margin-top:1px;}

/* ---------- 干部履历表 ---------- */
.dq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.dq-cell{background:var(--paper-2);padding:10px 8px;text-align:center;}
.dq-cell .k{font-size:10.5px;color:var(--ink-3);}
.dq-cell .v{font-size:14px;font-weight:600;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums;}
@media (max-width:480px){.dq-grid{grid-template-columns:repeat(2,1fr);}}
/* ---------- 覆盖：项目四个操作按钮改为换行布局 ---------- */
.pj-btns{display:flex;gap:6px;flex-wrap:wrap;}
.pjb{flex:1 1 calc(25% - 5px);min-width:64px;}

/* ============================================================
   新增：全屏视图层（会议 / 预算 / 排名 / 档案 / 视察）
   ============================================================ */
.screen{position:fixed; inset:0; z-index:70; background:var(--paper); overflow-y:auto; overflow-x:hidden; animation:fade .18s;}
.screen-in{max-width:1080px; margin:0 auto; padding:0 16px 46px;}
.screen-top{position:sticky; top:0; z-index:6; background:linear-gradient(180deg,var(--navy),#2C4056); color:#EDE7D8;
  padding:11px 16px; display:flex; align-items:center; gap:12px; border-bottom:3px solid var(--seal); box-shadow:0 2px 14px -8px rgba(20,28,38,.6);}
.screen-top .st-t{font-family:"Noto Serif SC",serif; font-weight:700; font-size:17px; letter-spacing:1.5px; color:#F6F1E4;}
.screen-top .st-s{font-size:11.5px; color:#B9C2CC;}
.screen-top .spacer{flex:1;}
.screen-body{padding-top:16px; display:flex; flex-direction:column; gap:14px;}

/* 步骤条 */
.steps{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.step{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3);}
.step i{width:19px; height:19px; border-radius:50%; display:grid; place-items:center; font-style:normal;
  font-size:10.5px; border:1px solid var(--line-2); background:var(--paper-2); color:var(--ink-3); font-variant-numeric:tabular-nums;}
.step.done i{background:var(--pine); border-color:var(--pine); color:#fff;}
.step.now i{background:var(--seal); border-color:var(--seal); color:#fff;}
.step.now{color:var(--seal); font-weight:600;}
.step-sep{color:var(--line-2); font-size:10px;}

/* 会议：议题卡 */
.agenda{border:1px solid var(--line); border-radius:11px; background:var(--paper-2); overflow:hidden;}
.agenda-h{padding:11px 15px; background:linear-gradient(180deg,#FDFBF5,#F5F0E3); border-bottom:1px solid var(--line);}
.agenda-h .no{font-size:10.5px; letter-spacing:2px; color:var(--seal); font-weight:600;}
.agenda-h h3{margin:3px 0 0; font-family:"Noto Serif SC",serif; font-size:16.5px; color:var(--navy); letter-spacing:.5px;}
.agenda-h .meta{font-size:11.5px; color:var(--ink-3); margin-top:3px;}
.agenda-b{padding:14px 15px;}
.stake{font-size:12.5px; color:var(--ink-2); background:var(--paper); border-left:3px solid var(--gold);
  border-radius:0 8px 8px 0; padding:8px 11px; margin-bottom:12px;}
.stake b{color:var(--gold);}

/* 与会者 */
.attend{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:8px;}
.att{border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--paper-2); position:relative;}
.att.lobbied{border-color:var(--pine); background:var(--pine-soft);}
.att.against{border-color:var(--seal); background:var(--seal-soft);}
.att-name{font-weight:700; color:var(--navy); font-size:13px;}
.att-role{font-size:10.5px; color:var(--ink-3); margin-top:1px;}
.att-st{font-size:11px; margin-top:5px; display:flex; align-items:center; gap:5px;}
.att-st .dot2{width:7px; height:7px; border-radius:50%; flex:none;}
.att-why{font-size:10.5px; color:var(--ink-3); margin-top:3px; line-height:1.45;}

/* 表决条 */
.vote{display:flex; height:11px; border-radius:6px; overflow:hidden; border:1px solid var(--line); margin:10px 0 6px;}
.vote i{display:block; height:100%;}
.vote-legend{display:flex; gap:14px; font-size:11.5px; color:var(--ink-2); flex-wrap:wrap;}
.vote-legend span{display:flex; align-items:center; gap:5px;}
.vote-legend .sw{width:9px; height:9px; border-radius:3px;}

/* 预算分配 */
.bud-head{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.bud-head .bh{background:var(--paper-2); padding:11px 8px; text-align:center;}
.bud-head .bh .k{font-size:10.5px; color:var(--ink-3);}
.bud-head .bh .v{font-size:17px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; margin-top:2px;}
.bud-head .bh .v.warn{color:var(--seal);} .bud-head .bh .v.ok{color:var(--pine);}
.bud-list{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
.bud-row{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--paper-2);}
.bud-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.bud-n{font-weight:700; color:var(--navy); font-size:13.5px; min-width:76px;}
.bud-d{font-size:11px; color:var(--ink-3); flex:1; min-width:120px;}
.bud-ctrl{display:flex; align-items:center; gap:6px;}
.bud-ctrl button{width:28px; height:28px; border-radius:7px; border:1px solid var(--line-2); background:var(--paper-2);
  font-size:15px; line-height:1; color:var(--navy); display:grid; place-items:center; padding:0;}
.bud-ctrl button:hover{background:var(--navy-soft);}
.bud-ctrl button:disabled{opacity:.35; cursor:not-allowed;}
.bud-amt{font-variant-numeric:tabular-nums; font-weight:700; color:var(--navy); font-size:14px; min-width:74px; text-align:right;}
.bud-bar{height:8px; border-radius:5px; background:var(--paper-3); overflow:hidden; margin-top:8px; border:1px solid var(--line);}
.bud-bar i{display:block; height:100%;}
.bud-fx{font-size:11px; color:var(--ink-2); margin-top:6px;}
.bud-fx b{color:var(--pine);}
.bud-fx b.neg{color:var(--seal);}

/* 排名榜 */
.rank-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:11px; background:var(--paper-2);}
table.rank{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px;}
table.rank th{background:var(--paper-3); color:var(--ink-2); font-weight:600; font-size:11.5px; padding:9px 10px;
  text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0;}
table.rank td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.rank tr.me{background:var(--seal-soft);}
table.rank tr.me td{font-weight:600;}
table.rank tr:last-child td{border-bottom:none;}
.rk-no{font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink-2); width:38px;}
.rk-no.top{color:var(--seal);}
.rk-name{font-weight:600; color:var(--navy); white-space:nowrap;}
.rk-chief{font-size:11px; color:var(--ink-3);}
.rk-score{font-variant-numeric:tabular-nums; font-weight:700; color:var(--navy);}
.rk-chg{font-size:11px; font-variant-numeric:tabular-nums; width:52px;}
.rk-chg.up{color:var(--pine);} .rk-chg.down{color:var(--seal);} .rk-chg.flat{color:var(--ink-3);}
.rk-mini{display:flex; gap:3px; align-items:flex-end; height:20px;}
.rk-mini i{width:5px; border-radius:2px; display:block; background:var(--navy); opacity:.75;}
.rk-btn{font-size:11px; padding:4px 9px; border-radius:6px; border:1px solid var(--line-2); background:var(--paper-2); color:var(--navy);}
.dim-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-top:10px;}

/* 标签页 */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap;}
.tab{padding:9px 15px; font-size:13px; border:none; background:transparent; color:var(--ink-2);
  border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:8px 8px 0 0;}
.tab.on{color:var(--seal); border-bottom-color:var(--seal); font-weight:600; background:var(--seal-soft);}
.tab:hover{background:var(--paper-3);}

/* 人物档案 */
.dossier-h{display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
.avatar{width:56px; height:56px; border-radius:12px; flex:none; display:grid; place-items:center;
  font-family:"Noto Serif SC",serif; font-size:22px; font-weight:700; color:#F4EEDD;
  background:linear-gradient(150deg,#3B5470,#26384B); border:1px solid var(--navy);}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.kv .c{background:var(--paper-2); padding:9px 10px;}
.kv .c .k{font-size:10.5px; color:var(--ink-3);}
.kv .c .v{font-size:13px; font-weight:600; color:var(--navy); margin-top:2px;}

/* 通用小节 */
.sec-t{font-family:"Noto Serif SC",serif; font-size:14.5px; font-weight:700; color:var(--navy);
  letter-spacing:1px; margin:0 0 9px; display:flex; align-items:center; gap:8px;}
.sec-t::before{content:""; width:3px; height:15px; background:var(--seal); border-radius:2px; flex:none;}
.pill{font-size:10.5px; padding:2px 9px; border-radius:20px; background:var(--paper-3); color:var(--ink-2); font-weight:400;}
.pill.g{background:var(--pine-soft); color:var(--pine);}
.pill.b{background:var(--seal-soft); color:var(--seal);}
.pill.y{background:var(--gold-soft); color:var(--gold);}

/* 结果卡 */
.result{border:1px solid var(--line); border-radius:11px; background:var(--paper-2); padding:15px;}
.result .rt{font-family:"Noto Serif SC",serif; font-size:18px; font-weight:700; margin-bottom:6px;}
.result .rt.ok{color:var(--pine);} .result .rt.no{color:var(--seal);}
.fxline{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.fxc{font-size:11.5px; padding:4px 10px; border-radius:20px; background:var(--paper-3); color:var(--ink-2); font-variant-numeric:tabular-nums;}
.fxc.up{background:var(--pine-soft); color:var(--pine);}
.fxc.dn{background:var(--seal-soft); color:var(--seal);}

/* 事件选项带代价预览 */
.cost-preview{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.cp{font-size:10.5px; padding:2px 8px; border-radius:20px; background:var(--paper-3); color:var(--ink-2); font-variant-numeric:tabular-nums;}
.cp.up{background:var(--pine-soft); color:var(--pine);}
.cp.dn{background:var(--seal-soft); color:var(--seal);}

/* 顶部导航（主界面） */
.navbar{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:2px;}
.navbar .nb{flex:1; min-width:112px; border:1px solid var(--line); background:var(--paper-2); border-radius:10px;
  padding:10px 11px; text-align:left; transition:.15s; position:relative;}
.navbar .nb:hover{border-color:var(--navy); transform:translateY(-2px); box-shadow:var(--shadow);}
.navbar .nb .nbt{font-size:13px; font-weight:600; color:var(--navy); display:flex; align-items:center; gap:7px;}
.navbar .nb .nbd{font-size:10.5px; color:var(--ink-3); margin-top:3px;}
.navbar .nb .badge{position:absolute; top:-6px; right:-6px; background:var(--seal); color:#fff; font-size:10px;
  min-width:18px; height:18px; border-radius:9px; display:grid; place-items:center; padding:0 5px; font-variant-numeric:tabular-nums;}
.navbar .nb.hot{border-color:var(--seal);}

/* 属性说明 */
.stat{cursor:help;}
.stat-help{font-size:11px; color:var(--ink-3); line-height:1.55;}

/* 世界动态时间线 */
.wt{display:flex; flex-direction:column; gap:9px;}
.wt-row{display:flex; gap:9px; font-size:12.5px;}
.wt-y{flex:none; width:54px; color:var(--ink-3); font-variant-numeric:tabular-nums;}

/* 空态 */
.empty{border:1px dashed var(--line-2); border-radius:10px; padding:20px 14px; text-align:center;
  color:var(--ink-3); font-size:12.5px; background:var(--paper);}

@media (max-width:960px){
  .screen-in{padding:0 11px 40px;}
  .bud-head{grid-template-columns:repeat(2,1fr);}
  .navbar .nb{min-width:calc(50% - 4px); flex:0 0 calc(50% - 4px);}
}
@media (max-width:480px){
  .attend{grid-template-columns:1fr;}
  .kv{grid-template-columns:repeat(2,1fr);}
  .navbar .nb{min-width:100%; flex:0 0 100%;}
  .screen-top .st-t{font-size:15px;}
  .agenda-h h3{font-size:15px;}
  .bud-ctrl button{width:32px; height:32px;}
}

/* ============================================================
   追加样式块（由 join.py 注入到 <style> 末尾）
   只放 _p1.txt 里还没有的规则，避免重复。
   ============================================================ */

/* ---------- 月度变化箭头 ---------- */
.dlt{font-size:10px;font-variant-numeric:tabular-nums;margin-left:4px;}
.dlt.up{color:var(--pine);} .dlt.dn{color:var(--seal);} .dlt.bad{color:var(--seal);} .dlt.good{color:var(--pine);}
.delta-note{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.55;}

/* ---------- 排名表：GDP / 人口 列 ---------- */
.rk-gdp,.rk-pop{font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap;}
.rk-gdp{width:86px;} .rk-pop{width:74px;}

/* ---------- 全国地图 ---------- */
.map-wrap{position:relative; border:1px solid var(--line); border-radius:12px; background:linear-gradient(180deg,#F7F5EE,#EFEBE0); padding:6px;}
.map-svg{display:block; width:100%; height:auto;}
.mp-reg{cursor:pointer; transition:opacity .15s;}
.mp-reg:hover{opacity:.86;}
.mp-name{font-family:"Noto Serif SC",serif; font-size:13px; font-weight:700; fill:#27384B; pointer-events:none;}
.mp-name.sm{font-size:11.5px;}
.mp-cap{font-size:10px; fill:#8C8F93; pointer-events:none;}
.mp-here-lbl{font-size:10px; fill:#B03A2E; font-weight:700; pointer-events:none;}
.mp-star{fill:#B03A2E;}
.mp-diamond{fill:#27384B;}
.mp-here-ring{fill:none; stroke:#B03A2E; stroke-width:2; opacity:.85;}
.mp-here-dot{fill:#B03A2E; stroke:#FDFBF5; stroke-width:1.4;}
@keyframes mpPulse{0%{r:5;opacity:.55;}70%{r:12;opacity:0;}100%{r:12;opacity:0;}}
.mp-pulse{fill:#B03A2E; animation:mpPulse 2.2s ease-out infinite;}
.map-legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--ink-2); margin-top:8px;}
.map-legend i{display:inline-block; width:9px; height:9px; margin-right:5px; vertical-align:middle;}
.map-note{font-size:11px; color:var(--ink-3); margin-top:6px; line-height:1.6;}
.mp-info{margin-top:14px;}
.mp-kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:10px; margin-top:10px;}
.mp-kv .cell{border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--paper-2);}
.mp-kv .k{font-size:10.5px; color:var(--ink-3);}
.mp-kv .v{font-size:15px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; margin-top:2px;}
.mp-kv .v small{font-size:11px; font-weight:500; color:var(--ink-3); margin-left:3px;}
.mp-pick{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.mp-pick button{font-size:12px; padding:6px 11px; border:1px solid var(--line); background:var(--paper-2);

/* ---------- 出生地的城市 / 县区 / 乡镇 名称生成 ----------
   江澜省沿用固定数据（保持与既有榜单、经济数据一致）；
   其余省份按固定种子程序化生成，使每一局的属地名称都真实可读。
   规则：修饰字 + 名词字，两字不重复；并回避少量现实重名。 */
var _CITY_P="临河明青雁江梧白云新双平东梅石和台川泽海岭源泰昌兴金龙".split("");
var _CITY_N=["川","阳","州","城","山","江","陵","丰","中","海","安","宁","兴","平","德","华","原","泉","关","溪","洲"];
var _CNTY_P="青临白和东梅石云南双平新大长高金龙凤兴沙桥岭台屏顺溪湾浦塘柳枫".split("");
var _CNTY_N=["溪","江","水","岭","鼓","台","屏","桥","安","河","山","川","原","阳","城","林","泉","湖","海","岗","坡","坪","畈","集","铺","洲","潭","塘","沟","源"];
var _TOWN_P=["云栖","溪桥","石岗","岭坪","沙塘","埠湾","浦垭","梁坡","驿屯","堡子","青溪","白岩","双河","长塘","老屋","新桥","杨树","柳林","板桥","竹林","枫树","桃坪","三里","四坪"];
var _TOWN_N=["镇","镇","镇","镇","乡"];
/* 回避与现实重名的常用地名（避免玩家出戏） */
var _NAME_BLOCK={"南宁市":1,"南昌市":1,"南海市":1,"中山市":1,"北海市":1,"东兴市":1,"平安县":1,"临江县":1,"青溪县":1,"白水县":1,"和顺县":1,"云台县":1,"双桥区":1};
function genLocalNames(k){
  if(k==="jianglan")return {city:"临川市",county:"青溪县",town:"云栖镇"};
  var cap="";
  if(typeof regionByKey==="function"){var p=regionByKey(k);if(p)cap=p.cap;}
  var rr=new RNG((strHash("home:"+k)^0x9E3779B9)>>>0);
  function pairName(P,N){
    for(var t=0;t<40;t++){
      var a=rr.pick(P),b=rr.pick(N);
      if(a!==b)return a+b;
    }
    return rr.pick(P)+rr.pick(N);
  }
  var used={};used[cap]=1;
  function gen(n,suf){
    var out=[],t=0;
    while(out.length<n&&t<n*80){
      t++;
      var nm=pairName(suf==="市"?_CITY_P:_CNTY_P,suf==="市"?_CITY_N:_CNTY_N)+suf;
      if(used[nm]||_NAME_BLOCK[nm]||out.indexOf(nm)>=0)continue;
      out.push(nm);used[nm]=1;
    }
    var i=1;
    while(out.length<n){var f=pairName(_CNTY_P,_CNTY_N)+suf+i;i++;if(used[f])continue;out.push(f);used[f]=1;}
    return out;
  }
  var cities=gen(11,"市");
  var counties=gen(12,"县");
  /* 一部分县改为「区」，贴近真实建制 */
  for(var i=0;i<counties.length;i++){
    if(rr.chance(0.18)){var base=counties[i].replace(/县$/,"区");if(!used[base]){delete used[counties[i]];counties[i]=base;used[base]=1;}}
  }
  var town=pairName(_TOWN_P,_TOWN_N);
  return {city:rr.pick(cities),county:rr.pick(counties),town:town,
    cities:cities,counties:counties};
}
/* 出生地的县区 / 地市经济数据：
   江澜省沿用固定数据；其余省份按固定种子把省级 GDP/人口分摊到 11 市、再分摊到 12 县区，
   保证「12 县区合计 = 本市」「11 地市合计 = 本省」的自洽关系在任意出生地下都成立。 */
function genLocalEcon(k){
  if(k==="jianglan"){
    return {
      cities:CITY_LIST.map(function(nm){var e=CITY_ECON[nm]||{};return {n:nm,gdp:e.gdp||0,pop:e.pop||0};}),
      counties:COUNTY_LIST.map(function(nm){var e=COUNTY_ECON[nm]||{};return {n:nm,gdp:e.gdp||0,pop:e.pop||0};})
    };
  }
  var p=(typeof regionByKey==="function")?regionByKey(k):null;
  var totG=p?p.gdp:38200, totP=p?p.pop:4210;
  var rr=new RNG((strHash("econ:"+k)^0x85EBCA6B)>>>0);
  function spread(total,n,lo,hi){
    var w=[],s=0,i;
    for(i=0;i<n;i++){var x=lo+rr.next()*(hi-lo);w.push(x);s+=x;}
    var out=[],acc=0;
    for(i=0;i<n;i++){
      var v=(i===n-1)?Math.round((total-acc)*10)/10:Math.round(total*w[i]/s*10)/10;
      acc+=v;out.push(v);
    }
    return out;
  }
  var names=genLocalNames(k);
  var g=spread(totG,11,0.55,1.45), pp=spread(totP,11,0.55,1.45);
  var cities=names.cities.map(function(nm,i){return {n:nm,gdp:g[i],pop:pp[i]};});
  return {cities:cities,counties:names.counties};
}
/* 某市下辖 12 个县区的经济数据（按该市 GDP 分摊） */
function spreadCounties(cityName,cityGdp,cityPop,k){
  var rr=new RNG((strHash("cnty:"+k+":"+cityName)^0xC2B2AE35)>>>0);
  var names=genLocalNames(k).counties;
  function sp(total,lo,hi){
    var w=[],s=0,i;
    for(i=0;i<12;i++){var x=lo+rr.next()*(hi-lo);w.push(x);s+=x;}
    var out=[],acc=0;
    for(i=0;i<12;i++){
      var v=(i===11)?Math.round((total-acc)*10)/10:Math.round(total*w[i]/s*10)/10;
      acc+=v;out.push(v);
    }
    return out;
  }
  var g=sp(cityGdp,0.5,1.5),pp=sp(cityPop,0.5,1.5);
  return names.map(function(nm,i){return {n:nm,gdp:g[i],pop:pp[i]};});
}
/* 把出生地写进世界观：省份 / 城市 / 县 / 乡镇 全部就位，并重算职务单位名 */
function applyHome(homeKey){
  var reg=(typeof regionByKey==="function")?regionByKey(homeKey):null;
  var names=genLocalNames(homeKey);
  WORLD.home=homeKey;
  WORLD.province=reg?reg.n:"江澜省";
  WORLD.provCap=reg?reg.cap:"江阳市";
  WORLD.city=names.city;
  WORLD.county=names.county;
  WORLD.town=names.town;
  rebuildPlaces();
  return homeRegion(homeKey);
}

/* 把固定人名预先占位，保证随机生成器不会再造出同名的路人 */

/* 按现有世界里的人名重建去重表（读档后调用，避免后续新生 NPC 与旧人重名） */
function rebuildUsedNames(){
  _usedNames={};
  if(typeof G!=="undefined"&&G&&G.world&&G.world.npcs){
    G.world.npcs.forEach(function(n){if(n&&n.name)_usedNames[n.name]=1;});
  }

function worldName(r){
  var n,t=0;
  do{
    var s=r.chance(.04)?r.pick(SURNAMES2):r.pick(SURNAMES);
    var g,fem=r.chance(.26);
    var roll=r.next();
    if(roll<0.16){g=r.pick(GIVEN_S2);}
    else if(roll<0.24){g=r.pick(GIVEN_S2)+r.pick(GIVEN_S2);}
    else{g=r.pick(fem?GIVEN_F:GIVEN_M);}
    n=s+g;t++;
  }while(_usedNames[n]&&t<60);
  _usedNames[n]=1;return n;
}
function goalFor(age){return age>=56?"平安到站":age>=48?"再进一步、稳妥落地":"更上一层";}

/* 人物档案：一个完整的人，而不是一个名字 */
function makePerson(r,opt){
  var gender=opt.gender||(r.chance(.78)?"男":"女");
  var trait=opt.trait||r.pick(TRAITS),prof=traitProfile(trait);
  var senior=/书记|县长|市长|省长|人大|政协|主任|常委|主席|总理|部长|委员长|国务|秘书长|委员/.test(opt.title||"");
  /* 年龄按层级分档，越往上越年长，贴近现实 */
  var t0=opt.tier||"county";
  var age=opt.age!==undefined?opt.age:
    (t0==="state"?r.range(57,67):
     t0==="nation"?r.range(52,62):
     t0==="prov"?r.range(49,59):
     t0==="city"?r.range(44,55):
     senior?r.range(41,53):r.range(27,50));
  var probity=clamp(r.range(32,93)/100+(trait==="爱惜羽毛"?0.14:0)+(trait==="谨小慎微"?0.10:0)
    -(trait==="敢闯敢干"?0.10:0)-(trait==="锋芒毕露"?0.08:0),0.08,0.98);
  var risk=clamp(Math.round((1-probity)*72+prof.risk*24+r.range(-9,9)),2,98);
  var level=opt.level!==undefined?opt.level:TIER_LEVEL[opt.tier||"county"];
  return {
    id:opt.id, name:opt.name||worldName(r), gender:gender, age:age,
    tier:opt.tier||"county", level:level, title:opt.title||"干部", place:opt.place||"",
    trait:trait, persona:prof, probity:probity, risk:risk,
    health:clamp(r.range(58,96)-(age>52?r.range(0,10):0),20,100),
    bg:opt.bg||r.pick(BG_LIST), home:opt.home||r.pick(HOMES), edu:opt.edu||r.pick(EDU),
    goal:goalFor(age), status:"active", alive:true, close:!!opt.close,
    terms:[{y:1,title:opt.title||"干部"}], mem:[], note:"",
    toneBias:clamp((prof.amb-0.5)*2+(prof.risk-0.4)*0.8,-1,1),
    follow:false, lobbied:false
  };
}

/* 与玩家的多维关系 */
function blankRel(){return {like:0,fear:0,trust:30,favor:0,known:0};}
function getRel(id){
  if(!G.rel)G.rel={};
  if(!G.rel[id]){
    var n=findNpc(id),b=blankRel();
    if(n){
      if(n.closeTag==="boss"){b.trust=38;b.like=6;}
      else if(n.closeTag==="disc"){b.trust=22;b.like=-10;}
      else if(n.closeTag==="rival"){b.like=-22;b.trust=16;}
      else if(n.closeTag==="peer"){b.like=8;b.trust=32;}
    }
    G.rel[id]=b;
  }
  return G.rel[id];
}
function initRelations(){
  G.rel={};
  G.world.npcs.filter(function(n){return n.close;}).forEach(function(n){getRel(n.id);});
}
function remember(n,text,cls){
  if(!n)return;
  if(!n.mem)n.mem=[];
  n.mem.push({text:text,year:G.year,month:G.month,cls:cls||""});
  if(n.mem.length>14)n.mem.shift();
}
function findNpc(id){return G.world.npcs.filter(function(x){return x.id===id;})[0];}
function relSum(r){return r.like*0.4+r.trust*0.4+r.favor*8-r.fear*0.2;}

/* GDP / 人口 显示格式 */
function fmtGdp(v){                       /* v: 亿元 */
  if(v==null)return "—";
  if(v>=10000)return (v/10000).toFixed(2)+"万亿";
  if(v>=1000) return (v/1000).toFixed(2)+"千亿";
  return (v>=100?Math.round(v):v.toFixed(1))+"亿";
}
function fmtPop(v){                       /* v: 万人 */
  if(v==null)return "—";
  if(v>=10000)return (v/10000).toFixed(2)+"亿";
  return (v>=100?Math.round(v):v.toFixed(1))+"万";
}
/* 全国总量（基准值：由省份初始数据汇总，用于初始化榜单） */

/* 当前（逐年演进后）的省级 GDP / 人口。
   优先取省级榜上的值，保证「全国地图」与「城市排名」两页口径一致；
   榜单尚未建立时退回基准值。 */
function regionEconEntry(k){
  var p=regionByKey(k); if(!p)return null;
  if(typeof G!=="undefined"&&G&&G.juris&&G.juris.prov&&G.juris.prov.list){
    var e=G.juris.prov.list.filter(function(x){return x.name===p.n;})[0];
    if(e&&typeof e.gdp==="number")return e;
  }
  return null;
}
function regionGdp(k){
  var e=regionEconEntry(k); if(e)return e.gdp;
  var p=regionByKey(k); return p?p.gdp:0;
}
function regionPop(k){
  var e=regionEconEntry(k); if(e)return e.pop;
  var p=regionByKey(k); return p?p.pop:0;
}
/* 全国总量（当前值：优先读省级榜的「全国」行，否则汇总各省） */

  }
  var s=0;MAP_REGIONS.forEach(function(x){s+=regionGdp(x.k);});

}

/* ---------- 地图几何：按固定种子把布局框抖成有机轮廓 ----------
   用「超椭圆（圆角矩形）× 半径抖动」参数化采样，保证：
   ① 形状光滑无尖刺；② 最大半径 0.94×1.06 < 1，绝不越出布局框 → 相邻区域不会互相粘连 */
function _geoPoly(x0,y0,x1,y1,seed){
  var r=new RNG(seed);
  var cx=(x0+x1)/2, cy=(y0+y1)/2;
  var rx=(x1-x0)/2*0.94, ry=(y1-y0)/2*0.94;
  var N=18, K=2.7, pts=[];
  for(var i=0;i<N;i++){
    var a=i/N*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
    /* 超椭圆参数化：K 越大越接近矩形，越小越接近椭圆 */
    var u=(ca<0?-1:1)*Math.pow(Math.abs(ca),2/K);
    var v=(sa<0?-1:1)*Math.pow(Math.abs(sa),2/K);
    var j=1+r.range(-6,6)/100;
    pts.push([Math.round(cx+u*rx*j), Math.round(cy+v*ry*j)]);
  }
  return pts;
}
/* 用「过中点的二次曲线」把折线抹圆，得到有机边界 */
function _geoPath(pts){
  var n=pts.length,d="";
  for(var i=0;i<n;i++){
    var p1=pts[i],p2=pts[(i+1)%n];
    var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
    if(i===0)d+="M"+mx.toFixed(1)+","+my.toFixed(1);
    d+="Q"+p1[0]+","+p1[1]+" "+mx.toFixed(1)+","+my.toFixed(1);
  }
  return d+"Z";
}
function _geoCentroid(pts){
  var x=0,y=0;pts.forEach(function(p){x+=p[0];y+=p[1];});
  return [x/pts.length,y/pts.length];
}
/* 预计算：每个区域的轮廓、路径、中心点（世界地图每局相同） */
var GEO_SHAPES={};
MAP_REGIONS.forEach(function(p,i){
  var pts=_geoPoly(p.x0,p.y0,p.x1,p.y1,9173+i*613);
  GEO_SHAPES[p.k]={pts:pts,d:_geoPath(pts),c:_geoCentroid(pts)};
});

  return 0;
}

function triggerFestival(){
  if(!G||G.ended||G.screen)return;
  var fest=FESTIVALS[G.month];
  if(!fest)return;
  /* 同年同月不重复触发；开局首月也照常触发，给玩家一点节日氛围 */
  if(G.flags.festDone===monthSeq())return;
  G.flags.festDone=monthSeq();
  var ev=fest.ev;ev._after=null;ev._fromAction=false;
  G.queue.push({event:ev});
}

function baseStats(){
  return {health:72,integrity:68,competence:50,achievement:34,trust:50,popularity:45,peers:50,family:56};

function baseLocal(){
  var b={economy:48,finance:46,debt:22,livelihood:46,environment:44,safety:50,petition:22,sentiment:16};
  /* 出生地修正：富庶地区底盘高但抬升空间小，欠发达地区底盘低但改善更显眼 */
  var h=(typeof G!=="undefined"&&G&&G.home)?homeRegion(G.home):null;
  if(h&&h.base)Object.keys(h.base).forEach(function(k){
    if(k in b)b[k]=clamp(b[k]+h.base[k],4,92);
  });
  return b;
}
function baseHidden(){return {discipline:10,audit:10};}

/* ---------- 风险底盘：廉洁决定下限，级别决定被盯的强度 ---------- */
function riskFloorD(){
  var gap=BAL.cleanThreshold-G.stats.integrity;
  return clamp(gap*BAL.riskFloorK,0,95);
}
function riskFloorA(){
  return clamp(riskFloorD()*0.8+G.rank*BAL.riskAuditRank,0,95);
}
/* 属性增益递减：越接近满分越难涨。只作用于"可积累"的能力类属性，
   廉洁与健康不适用——廉洁是道德底线（一次越线就是越线），健康是身体本钱。 */
var GAIN_SCALED={competence:1,achievement:1,popularity:1,peers:1,trust:1,family:1};
function gainScale(v){return clamp(1-v/BAL.gainSoftCap,0.05,1);}

/* ---------- 日程（4 周 × 上午/下午/晚上） ---------- */
var SLOT_PART=["上午","下午","晚上"];
function initSched(){G.sched={cur:0,cells:[]};for(var i=0;i<12;i++)G.sched.cells.push(null);}
function curPart(){return G.sched.cur%3;}
function slotLabel(idx){return "第"+(Math.floor(idx/3)+1)+"周·"+SLOT_PART[idx%3];}
function curTimeType(){return curPart()===2?"night":"day";}

function canDo(a){
  if(a.time==="day"&&curTimeType()!=="day")return false;
  if(a.time==="night"&&curTimeType()!=="night")return false;
  if(a.cost<0)return G.energy<98;
  return G.energy>=a.cost;
}
function perform(key){
  if(!G||G.ended||G.queue.length||G.screen)return;
  var a=ACTIONS.filter(function(x){return x.key===key;})[0];
  if(!a)return;
  if(!canDo(a)){if(a.cost<0)toast("精力已经很足了");else toast("精力不够，等晚上休息回回血");return;}
  if(a.open==="meeting"){openMeetingPicker();return;}
  var r=new RNG(G.seed+G.year*131+G.month*17+G.sched.cur*29+key.length);
  if(key==="invest"&&G.energy>=a.cost&&r.chance(0.34)){
    G.energy=clamp(G.energy-a.cost,0,100);
    G.sched.cells[G.sched.cur]={key:a.key,name:a.name};
    pushLog(slotLabel(G.sched.cur)+"·"+a.name+"（转入项目谈判）");
    openFlow("nego",true);return;
  }
  G.energy=clamp(G.energy-a.cost,0,100);
  if(a.hp)G.stats.health=clamp(G.stats.health+a.hp,0,100);
  if(key==="overtime"||key==="banquet")G.monthHeavy=(G.monthHeavy||0)+1;
  if(a.peersFx)G.stats.peers=clamp(G.stats.peers+a.peersFx,0,100);
  applyFx(a.fx,r);
  if(key==="inspect"){
    /* 留痕查账能压风险，但压不到"廉洁底盘"之下——当初干下的事，查几次账也抹不掉 */
    G.hidden.discipline=Math.max(riskFloorD(),G.hidden.discipline);
    G.hidden.audit=Math.max(riskFloorA(),G.hidden.audit);
    tryRemediate(r);
  }
  if(key==="banquet"||key==="coordinate"||key==="visit")maybeInsiderRumor(key);
  if(key==="reportup"&&r.chance(.35))pushRumor("insider","有人看见你最近常去主要领导办公室，机关里议论了几句。",1,[]);
  G.sched.cells[G.sched.cur]={key:a.key,name:a.name};
  pushLog(slotLabel(G.sched.cur)+"·"+a.name);
  if(a.may&&r.chance(0.5)){
    var ev=pickEvent(a.may,r);
    if(ev){openEvent(ev,false,true);save();render();return;}
  }
  if(G.energy<=0&&curPart()<2)toast("白天精力已耗尽，盼着晚上休息");
  advanceSlot();
}
function advanceSlot(){
  G.sched.cur++;
  if(G.sched.cur>=12){advanceMonth();return;}
  maybeSlotEvent();
  save();render();
}
function maybeSlotEvent(){
  if(curPart()===2)return;
  var risk=(G.hidden.discipline+G.hidden.audit)/2;
  var r=new RNG(G.seed+G.year*53+G.sched.cur*19+11);
  var ev=null;
  if(risk>52&&r.chance(clamp((risk-45)/110,0,.42))){ev=EVENTS.filter(function(e){return e.riskOnly;})[0];}
  else if(r.chance(.22)){ev=pickEvent(null,r);}
  if(ev)openEvent(ev,false,false,true);
}
function askEndMonth(){
  if(!G||G.ended||G.queue.length||G.screen)return;
  var remain=0;
  for(var i=G.sched.cur;i<12;i++){if(i%3!==2)remain++;}
  if(remain===0){advanceMonth();return;}
  G.queue.push({endMonthConfirm:true,remain:remain});
  save();render();
}
function confirmEndMonth(yes){
  G.queue.shift();
  if(yes){advanceMonth();}else{save();render();}
}

/* ---------- 属性结算 ---------- */
function isNegKey(k){
  if(k==="discipline"||k==="audit")return true;
  return ["debt","petition","sentiment"].indexOf(k)>=0;
}
/* ---------- 职责系统：主责维度 = 该职务的主要考核方向 ---------- */
function focusOf(){return (typeof roleFocus==="function"&&G)?roleFocus(G.rank):[];}
function isFocusKey(k){return focusOf().indexOf(k)>=0;}
function applyFx(fx,r){
  if(!fx)return;
  var focus=focusOf();
  Object.keys(fx).forEach(function(k){
    var v=fx[k],d=Array.isArray(v)?r.range(v[0],v[1]):v;
    if(d===0)return;
    if(k==="energy"){G.energy=clamp(G.energy+d,0,100);return;}
    /* 主责方向：你的本职，做事更有效（只放大正向收益，不放大代价） */
    if(d>0&&focus.indexOf(k)>=0)d=d*BAL.focusGain;
    /* 出生地回报倍率：越是欠发达地区，同样的改观越"显眼"（政绩回报更高） */
    if(d>0&&k==="achievement"&&typeof homeAchMul==="function")d=d*homeAchMul();
    /* 正向增益按当前值递减：属性越高越难再涨，防止几十年后全线顶满 */
    if(k in G.stats){
      if(d>0&&GAIN_SCALED[k])d=d*gainScale(G.stats[k]);
      G.stats[k]=clamp(G.stats[k]+d,0,100);return;
    }
    if(k in G.local){G.local[k]=clamp(G.local[k]+d,0,100);return;}
    if(k in G.hidden){G.hidden[k]=clamp(G.hidden[k]+d,0,100);return;}
  });
}
function fxPreview(fx,r){
  if(!fx)return "";
  return Object.keys(fx).map(function(k){
    var v=fx[k],lo=Array.isArray(v)?v[0]:v,hi=Array.isArray(v)?v[1]:v;
    var mid=(lo+hi)/2,d=Math.abs(mid)<0.5?0:Math.round(mid);
    if(d===0)return "";
    var name=statName(k),neg=isNegKey(k);
    var good=neg?d<0:(d>0);
    var sign=d>0?"+":"";
    return '<span class="cp '+(good?"up":"dn")+'">'+esc(name)+' '+sign+d+'</span>';
  }).join("");
}
var STAT_NAME={};
function statName(k){
  if(STAT_NAME[k])return STAT_NAME[k];
  var m={};
  BARS.forEach(function(b){m[b.k]=b.l;});
  LOCAL_BARS.forEach(function(b){m[b.k]=b.l;});
  m.discipline="纪委关注";m.audit="审计关注";m.energy="精力";
  STAT_NAME=m;return m[k]||k;
}
function tryRemediate(r){
  var idx=-1;
  for(var i=0;i<G.facts.length;i++){if(G.facts[i].id==="site_risk"||G.facts[i].id==="flood_risk"||G.facts[i].id==="env_debt"){idx=i;break;}}
  if(idx>=0&&r.chance(0.55)){
    var f=G.facts.splice(idx,1)[0];
    f.remediated=true;G.fired.push(f);
    pushLog("自查整改，排除了一处隐患","up");
    G.stats.integrity=clamp(G.stats.integrity+3,0,100);
  }
}

/* ---------- 事件抽取与结算 ---------- */
function pickEvent(may,r){
  var tier=ROLES[G.rank].tier;
  var pool=EVENTS.filter(function(e){
    if(e.tier&&e.tier.indexOf(tier)<0)return false;
    if(e.riskOnly)return false;
    if(may){return e.may===may;}
    if(e.factTrigger)return false;
    return true;
  });
  if(!pool.length)return null;
  /* 已埋过雷或已了结的事件不再重复出现：否则同一事件会被反复抽中、重复埋雷，
     伏笔数量随年份无上限膨胀，最终把年度考核压穿，形成"越玩越必死"的死亡螺旋。 */
  pool=pool.filter(function(e){
    return !G.fired.some(function(f){return f.fromEvent===e.id;})
        && !G.facts.some(function(f){return f.fromEvent===e.id;});
  });
  if(!pool.length)return null;
  return r.pick(pool);
}
function openEvent(ev,afterMonth,fromAction,fromSlot){
  ev._after=afterMonth?"month":null;
  ev._fromAction=!!fromAction;
  ev._fromSlot=!!fromSlot;
  G.queue.push({event:ev});
}
function fillNames(s){
  return (s||"").replace(/\[BOSS\]/g,(G.npc.boss||{}).name||"主要领导")
    .replace(/\[DISC\]/g,(G.npc.disc||{}).name||"纪委同志")
    .replace(/\[RIVAL\]/g,(G.npc.rival||{}).name||"同期干部")
    .replace(/\[PEER\]/g,(G.npc.peers&&G.npc.peers[0]||{}).name||"同事");
}
function choose(ci){
  var head=G.queue[0];if(!head||!head.event)return;
  var ev=head.event,c=ev.choices[ci];if(!c)return;
  var r=new RNG(G.seed+G.year*31+G.month*7+ci*13+ev.id.length);
  if(c.fx)applyFx(c.fx,r);
  if(c.fact){
    var f=c.fact;
    /* 同一类伏笔全局只保留一处：重复踩同一类红线不叠加，只把引信往后推。
       否则 random 打法会累积几十条同类隐患，考核分被 factPenalty 直接压穿。 */
    var exists=G.facts.filter(function(x){return x.id===f.id;})[0];
    if(exists){
      exists.fireYear=Math.max(exists.fireYear,G.year+r.range(1,2));
      pushLog("同类问题又被翻出一次，旧账没结清","warn");
    }else if(!G.fired.some(function(x){return x.id===f.id;})){
      var arm=Array.isArray(f.arm)?r.range(f.arm[0],f.arm[1]):f.arm;
      G.facts.push({id:f.id,title:f.title,detail:f.detail,kind:f.kind,fromEvent:ev.id,
        year:G.year,month:G.month,fireYear:G.year+arm,dormant:0});
      pushLog("埋下伏笔："+f.title,c.fact.kind==="severe"?"warn":"");
    }
  }
  if(c.run){try{c.run();}catch(e){}}
  if(c.to){G.queue=[];resolveSpecial(c.to);return;}
  G.busy=!!c.busy;
  var fromAction=ev._fromAction;
  G.queue.shift();
  if(G.queue.length){save();render();return;}
  if(fromAction){advanceSlot();}
  else if(ev._after==="month"){advanceMonth();}
  else{save();render();}
}

/* ---------- 推进月份 / 年度 ---------- */
function advanceMonth(){
  G.prevSnap={stats:deep(G.stats),local:deep(G.local)};
  G.month++;
  if(G.month>12){G.month=1;G.year++;G.age++;livingTickYear();yearEnd();return;}
  startOfMonth();livingTickMonth();save();render();
}
function startOfMonth(){
  initSched();
  var st=G.stats,lo=G.local;
  G.energy=clamp(Math.round(BAL.energyBase+st.health*BAL.energyPerHealth+(G.energyBonus||0)),0,100);
  G.busy=false;
  var h=st.health;
  if(G.monthHeavy>0){
    var pen=Math.min(G.monthHeavy*BAL.hpPerHeavy,BAL.hpHeavyCap);
    h=clamp(h-(BAL.hpIdlePenalty+pen),0,100);
  }else h=clamp(h+BAL.hpRecoverMonth,0,100);
  st.health=h;G.monthHeavy=0;
  /* 地方态势自然漂移 */
  Object.keys(BAL.drift).forEach(function(k){
    var d=BAL.drift[k];
    if(k==="petition"&&lo.safety>62)d-=0.55;
    if(k==="sentiment"&&st.popularity>62)d-=0.5;
    if(k==="economy"&&lo.finance>65)d+=0.25;
    lo[k]=clamp(lo[k]+d,0,100);
  });
  /* 债务对财政的挤压 */
  if(lo.debt>60){lo.finance=clamp(lo.finance-(lo.debt-60)*0.05,0,100);}
  if(lo.debt>70){G.hidden.audit=clamp(G.hidden.audit+(lo.debt-70)*0.06,0,100);}
  /* 核心值向中位回归：防长期贴边崩盘 */
  Object.keys(BAL.regress).forEach(function(k){
    var mid=BAL.regressMid[k],rate=BAL.regress[k];
    st[k]=clamp(st[k]+(mid-st[k])*rate*BAL.regressRate,0,100);
  });
  /* 风险底盘：廉洁水平决定你被"盯"的下限，位置越高盯得越紧。
     干净的人风险自然消退；不干净的人，查几次账也抹不掉当初干下的事。 */
  var floorD=riskFloorD(), floorA=riskFloorA();
  G.hidden.discipline=clamp(G.hidden.discipline+(floorD-G.hidden.discipline)*BAL.riskDrift,0,100);
  G.hidden.audit=clamp(G.hidden.audit+(floorA-G.hidden.audit)*BAL.riskDrift,0,100);
  /* 家庭长期低位累计 */
  if(st.family<25)G.lowFamilyStreak++;else G.lowFamilyStreak=0;
  /* 提示 */
  if(h<=20)toast("身体严重透支，这个月少安排点事");
  else if(h<=35)toast("身体亮红灯，注意休息");
  else if(lo.petition>=BAL.petitionDanger)toast("信访压力已到危险线，容易出群体性事件");
  else if(lo.debt>=BAL.debtDanger)toast("债务压力过大，上级已经注意到");
  triggerFestival();
  try{triggerPolicy();}catch(e){}
}

/* ---------- 伏笔结算（蝴蝶效应） ---------- */
function resolveFacts(reports){
  var due=G.facts.filter(function(f){return f.fireYear<=G.year;});
  due.forEach(function(f){
    var r=new RNG(G.seed+f.fireYear*101+(f.id||"x").length*13);
    var idx=G.facts.indexOf(f);
    function keepDormant(extra){
      f.dormant=(f.dormant||0)+1;
      /* 旧账沉了太久就真的沉下去：给伏笔一个自然出口，防止无限堆积压穿考核 */
      if(f.dormant>=3&&r.chance(0.45)){reports.push("「"+f.title+"」多年无人提起，慢慢沉了下去。");settleBad();return;}
      f.fireYear+=extra||r.range(1,3);
    }
    function settleBad(){if(idx>=0)G.facts.splice(idx,1);G.fired.push(f);}
    switch(f.id){
      case "site_risk":case "flood_risk":case "grievance":case "env_debt":
        if(r.chance(0.72)){G.queue.push({event:cloneEvent("accident")});reports.push("一处旧隐患最终酿成事故。");settleBad();}
        else{reports.push("提心吊胆的隐患，侥幸没有出事。");keepDormant(1);}
        break;
      case "land_promise":
        G.queue.push({event:cloneEvent("invest_burst")});settleBad();
        break;
      case "bribe":case "kin_business":case "fake_docs":case "conflict":case "deletion":case "nepotism":case "biz_promise":
        var p=clamp(0.34+(G.hidden.audit-30)/120,0.1,0.85);
        if(r.chance(p)){G.queue.push({event:cloneEvent("old_case")});reports.push("早年一笔往来被重新翻了出来。");if(idx>=0)G.facts.splice(idx,1);G.fired.push(f);}
        else{reports.push("有些旧事暂时没有被提起。");keepDormant(r.range(2,5));}
        break;
      case "hidden_ill":
        G.stats.health=clamp(G.stats.health-r.range(8,16),0,100);
        reports.push("被忽视的身体问题集中爆发了一次。");settleBad();
        break;
      case "collusion":case "coverup":
        G.hidden.discipline=clamp(G.hidden.discipline+r.range(15,25),0,100);
        reports.push("对抗审查的后果被查实。");settleBad();
        break;
      case "reform":
        G.stats.achievement=clamp(G.stats.achievement+r.range(8,14),0,100);
        G.stats.trust=clamp(G.stats.trust+r.range(3,7),0,100);
        reports.push("当年牵头的改革见到了成效。");settleBad();
        break;
      case "faction_a":case "faction_b":keepDormant(1);break;
      default:keepDormant(1);
    }
  });
}
function cloneEvent(id){var e=EVENTS.filter(function(x){return x.id===id;})[0];return e?deep(e):null;}

/* ---------- 年度：考核、换届、排名、财政 ---------- */
function yearEnd(){
  var reports=[];
  ensureProjects();
  resolveFacts(reports);
  annualFinance(reports);
  rankUpdate(reports);
  if((G.year-1)%BAL.termEvery===0&&G.year>1){doTermChange(reports);stateTermChange(reports);pushTermGazette();}
  congressTick(reports);
  yearFlowTrigger();
  worldPerturb();
  var appr=computeAppraisal();
  var decision=planDecision(appr);
  G.queue.push({yearReport:true,reports:reports,appr:appr,decision:decision});
  save();render();
}
function confirmYear(){
  var head=G.queue.shift();
  if(!head)return;
  var d=head.decision;
  G.tenure++;
  if(d.action==="elect"){
    startElection(d.target);
    save();render();
    return;
  }
  if(d.action==="promote"){promote(d);}
  else if(d.action==="demote"||d.action==="fire"){
    G.stats.trust=clamp(G.stats.trust-12,0,100);
    if(d.action==="fire"||G.hidden.discipline>84){endGame("fall",d.reason);return;}
    pushLog("年度考核：受到组织处理","bad");
  }else{pushLog("年度考核："+d.rating+"，继续任职",d.rating==="优秀"?"up":"");}
  var eg=checkEnding();
  if(eg){endGame(eg.id,eg.reason);return;}
  G.month=1;startOfMonth();
  G.pendingBudget=true;
  G.budget=null;   /* 新年度重新编制，旧预算不可重复生效 */
  save();render();
  if(!G.ended&&!G.queue.length)openBudget();
}

/* ---------- 考核与晋升 ---------- */
function computeAppraisal(){
  var s=G.stats,lo=G.local,W=BAL.apprW,N=BAL.apprNeg;
  var focus=focusOf(),fw=BAL.focusWeight||1.6;
  /* 正向项：主责维度权重放大后归一化 —— 同样的人，在匹配的岗位上分数更高 */
  var sum=0,tw=0;
  Object.keys(W).forEach(function(k){
    var v=(k in s)?s[k]:lo[k];
    var w=W[k]*(focus.indexOf(k)>=0?fw:1);
    sum+=v*w;tw+=w;
  });
  var score=tw>0?sum/tw:0;
  /* 负向项 */
  Object.keys(N).forEach(function(k){
    var v=(k in s)?s[k]:(k in lo?lo[k]:G.hidden[k]);
    score-=v*N[k];
  });
  /* 履职不到位：主责方向长期偏低，是失职 */
  var short=0;
  focus.forEach(function(k){
    var v=(k in s)?s[k]:(k in lo?lo[k]:50);
    if(v<45)short+=(45-v)*(BAL.focusShortPenalty||0.25);
  });
  score-=Math.min(short,BAL.focusShortCap||8);
  var sev=G.facts.filter(function(f){return f.kind==="severe";}).length;
  var free=Math.min(sev,BAL.factPenaltyFree);
  var over=Math.max(0,sev-BAL.factPenaltyFree);
  var openRisk=Math.min(free*BAL.factPenalty+over*BAL.factPenaltyHalf,BAL.factPenaltyCap);
  score-=openRisk;
  /* 出生地期望：富庶地区"理所应当"，同样的分数更难被认可 */
  score-=(homeExpect()-1)*14;
  if(G.watched)score-=1.5;
  return clamp(Math.round(score),0,100);
}
function ratingOf(a){return a>=80?"优秀":a>=66?"称职":a>=50?"基本称职":"不称职";}
function planDecision(appr){
  var cur=ROLES[G.rank],next=ROLES[G.rank+1];
  var rating=ratingOf(appr);
  if(!next)return {action:"top",rating:rating};
  var r=new RNG(G.seed+G.year*13+appr);
  var rivalScore=clamp(appr-r.range(-8,10),0,100);
  /* 破格：考核特别优秀，最低任职年限可缩短 1~2 年，否则 13 级台阶走不到正国级 */
  var need=cur.tenure;
  if(G.growth)need-=1;   /* 选调生"重点培养"，最低任职年限可缩短一年 */
  if(appr>=BAL.promoBreakA)need-=1;
  if(appr>=BAL.promoBreakB)need-=1;
  if(need<1)need=1;
  var eligible=G.tenure>=need-1&&appr>=BAL.promoApprFloor(G.rank)
    &&G.stats.trust>=BAL.promoTrustFloor(G.rank)&&G.stats.integrity>=BAL.promoIntegFloor(G.rank);
  if(G.hidden.discipline>75||appr<BAL.demoteAppr){return {action:(r.chance(0.5)?"fire":"demote"),rating:rating,reason:"考核不称职且问题线索集中"};}
  /* 副国级以上：程序变了。考核过关只是"获得提名"，能不能上，要看会议投票。 */
  if(eligible&&appr>=rivalScore){
    var target=G.rank+1;
    if(ELECTIONS[target]){
      if(!G.elect)G.elect={wins:0,fails:0,st:null};
      /* 提名有门槛：连续落选会让组织重新掂量；但优秀到一定程度仍会被再次提名 */
      var nomNeed=clamp(0.30+G.elect.fails*0.16-(appr-60)/300,0.08,0.85);
      if(r.chance(1-nomNeed)||appr>=BAL.promoBreakB){
        return {action:"elect",rating:rating,target:target,
          toTitle:ROLES[target].title,toPlace:rolePlace(target)};
      }
      return {action:"stay",rating:rating,noNominate:true};
    }
    if(r.chance(BAL.promoChance)){
      return {action:"promote",rating:rating,toTitle:next.title,toPlace:rolePlace(G.rank+1)};
    }
  }
  return {action:"stay",rating:rating};
}
/* 退休年龄随级别上移 */
function retireAgeFor(rank){
  var t=(ROLES[rank||0]||ROLES[0]).tier;
  var base=(BAL.retireAgeByTier&&BAL.retireAgeByTier[t])||BAL.retireAge;
  /* 修宪取消任期限制后，正国级可继续任职 */
  if(G&&G.charter&&G.charter.termLimitRemoved&&(t==="state"))base+=BAL.charterTermBonus;
  return base;
}
function promote(d){
  var oldRank=G.rank,oldTier=ROLES[G.rank].tier;
  G.rank++;G.tenure=0;
  var role=ROLES[G.rank];
  /* 首次进入中央部委：分配一个分管领域，主责维度随之改变 */
  if(role.tier==="nation"&&!G.ministry){
    var r0=new RNG(G.seed+G.year*331+17);
    G.ministry=r0.pick(MINISTRIES);
    pushLog("交流到中央，分管"+G.ministry.n+"（"+G.ministry.tone+"）","up");
    enqueueTip("进京履新",
      "你交流到"+G.ministry.n+"，任"+role.title+"。\n\n分管领域："+G.ministry.tone
      +"\n主责方向："+G.ministry.focus.map(function(k){return statName(k);}).join("、")
      +"\n\n这些指标既是你的抓手，也是你的成绩单——主责方向的行动效果与考核权重都会明显倾斜。",
      true,function(){if(!G.ended&&!G.queue.length)openBudget();});
  }
  G.history.push({year:G.year,age:G.age,rank:G.rank,title:roleTitle(G.rank),place:rolePlace(G.rank)});
  pushLog("晋升："+role.title,"up");

  G.stats.trust=clamp(G.stats.trust-4,0,100);

  }
  G.prevRank=oldRank;
}

function checkEnding(){
  var s=G.stats,risk=(G.hidden.discipline+G.hidden.audit)/2;
  var ch=G.charter||{};
  if(s.health<=0)return {id:"death",reason:"长期透支，身体在某个深夜彻底垮了。"};
  if(risk>82&&(hasFact("coverup")||hasFact("collusion")))return {id:"fall",reason:"严重违纪违法问题被立案审查调查。"};
  if(G.hidden.discipline>BAL.dangerDiscipline)return {id:"fall",reason:"问题线索集中，组织决定立案审查调查。"};
  /* 修宪反噬：强行集权后，若反对声浪与风险同时高企，会被党内力量合力扳倒 */
  if(ch.backlash>=3&&risk>68)return {id:"purge",reason:"修宪之后的权力格局引来合力反扑，你在一次内部会议上被停止工作。"};
  if(G.lowFamilyStreak>=4)return {id:"family",reason:"长期疏于家庭，婚姻与亲情走到了尽头。"};
  /* 检举压力累积到顶：材料从多个方向同时涌上来，压不住了 */
  if(G.expose&&G.expose.heat>=90)return {id:"exposed",reason:"材料从几个方向同时递了上来，这一次没有人再替你压住。"};
  /* 修宪成功并坐稳：走到这条路线的终点——长期执政 */
  if(ch.termLimitRemoved&&ch.powerConcentrated&&G.rank>=13&&G.tenure>=4)
    return {id:"charter_king",reason:(ch.unified?"任期限制被取消，国家主席与中央总书记归于你一身，反对的声音被逐一压下。":"任期限制已被取消，反对的声音被逐一压下。")+"此后多年，重大事项只在很小的圈子里决定。"};
  /* 正国级三职：任职满 3 年即抵达对应高度（此后仍可继续向上，不再中途终局） */
  if(G.rank>=14&&G.tenure>=3)return {id:"supreme",reason:(G.charter&&G.charter.unified)?"你身兼国家主席与中央总书记，成为这个国家真正的最高决策者。":"你出任中央总书记，成为这个国家真正的最高决策者。"};
  if(G.rank>=13&&G.tenure>=3)return {id:"head",reason:"你当选国家主席，代表国家站到了台前。"};
  if(G.rank>=12&&G.tenure>=3)return {id:"peak",reason:"你出任国务院总理，站到了行政序列的最高处。"};
  if(G.age>=retireAgeFor(G.rank)){
    if(risk>60||G.facts.some(function(f){return f.kind==="severe";})){
      var r=new RNG(G.seed+999);
      if(r.chance(0.6))return {id:"retire_invest",reason:"退休没几年，当年的项目被倒查，待遇被取消。"};
    }
    if(G.rank>=14)return {id:"supreme",reason:"你以中央总书记的身份到龄卸任，成为这个国家走过这段历史的关键人物。"};
    if(G.rank>=13)return {id:"head",reason:"你以国家主席的身份到龄卸任。"};
    if(G.rank>=12)return {id:"peak",reason:"你以国务院总理的身份到龄卸任，站到了行政序列的最高处。"};
    if(G.rank>=11)return {id:"top",reason:"你进入国家领导人序列，成为各方都要掂量的角色。"};
    if(hasFact("reform")&&s.integrity>=70)return {id:"reformer",reason:"你以推动一方改革的口碑，平安着陆。"};
    if(risk<35&&s.popularity>=62)return {id:"revere",reason:"离任那天，不少群众自发来送你。"};
    return {id:"retire",reason:"到龄退休，回到普通人的日子。"};
  }
  return null;
}
