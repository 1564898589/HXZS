}

/* ============================================================
   三十一、修宪 · 集权路线
   到了副国级，程序之外还有一条路：改规则本身。
   酝酿 → 收集支持 → 提交 → 表决 → 落实条款。
   每一步都在积累风险；通过之后，反对的力量也会开始聚拢。
   ============================================================ */
function charterOpen(){
  if(!G.charter)G.charter={amended:false,stage:0,termLimitRemoved:false,powerConcentrated:false,backlash:0,tries:0};
  G.screen="charter";save();render();
}
function charterUnlocked(){return G.rank>=BAL.charterRankNeed;}
function charterSupport(){return G.charter?clamp(G.charter.support||0,0,100):0;}
function charterVoteRate(){
  var s=G.stats;
  var sup=charterSupport();
  return clamp(0.18+sup*0.0055+s.trust*0.0022+s.peers*0.0020+s.popularity*0.0012
    +G.rank*0.012+(G.charter&&G.charter.powerConcentrated?0.05:0),0,0.99);
}
function charterStart(){
  var ch=G.charter;
  if(!charterUnlocked()){toast("还没到这个层级");return;}
  if(ch.stage>0){toast("这件事已经在办");return;}
  if(G.stats.trust<BAL.charterTrustNeed||G.stats.peers<BAL.charterPeerNeed){
    toast("上级信任与同僚关系都还不够，现在提这件事只会被当成笑话");
    return;
  }
  if(G.energy<20){toast("精力不足，推动这件事至少要 20 点精力");return;}
  G.energy=clamp(G.energy-20,0,100);
  ch.stage=1;ch.tries++;
  ch.support=clamp(8+G.stats.peers*0.25,0,60);
  G.stats.trust=clamp(G.stats.trust-6,0,100);
  G.stats.peers=clamp(G.stats.peers-4,0,100);
  G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost*0.35,0,100);
  pushLog("开始推动宪法修正案","warn");
  enqueueTip("动了不该动的念头",
    "你让人在很小的范围里拟了一份材料，标题只有几个字，但每一个字都压着分量。\n\n"
    +"这件事一旦开始，就没有回头路：同意的会成为你的人，不同意的会成为你的敌人。",false);
  save();render();
}
function charterLobby(){
  var ch=G.charter;
  if(!ch||ch.stage!==1)return;
  if(G.energy<8){toast("精力不足，一次谈话要 8 点精力");return;}
  G.energy=clamp(G.energy-8,0,100);
  G.stats.trust=clamp(G.stats.trust-3,0,100);
  var r=new RNG(G.seed+G.year*331+G.month*17+Math.round(ch.support));
  var rate=clamp(30+G.stats.competence*0.24+G.stats.peers*0.22+G.rank*1.4,15,92);
  var ok=r.chance(rate/100);
  if(ok){
    var gain=r.range(6,13);
    ch.support=clamp(ch.support+gain,0,100);
    enqueueTip("谈成了一个",
      "对方没有立刻表态，但走的时候握了握手，说「材料我看看」。\n"
      +"在这个层级，这就是同意。（支持度 +"+gain+"）",true);
  }else{
    ch.support=clamp(ch.support-3,0,100);
    G.hidden.discipline=clamp(G.hidden.discipline+2,0,100);
    enqueueTip("被挡了回来",
      "对方把材料推了回来，说「这种事我劝你别掺和」。\n"
      +"临走时他看了你一眼，那一眼你读不懂，但你记住了。",false);
  }
  save();render();
}
function charterSubmit(){
  var ch=G.charter;
  if(!ch||ch.stage!==1)return;
  if(ch.support<58){toast("支持度不够（至少 58），现在提交等于自曝其短");return;}
  ch.stage=2;
  G.stats.trust=clamp(G.stats.trust-8,0,100);
  G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost*0.4,0,100);
  pushLog("宪法修正案正式提交","warn");
  enqueueTip("案子递上去了",
    "修正案被正式列入议程。从这一刻起，你做的每一件事都会被放到放大镜下看。\n"
    +"有人开始频繁串门，有人在会上不再发言。",false);
  save();render();
}
function charterVote(){
  var ch=G.charter;
  if(!ch||ch.stage!==2)return;
  var rate=charterVoteRate();
  var need=0.667;
  var r=new RNG(G.seed+G.year*719+13);
  var pass=rate>=need;
  ch.lastVote={rate:rate,need:need,pass:pass};
  if(pass){
    ch.stage=3;ch.amended=true;
    G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost,0,100);
    G.stats.trust=clamp(G.stats.trust+4,0,100);
    pushLog("宪法修正案获得通过","up");
    enqueueTip("通过了",
      "表决结果念出来的时候，会场安静了大约两秒，然后是掌声。\n"
      +"两秒的安静，比掌声更值得记住。\n\n接下来，你可以落实具体的条款了。",true);
  }else{
    ch.stage=1;ch.backlash=(ch.backlash||0)+1;
    G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost*0.8,0,100);
    G.stats.trust=clamp(G.stats.trust-12,0,100);
    G.stats.peers=clamp(G.stats.peers-8,0,100);
    pushLog("宪法修正案未获通过","warn");
    enqueueTip("没有过",
      "票数没有到三分之二。主持人宣布结果的时候，没有看你。\n\n"
      +"从今天起，会有很多人重新评估和你之间的距离。",false);
  }
  save();render();
}
function charterEnact(which){
  var ch=G.charter;
  if(!ch||!ch.amended)return;
  if(which==="term"){
    if(ch.termLimitRemoved){toast("这一条已经落实了");return;}
    ch.termLimitRemoved=true;
    G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost*0.6,0,100);
    ch.backlash=(ch.backlash||0)+1;
    pushLog("取消任期限制条款生效","warn");
    enqueueTip("任期不再是问题",
      "相关条款落地后，关于「到龄」的讨论在会上自然消失了。\n"
      +"你可以在正国级的位子上继续待下去——但每多待一年，记恨你的人也多一个。",false);
  }else if(which==="power"){
    if(ch.powerConcentrated){toast("这一条已经落实了");return;}
    ch.powerConcentrated=true;
    G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost*0.5,0,100);
    ch.backlash=(ch.backlash||0)+1;
    pushLog("权力结构调整条款生效","warn");
    enqueueTip("拍板变得容易了",
      "新的议事规则把更多的决定权收拢到很小的圈子里。\n"
      +"会议开得越来越短，赞成票越来越多——你很难分辨，哪些人是真的同意。",false);
  }else if(which==="unify"){
    /* 一肩挑：国家主席与中央总书记由同一人担任（集权路线的顶点） */
    if(ch.unified){toast("已经一肩挑了");return;}
    if(!ch.powerConcentrated){toast("先把权力集中条款落实，才能谈一肩挑");return;}
    if(G.rank<13){toast("还没到国家主席这一步");return;}
    ch.unified=true;
    G.hidden.discipline=clamp(G.hidden.discipline+BAL.charterRiskCost*0.7,0,100);
    ch.backlash=(ch.backlash||0)+1;
    if(G.rank===13){G.rank=14;G.tenure=0;
      G.history.push({year:G.year,age:G.age,rank:14,title:roleTitle(14),place:rolePlace(14)});}
    pushLog("一肩挑：兼任中央总书记","warn");
    enqueueTip("一肩挑",
      "从此，国家主席与中央总书记由同一个人担任。\n"
      +"权力的边界彻底模糊了——反对的人更沉默，沉默的人更多。",false);
  }
  save();render();
}
/* 修宪之后的月度反噬 */
function charterBacklashTick(){
  var ch=G.charter;
  if(!ch||!ch.amended)return;
  if(G.queue&&G.queue.length)return;
  var r=new RNG(G.seed+G.year*457+G.month*29+7);
  var p=clamp(BAL.charterBacklash*(ch.backlash||1),0,0.5);

  ch.backlash=(ch.backlash||0)+1;
  var ev={
    id:"charter_backlash",

       }},

function modalHtml(){
  if(!G.queue.length)return "";
  var head=G.queue[0];
  if(head.flow)return flowHtml(head);
  if(head.tip)return tipHtml(head);
  if(head.personResult)return personResultHtml(head);
  if(head.endMonthConfirm)return endMonthConfirmHtml(head);
  if(head.yearReport)return yearReportHtml(head);
  if(head.event)return eventHtml(head);
  return "";
}
function eventHtml(head){
  var ev=head.event;
  if(!ev)return "";
  var choices=ev.choices.map(function(c,i){
    var dis=(G.busy&&c.busy===undefined)?'disabled':'';
    return '<button class="choice '+(c.cls==="danger"?"danger":"")+'" '+dis+' onclick="choose('+i+')">'
      +'<span class="ct">'+esc(fillNames(c.t))+'</span>'
      +(c.d?'<span class="cd">'+esc(c.d)+'</span>':"")
      +'<span class="cost-preview">'+fxPreview(c.fx,new RNG(1))+'</span></button>';
  }).join("");
  return '<div class="overlay"><div class="modal" style="position:relative">'
    +'<div class="card-h"><h2>'+esc(ev.title)+'</h2><span class="right">'+absYear()+'年'+G.month+'月</span></div>'
    +'<div class="card-b"><div class="scene-text">'+esc(fillNames(ev.text))+'</div>'
    +'<div class="choices">'+choices+'</div></div></div></div>';
}
function tipHtml(head){
  var t=head.tip;
  return '<div class="overlay"><div class="modal"><div class="card-h"><h2>'+esc(t.title)+'</h2></div>'
   +'<div class="card-b"><div class="scene-text '+(t.ok?"good-text":"bad-text")+'" style="white-space:pre-line">'+esc(t.msg)+'</div>'
   +'<div class="btn-row" style="margin-top:16px"><button class="btn seal" onclick="closeTip()">知道了</button></div>'
   +'</div></div></div>';
}
function personResultHtml(head){
  var pr=head.personResult;
  return '<div class="overlay"><div class="modal"><div class="card-h"><h2>'+esc(pr.act)+' · '+esc(pr.name)+'</h2></div>'
   +'<div class="card-b"><div class="scene-text '+(pr.ok?"good-text":"bad-text")+'">'+esc(pr.msg)+'</div>'
   +'<div class="btn-row" style="margin-top:16px"><button class="btn seal" onclick="closePersonResult()">继续</button></div>'

function endMonthConfirmHtml(head){
  return '<div class="overlay"><div class="modal"><div class="card-h"><h2>提前结束本月？</h2></div>'
   +'<div class="card-b"><div class="scene-text">这个月还有 <b>'+head.remain+'</b> 个白天时段没安排。提前结束，本月的政绩和关系经营会偏少，时间却照样往前走。</div>'

   +'<button class="btn ghost" onclick="confirmEndMonth(false)">回去再安排</button>'
   +'</div></div></div></div>';

function yearReportHtml(head){
  var d=head.decision;
  var reports=head.reports.length?head.reports.map(function(r){return '<div class="quote-line">'+esc(r)+'</div>';}).join("")
    :'<div class="quote-line">这一年波澜不惊。</div>';
  var outcome;
  if(d.action==="promote")outcome='<div style="color:var(--pine);font-weight:600;margin-top:10px">经组织研究，拟提拔你为<b>'+esc(d.toTitle)+'</b>。</div>';
  else if(d.action==="top")outcome='<div style="color:var(--pine);font-weight:600;margin-top:10px">你已走到这条路线的高处。</div>';
  else if(d.action==="demote"||d.action==="fire")outcome='<div style="color:var(--seal);font-weight:600;margin-top:10px">'+esc(d.reason)+'，年度考核结果不利。</div>';
  else outcome='<div style="color:var(--ink-2);margin-top:10px">年度考核：<b>'+esc(d.rating)+'</b>，继续担任现职。</div>';
  var me=myJurisdiction();
  var rankLine=me?('<div class="quote-line">'+esc(boardName())+'：位列第 <b>'+me.rank+'</b> 名（'+me.total+' 分）'+(me.prevRank&&me.prevRank!==me.rank?(me.prevRank>me.rank?"，上升 "+(me.prevRank-me.rank)+" 位":"，下降 "+(me.rank-me.prevRank)+" 位"):"")+'。</div>'):"";
  return '<div class="overlay"><div class="modal"><div class="card-h"><h2>'+absYear()+'年度 · 考核与回顾</h2></div>'
    +'<div class="card-b">'
    +'<div class="scene-kicker">年度考核得分 '+head.appr+' · '+esc(d.rating)+'</div>'
    +rankLine+reports+outcome
    +placeScorecardHtml()
    +'<div class="btn-row" style="margin-top:16px"><button class="btn block seal" onclick="confirmYear()">进入第'+(G.year+1)+'年</button></div>'
    +'</div></div></div>';
}
function flowHtml(head){
  var f=head.flow;
  var body="";
  var cname=f.company||"企业";
  function com(s){return (s||"").replace(/\[COM\]/g,cname);}
  if(!f.done){
    var st=f.script[f.step];
    var steps=f.script.map(function(s,i){
      return '<span class="step '+(i<f.step?"done":i===f.step?"now":"")+'"><i>'+(i+1)+'</i>'+esc(s.t.split(" · ")[0])+'</span>';
    }).join('<span class="step-sep">›</span>');
    var opts;
    if(f.kind==="xunshi"){
      opts='<button class="pact" onclick="flowPick(0)"><div class="pact-top"><span class="pact-name">动真碰硬：'+esc(st.hard.n)+'</span>'
        +'<span class="pact-rate">高风险高回报</span></div><div class="cost-preview">'+fxPreview(st.hard.fx,new RNG(1))+'</div></button>'
        +'<button class="pact" onclick="flowPick(1)"><div class="pact-top"><span class="pact-name">稳妥处理：'+esc(st.soft.n)+'</span>'
        +'<span class="pact-rate">低风险低回报</span></div><div class="cost-preview">'+fxPreview(st.soft.fx,new RNG(1))+'</div></button>';
    }else{
      opts=st.opts.map(function(o,i){
        return '<button class="pact" onclick="flowPick('+i+')"><div class="pact-top">'
          +'<span class="pact-name">'+esc(o.t)+'</span>'
          +'<span class="pact-rate">'+(o.tone===1?"进取":o.tone===0?"稳妥":"保守")+(f.kind==="nego"?(" · 诚意 "+(o.deal>0?"+":"")+o.deal):"")+'</span></div>'
          +'<div class="pact-desc">'+esc(com(o.d))+'</div>'
          +'<div class="cost-preview">'+fxPreview(o.fx,new RNG(1))+'</div></button>';
      }).join("");
    }
    var meter="";
    if(f.kind==="nego"){
      meter='<div class="stake">'+esc(cname)+' 的投资意愿 <b>'+f.meter+'</b> / 100（低于 48 谈判失败，66 以上当场签约）</div>'
        +'<div class="bud-bar" style="margin-bottom:12px"><i style="width:'+f.meter+'%;background:'+(f.meter>=66?"var(--pine)":f.meter>=48?"var(--gold)":"var(--seal)")+'"></i></div>';
    }
    body='<div class="agenda"><div class="agenda-h"><div class="no">'+esc(f.title)+(f.kind==="nego"?(" · "+esc(cname)):"")+' · 第 '+(f.step+1)+' / '+f.script.length+' 步</div>'
      +'<h3>'+esc(st.t)+'</h3></div><div class="agenda-b">'
      +'<div class="scene-text">'+esc(com(st.d))+'</div>'+meter+opts+'</div></div>'
      +(f.log.length?('<div class="sec-t" style="margin-top:16px">已作的选择</div>'
        +f.log.map(function(l){return '<div class="log-item '+(l.good?"up":"warn")+'"><span class="when">'+esc(l.t.split(" · ")[0])+'</span>'
          +'<span class="what">'+esc(l.choice)+' —— '+esc(l.note||"")+'</span></div>';}).join("")):"");
    var stepsCard='<div class="card"><div class="card-b"><div class="steps">'+steps+'</div></div></div>';
    return '<div class="overlay"><div class="modal" style="max-width:640px">'
      +'<div class="card-h"><h2>'+esc(f.title)+'</h2><span class="right">'+absYear()+'年'+G.month+'月</span></div>'
      +'<div class="card-b">'+stepsCard+body+'</div></div></div>';
  }
  var res=f.result||{t:"结束",ok:true,msg:""};
  body='<div class="result"><div class="rt '+(res.ok?"ok":"no")+'">'+esc(res.t)+'</div>'
    +'<div class="scene-text">'+esc(res.msg)+'</div>'
    +'<div class="fxline">'+f.log.map(function(l){return '<span class="fxc">'+esc(l.choice)+'</span>';}).join("")+'</div></div>';
  return '<div class="overlay"><div class="modal" style="max-width:640px">'
    +'<div class="card-h"><h2>'+esc(f.title)+' · 结果</h2></div>'
    +'<div class="card-b">'+body
    +'<div class="btn-row" style="margin-top:16px"><button class="btn seal block" onclick="flowNext()">继续</button></div>'
    +'</div></div></div>';
}

/* ============================================================
   三十二、交互与存档
   ============================================================ */
function restart(){G=null;go("#/start");}
function goStart(){go("#/start");}
function manualSave(){save();toast("进度已保存（也会自动保存）");}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}}
function readSave(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;
    var o=JSON.parse(raw);
    if(!o||!o.stats)return null;
    return {roleLabel:ROLES[o.rank]?ROLES[o.rank].title:"干部",year:o.year,month:o.month,raw:o};
  }catch(e){return null;}
}
function continueGame(){
  var s=readSave();if(!s){toast("没有找到存档");return;}
  G=s.raw;
  if(!G.stats)G.stats=baseStats();
  /* 出生地：旧存档没有 home 字段时按江澜省补上，并把世界观名字重新展开 */
  if(!G.home||!HOME_REGIONS.some(function(x){return x.k===G.home;}))G.home="jianglan";
  applyHome(G.home);
  if(!G.local)G.local=baseLocal();
  if(!G.hidden)G.hidden=baseHidden();
  if(!G.charter)G.charter={amended:false,stage:0,termLimitRemoved:false,powerConcentrated:false,backlash:0,tries:0};
  if(G.charter.unified===undefined)G.charter.unified=false;
  if(G.conn===undefined)G.conn=0;
  if(G.growth===undefined)G.growth=false;
  if(G.skill===undefined)G.skill=null;
  if(!G.expose)G.expose={heat:0,reports:0,lastMonth:0,quiet:0};
  if(!G.lobby)G.lobby={used:0,quota:0,leak:0};
  if(!G.elect)G.elect={wins:0,fails:0,st:null};
  if(G.elect.st&&!G.elect.st.cfg)G.elect.st=null;
  if(G.screen==="election"&&!G.elect.st)G.screen=null;
  if(!G.world||!G.world.npcs||!G.world.npcs.length){buildWorld(new RNG(G.seed+777));}
  if(!G.villainId||!findNpc(G.villainId)){
    var v=G.world.npcs.filter(function(x){return x.villain;})[0]
       || G.world.npcs.filter(function(x){return x.tier==="state";})[0];
    if(v){v.villain=true;G.villainId=v.id;}
  }
  rebuildUsedNames();
  if(!G.npc||!G.npc.boss){makeClosePeople(new RNG(G.seed+31));}
  if(!G.juris)buildJurisdictions(new RNG(G.seed+53));
  if(!G.sched)initSched();
  if(!G.rel)initRelations();
  if(!G.secrets)G.secrets=[];
  if(!G.schemes)G.schemes=[];
  if(!G.projects)ensureProjects();
  if(!G.budget)G.budget=initBudget();
  if(!G.fired)G.fired=[];
  if(!G.facts)G.facts=[];
  if(!G.history)G.history=[];
  if(!G.log)G.log=[];
  if(G.ministry===undefined)G.ministry=null;
  if(G.prevRank===undefined)G.prevRank=0;
  if(!G.rankTab)G.rankTab="total";
  if(G.mapPick===undefined)G.mapPick=null;
  /* 旧存档的辖区条目缺 GDP/人口/全国行，补齐后再进游戏 */
  if(G.juris){
    ["county","city","prov"].forEach(function(t){
      var b=G.juris[t];if(!b||!b.list)return;
      b.list.forEach(function(e){
        if(e.gdp===undefined)e.gdp=0;
        if(e.pop===undefined)e.pop=0;
        if(e.prevGdp===undefined)e.prevGdp=0;
        if(e.isNation===undefined)e.isNation=false;
      });
    });
    var pb=G.juris.prov;
    if(pb&&!pb.list.some(function(e){return e.isNation;})){
      pb.list.push({name:"全国",tier:"prov",self:false,chiefId:null,dims:{},total:0,
        gdp:nationalGdp(),pop:nationalPop(),prevGdp:0,prev:0,rank:0,prevRank:0,isNation:true});
    }
    if(G.juris.county&&!G.juris.city)G.juris.city=G.juris.county;
  }
  if(G.queue===undefined)G.queue=[];
  if(!G.leadership||!G.leadership.length)buildLeadership();
  G.screen=null;G.personView=null;G.meetState=null;
  save();
  go("#/game");
}

/* 给 NPC 用：tier → 代表性品级 */
function tierGrade(tier){
  return {town:"正科级",county:"正处级",city:"正厅级",prov:"正部级",nation:"正部级",state:"副国级"}[tier]||"科员级";
}
function npcPortraitHtml(n,opt){
  opt=opt||{};
  var g=tierGrade(n.tier);
  var fake=ROLES.map(function(r,i){return {i:i,g:r.grade};}).filter(function(x){return x.g===g;});
  var rank=fake.length?fake[0].i:0;
  return officialPortraitHtml(rank,{age:n.age,w:opt.w||84,label:false,compact:true,raw:opt.raw});
}
/* 名录里用的小头像（直接返回 svg，由 .net-face 控制大小） */
function npcFaceHtml(n){
  return '<div class="net-face">'+npcPortraitHtml(n,{raw:true})+'</div>';
}

  text:"上级选定你辖内若干村作为乡村振兴示范点，要求环境整治、产业培育双达标。",
  choices:[
   {t:"真金白银投入、久久为功", d:"群众得实惠", fx:{livelihood:[7,10],popularity:[4,6],finance:[-3,-2]}},
   {t:"抓几个亮点、以点带面", d:"有面子，里子一般", fx:{livelihood:[2,4],achievement:[2,3]}},
   {t:"把资金堆到门面工程", d:"政绩工程", fx:{achievement:[4,6],livelihood:[1,2]}, fact:{id:"grievance",title:"华而不实的示范点",detail:"资金错配，群众不满",kind:"social",arm:[2,4]}, cls:"danger"}]},
 {id:"pol_budget", name:"财政过紧日子",
  text:"上级要求树立过紧日子思想，压减一般性支出，把有限的钱用在刀刃上。",
  choices:[
   {t:"带头压支出、保民生", d:"勒紧裤腰带", fx:{finance:[5,7],livelihood:[3,5],peers:[-3,-1]}},
   {t:"象征性压一压", d:"意思到了", fx:{finance:[1,2]}},
   {t:"明压暗保、另开口子", d:"账做得漂亮", fx:{finance:[2,3],debt:[4,6]}, fact:{id:"fake_docs",title:"压而不实的财政账",detail:"另开口子，虚列支出",kind:"severe",arm:[2,4]}, cls:"danger"}]},
 {id:"pol_clean", name:"基层减负与作风整治",
  text:"上级下文整治形式主义、官僚主义，要求切实为基层减负、清理文山会海。",
  choices:[
   {t:"真减负、真清理", d:"下面喘了口气", fx:{popularity:[5,8],peers:[3,5],achievement:[1,2]}},
   {t:"开会布置减负", d:"用文件落实文件", fx:{popularity:[1,2]}, fact:{id:"grievance",title:"减负不减负",detail:"文山会海依旧",kind:"social",arm:[2,4]}},
   {t:"口号喊得响、行动看不见", d:"风头过了就好", fx:{peers:[1,2],popularity:[-3,-1]}, cls:"danger"}]}
];
function policyPool(){
  return POLICY_POOL.filter(function(p){return !G.flags.policySeen||G.flags.policySeen.indexOf(p.id)<0;});
}
function triggerPolicy(){
  if(!G||G.ended||G.screen)return;
  if(G.month!==6&&G.month!==12)return;
  if(!G.flags)G.flags={};
  if(!G.flags.policySeen)G.flags.policySeen=[];
  if(G.flags.policyDone===monthSeq())return;
  G.flags.policyDone=monthSeq();
  var pool=policyPool();
  if(!pool.length)return;
  var r=new RNG(G.seed+G.year*53+G.month*3);
  var pol=r.pick(pool);
  G.flags.policySeen.push(pol.id);
  var ev={id:pol.id,title:"上级文件 · "+pol.name,text:pol.text,choices:pol.choices};
  ev._after=null;ev._fromAction=false;
  G.queue.push({event:ev});
}
/* ---------- 大会倒计时（间隔按现实制度） ---------- */
function nextCongressYear(y){ var yy=y; while(yy%5!==2)yy++; return yy; }
function congressNumber(y){ return Math.round((y-2002)/5)+16; }
function monthDist(fy,fm,ty,tm){ return (ty-fy)*12+(tm-fm); }
function fmtDist(m){
  if(m<=0)return "本月";
  var y=Math.floor(m/12),mm=m%12;
  if(y<=0)return mm+" 个月";
  if(mm===0)return y+" 年";
  return y+" 年 "+mm+" 个月";
}
function meetingCountdownHtml(){
  var ay=absYear(),am=G.month;
  var rows=[];
  /* 全国两会：每年 3 月 */
  var scY=ay,scM=3;
  if(ay*12+am>ay*12+3)scY=ay+1;
  rows.push({n:"全国两会（人大 · 政协）",d:monthDist(ay,am,scY,scM),tag:"每年 3 月"});
  /* 党的全国代表大会：每 5 年（逢 2、7 年份） */
  var cy=nextCongressYear(ay);
  rows.push({n:"党的第"+congressNumber(cy)+"次全国代表大会",d:monthDist(ay,am,cy,10),tag:"每 5 年 · 逢 2/7"});
  /* 中央全会：每年 10 月 */
  var py=ay,pm=10;
  if(ay*12+am>ay*12+10)py=ay+1;
  rows.push({n:"中央委员会全体会议（全会）",d:monthDist(ay,am,py,pm),tag:"每年 10 月"});
  return '<div class="card"><div class="card-h"><h2>大会倒计时</h2><span class="right">按制度间隔</span></div><div class="card-b">'
    +'<div class="mtg-list">'+rows.map(function(r){
      return '<div class="mtg-row"><div class="mtg-name">'+esc(r.n)+'</div>'
        +'<div class="mtg-dist">距召开还有 <b>'+fmtDist(r.d)+'</b></div>'
        +'<div class="mtg-tag">'+esc(r.tag)+'</div></div>';
    }).join("")+'</div>'
    +'<div class="delta-note">这些会议决定国家的走向，也决定很多人的去向。等你站得足够高，也许有一天，会坐在其中一张椅子上。</div>'
    +'</div></div>';
}


/* ============================================================
   三十六、邸报（报纸样式）· 大会方向 · 政策汇编
   ------------------------------------------------------------
   把换届、大会召开后的方向/改革方向、政策文件、风闻汇总成一份
   仿古报纸，点击即可通览，不再一条条堆在首页。
   大会（党代会每 5 年、全会每年）召开时会产生「方向」，进报纸
   头条，并对地方治理产生轻量影响。
   ============================================================ */
var CONGRESS_DIRECTIONS=[
 {n:"高质量发展", d:"把发展质量摆在首位，不再一味追求速度。", fx:{economy:-2,environment:3,finance:2}},
 {n:"全面深化改革", d:"向改革要动力，简政放权、优化营商环境。", fx:{economy:3,sentiment:2,finance:1}},
 {n:"乡村振兴战略", d:"把更多资源投向农业农村，缩小城乡差距。", fx:{livelihood:3,economy:1,popularity:1}},
 {n:"创新驱动发展", d:"以科技创新引领产业升级。", fx:{economy:2,finance:2}},
 {n:"绿色低碳转型", d:"生态优先、绿色发展。", fx:{environment:4,economy:-1}},
 {n:"共同富裕", d:"在做大蛋糕的同时分好蛋糕。", fx:{livelihood:2,popularity:2,petition:-2}},
 {n:"扩大高水平开放", d:"以开放促改革、促发展。", fx:{economy:3,finance:1}},
 {n:"全面依法治国", d:"把权力关进制度的笼子。", fx:{safety:2,sentiment:1,audit:2}}
];
function pushGazette(type,title,text){
  if(!G.gazette)G.gazette=[];
  G.gazette.unshift({type:type,title:title,text:text,year:G.year,month:G.month,abs:absYear()});
  if(G.gazette.length>48)G.gazette.pop();
}
/* 大会召开：党代会（逢 2/7 年份）定方向并影响地方；全会（每年）发公报 */
function congressTick(reports){
  var ay=absYear();
  var r=new RNG(G.seed+ay*211+7);
  if(ay%5===2){
    var dir=r.pick(CONGRESS_DIRECTIONS);
    pushGazette("congress","党的第"+congressNumber(ay)+"次全国代表大会胜利闭幕",
      "大会确定了未来一个时期的总方向——「"+dir.n+"」："+dir.d
      +" 这一方向将贯穿此后五年的各项工作。");
    Object.keys(dir.fx).forEach(function(k){
      if(k in G.local)G.local[k]=clamp(G.local[k]+dir.fx[k],0,100);
    });
    reports.push("大会闭幕后，全国掀起学习「"+dir.n+"」的热潮，本地的工作重心也随之调整。");
  }else{
    var d2=r.pick(CONGRESS_DIRECTIONS);
    pushGazette("plenum","中央委员会全体会议公报",
      "全会审议通过若干重要文件，强调要持续深化「"+d2.n+"」，并就明年的重点工作作出部署。");
  }
}
/* 换届通稿（供 stateTermChange 调用时留档到邸报） */
function pushTermGazette(){
  if(!G.leadership||!G.leadership.length)return;
  var top=G.leadership.slice(0,3).map(function(L){return L.post+" "+((L.npc&&L.npc.name)||"—");}).join("、");
  pushGazette("term","新一届中央领导班子产生",
    "经有关会议选举，新一届中央领导班子名单确定："+top+"等。名单详见「中央领导」栏目。");
}
/* ---------- 报纸视图 ---------- */
function gazetteHtml(){
  var ay=absYear();
  var head=(G.gazette&&G.gazette[0])||null;
  var hl=head?('<div class="gz-headline">'
    +'<div class="gz-hl-kicker">'+gzTypeLabel(head.type)+' · '+head.abs+'年'+head.month+'月</div>'
    +'<div class="gz-hl-title">'+esc(head.title)+'</div>'
    +'<div class="gz-hl-text">'+esc(head.text)+'</div></div>')
    :'<div class="gz-headline"><div class="gz-hl-title">本刊创刊</div><div class="gz-hl-text">邸报创刊，记录这个国家的每一次换届、每一场大会、每一份政策。</div></div>';

  /* 中央班子 */
  var lead=G.leadership?G.leadership.slice(0,7).map(function(L){
    var p=L.npc;if(!p)return "";
    return '<div class="gz-li"><b>'+esc(L.post)+'</b><span>'+esc(p.name)+'</span></div>';
  }).join(""):"";
  var leadCol='<div class="gz-col"><div class="gz-col-h">中央领导班子</div>'+lead
    +'<div class="gz-more"><button class="mini-btn" onclick="closeScreen();openScreen(\'leadership\')">查看完整名单</button></div></div>';

  /* 政策发布 */
  var seen=G.flags&&G.flags.policySeen?G.flags.policySeen:[];
  var pols=seen.map(function(id){
    var p=POLICY_POOL.filter(function(x){return x.id===id;})[0];
    return p?('<div class="gz-item"><div class="gz-item-t">'+esc(p.name)+'</div>'
      +'<div class="gz-item-d">'+esc(p.text)+'</div></div>'):"";
  }).join("");
  var polCol='<div class="gz-col"><div class="gz-col-h">政策文件</div>'
    +(pols||'<div class="gz-empty">尚无文件下达。</div>')+'</div>';

  /* 风闻 */
  var rumors=G.world&&G.world.rumors?G.world.rumors.slice(0,8):[];
  var rumCol='<div class="gz-col"><div class="gz-col-h">风闻</div>'
    +rumors.map(function(x){
      return '<div class="gz-item"><span class="gz-tag '+esc(x.kind)+'">'+esc(rumorKindMeta(x.kind).l)+'</span>'
        +'<span class="gz-item-t">'+esc(x.text)+'</span>'
        +'<span class="gz-when">'+(START_YEAR+x.year-1)+'.'+x.month+'</span></div>';
    }).join("")
    +'</div>';

  /* 大会方向归档 */
  var dirs=(G.gazette||[]).filter(function(g){return g.type==="congress"||g.type==="plenum";}).slice(0,4);
  var dirCol='<div class="gz-col"><div class="gz-col-h">大会 · 方向</div>'
    +(dirs.length?dirs.map(function(g){
      return '<div class="gz-item"><div class="gz-item-t">'+esc(g.title)+'</div>'
        +'<div class="gz-item-d">'+esc(g.text)+'</div>'
        +'<span class="gz-when">'+g.abs+'年'+g.month+'月</span></div>';
    }).join(""):'<div class="gz-empty">尚未召开大会。</div>')
    +'</div>';

  var body='<div class="gazette">'
    +'<div class="gz-masthead"><div class="gz-name">中央邸报</div>'
      +'<div class="gz-sub">中央新闻办公室编印 · 第 '+(G.year)+' 期</div>'
      +'<div class="gz-date">'+ay+'年'+G.month+'月</div></div>'
    +'<div class="gz-rule"><span></span></div>'
    +hl
    +'<div class="gz-columns">'+leadCol+polCol+rumCol+dirCol+'</div>'
    +'<div class="gz-foot">本邸报所载为游戏内架空内容，仅供玩法参考。</div>'
    +'</div>';
  return '<div class="screen"><div class="screen-in">'
    +screenTop("邸报 · 报纸",ay+'年'+G.month+'月 · 换届 / 大会 / 政策 一览',
      '<button class="icon-btn" onclick="closeScreen()">返回</button>')
    +'<div class="screen-body">'+body+'</div></div></div>';
}
function gzTypeLabel(t){
  return {congress:"大会",plenum:"全会",term:"换届",policy:"政策"}[t]||"要闻";
}

   启动：放在所有模块之后，确保各分块的 var 都已赋值

boot();
